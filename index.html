<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostPilot Studio</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0c0e13; color: #e2e4ed; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #gate { position: fixed; inset: 0; background: #0c0e13; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #gate-box { background: #10131c; border: 1px solid #272e44; border-radius: 12px; padding: 36px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; width: 340px; }
    #gate-logo { font-size: 20px; font-weight: 700; color: #f59e0b; letter-spacing: 0.3px; }
    #gate-sub { font-size: 12px; color: #6b7080; margin-top: -12px; }
    #gate-input { width: 100%; padding: 10px 14px; background: #181d29; border: 1px solid #303859; border-radius: 7px; color: #e2e4ed; font-size: 14px; font-family: inherit; outline: none; text-align: center; letter-spacing: 2px; transition: border-color 0.15s; }
    #gate-input:focus { border-color: #f59e0b; }
    #gate-input.error { border-color: #ef4444; animation: shake 0.3s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    #gate-btn { width: 100%; padding: 10px; background: #f59e0b; color: #0c0e13; font-weight: 700; font-size: 14px; font-family: inherit; border: none; border-radius: 7px; cursor: pointer; transition: opacity 0.15s; }
    #gate-btn:hover { opacity: 0.88; }
    #gate-error { font-size: 12px; color: #ef4444; min-height: 16px; text-align: center; }

    #topbar { display: flex; align-items: center; background: #10131c; border-bottom: 1px solid #272e44; padding: 0 20px; height: 48px; flex-shrink: 0; }
    #brand { font-size: 14px; font-weight: 700; color: #f59e0b; letter-spacing: 0.3px; margin-right: 28px; white-space: nowrap; }
    .tab { display: flex; align-items: center; gap: 7px; padding: 0 18px; height: 48px; font-size: 13px; font-weight: 600; color: #6b7080; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; user-select: none; white-space: nowrap; }
    .tab:hover { color: #c0c4d4; }
    .tab.active { color: #f59e0b; border-bottom-color: #f59e0b; }

    #frames { flex: 1; position: relative; overflow: hidden; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none; }
    iframe.visible { display: block; }

    .loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0c0e13; color: #6b7080; font-size: 13px; transition: opacity 0.3s; }
    .loader.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 32px; height: 32px; border: 3px solid #272e44; border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #app { display: none; height: 100%; flex-direction: column; }
    #app.visible { display: flex; }
  </style>
</head>
<body>

  <div id="gate">
    <div id="gate-box">
      <div id="gate-logo">PostPilot Studio</div>
      <div id="gate-sub">Private Access Only</div>
      <input id="gate-input" type="password" placeholder="Enter password" autocomplete="off" onkeydown="if(event.key==='Enter') unlock()" />
      <div id="gate-error"></div>
      <button id="gate-btn" onclick="unlock()">Enter →</button>
    </div>
  </div>

  <div id="app">
    <div id="topbar">
      <div id="brand">PostPilot Studio</div>
      <div class="tab active" id="tab-creator" onclick="switchTab('creator')">🎨 Post Creator</div>
      <div class="tab" id="tab-scheduler" onclick="switchTab('scheduler')">📅 Scheduler</div>
    </div>
    <div id="frames">
      <div class="loader" id="loader"><div class="spinner"></div><span>Loading…</span></div>
      <iframe id="frame-creator"   src="" class="visible" onload="onFrameLoad('creator')"></iframe>
      <iframe id="frame-scheduler" src=""                  onload="onFrameLoad('scheduler')"></iframe>
    </div>
  </div>

  <script>
    // SHA-256 hash of the password — the real password is never stored in this file
    const HASH = 'dc8a778f4c2b20bffdc5c5bcd207c11255c802c6be24058f02c3d8fa23a4a00a';
    const SESSION_KEY = 'pps_auth';

    async function hashInput(str) {
      const buf    = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function unlock() {
      const input = document.getElementById('gate-input');
      const err   = document.getElementById('gate-error');
      const hashed = await hashInput(input.value);
      if (hashed === HASH) {
        sessionStorage.setItem(SESSION_KEY, '1');
        showApp();
      } else {
        err.textContent = 'Incorrect password. Please try again.';
        input.classList.add('error');
        input.value = '';
        setTimeout(() => input.classList.remove('error'), 400);
        input.focus();
      }
    }

    function showApp() {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      document.getElementById('frame-creator').src   = 'PPPostCreator_v50b.html';
      document.getElementById('frame-scheduler').src = 'PostPilot.html';
    }

    const loaded = { creator: false, scheduler: false };

    function onFrameLoad(id) {
      loaded[id] = true;
      const activeId = document.querySelector('.tab.active').id.replace('tab-', '');
      if (id === activeId) document.getElementById('loader').classList.add('hidden');
    }

    function switchTab(id) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      document.querySelectorAll('iframe').forEach(f => f.classList.remove('visible'));
      document.getElementById('frame-' + id).classList.add('visible');
      if (!loaded[id]) {
        document.getElementById('loader').classList.remove('hidden');
      } else {
        document.getElementById('loader').classList.add('hidden');
      }
    }

    if (sessionStorage.getItem(SESSION_KEY) === '1') showApp();
  </script>

</body>
</html>
