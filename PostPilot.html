function buildQueuePreview() {
  const { postsPerDay, startHour, endHour, startDate, applyTo } = state.queueSettings;
  const ppd = Math.max(1, parseInt(postsPerDay) || 1);
  const platforms = applyTo === 'all' ? Object.keys(PLATFORMS) : [state.activePlatform];
  const totalPosts = platforms.reduce((s, p) => s + (state.posts[p] || []).filter(x => !x.manualUpload).length, 0);
  const unscheduled = platforms.reduce((s, p) => s + (state.posts[p] || []).filter(x => !x.manualUpload && !x.scheduledDate).length, 0);
  if (!totalPosts) return `<span style="color:var(--text-muted)">No posts to distribute yet. Use "Add to Queue" in the composer to build your queue without dates.</span>`;

  // Check if any platform would exceed its daily limit
  const limitWarnings = platforms
    .filter(p => p !== 'shopify' && ppd > getDailyLimit(p))
    .map(p => `${PLATFORMS[p].name} (max ${getDailyLimit(p)}/day)`);

  const days = Math.ceil(totalPosts / ppd);
  const sh = parseInt(startHour), eh = parseInt(endHour);
  const slots = generateTimeSlots(ppd, sh, eh);
  const slotsLabel = slots.map(s => formatHour(s)).join(', ');
  const endD = new Date((startDate || new Date().toISOString().split('T')[0]) + 'T00:00:00');
  endD.setDate(endD.getDate() + days - 1);
  const endLabel = endD.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const platformLabel = applyTo === 'all' ? 'all platforms' : PLATFORMS[state.activePlatform].name;

  let warning = '';
  if (limitWarnings.length) {
    warning = `<div style="color:#f59e0b;font-size:12px;margin-top:6px">⚠️ Posts/day will be capped to spam-safe limits for: ${limitWarnings.join(', ')}</div>`;
  }
  const unscheduledNote = unscheduled > 0
    ? `<div style="color:#a0a8d0;font-size:12px;margin-top:4px">📋 ${unscheduled} unscheduled post${unscheduled !== 1 ? 's' : ''} in queue will be assigned dates when you distribute.</div>`
    : '';

  return `<span style="color:var(--text-success)">✓</span> <strong>${totalPosts}</strong> post${totalPosts !== 1 ? 's' : ''} across <strong>${platformLabel}</strong> spread over <strong>${days} day${days !== 1 ? 's' : ''}</strong> (ends ${endLabel}) &mdash; posting at ${slotsLabel}${warning}${unscheduledNote}`;
}

function generateTimeSlots(ppd, startH, endH) {
  if (ppd === 1) return [`${String(startH).padStart(2,'0')}:00`];
  const slots = [];
  const range = Math.max(1, endH - startH);
  for (let i = 0; i < ppd; i++) {
    const h = Math.round(startH + (range / (ppd - 1)) * i);
    slots.push(`${String(Math.min(h, endH)).padStart(2,'0')}:00`);
  }
  return slots;
}

function formatHour(timeStr) {
  const [h] = timeStr.split(':');
  const hour = parseInt(h);
  return hour === 0 ? '12am' : hour < 12 ? `${hour}am` : hour === 12 ? '12pm' : `${hour - 12}pm`;
}

function distributeQueue() {
  const { postsPerDay, startHour, endHour, startDate, applyTo } = state.queueSettings;
  if (!startDate) { showToast('Please set a start date.', 'error'); return; }
  const ppd = Math.max(1, parseInt(postsPerDay) || 1);
  const sh = parseInt(startHour), eh = parseInt(endHour);
  if (sh >= eh) { showToast('End time must be after start time.', 'error'); return; }
  const platforms = applyTo === 'all' ? Object.keys(PLATFORMS) : [state.activePlatform];
  const slots = generateTimeSlots(ppd, sh, eh);
  let newPosts = { ...state.posts };
  let totalMoved = 0;
  const startD = new Date(startDate + 'T00:00:00');

  platforms.forEach(platform => {
    const dailyCap = getDailyLimit(platform);
    const effectivePpd = Math.min(ppd, dailyCap);
    // Separate manual uploads from schedulable posts
    const manualPosts = (state.posts[platform] || []).filter(p => p.manualUpload);
    const posts = (state.posts[platform] || []).filter(p => !p.manualUpload);
    if (!posts.length) return;
    // Sort: dated posts first (preserving their order), undated posts appended at end
    const dated = posts.filter(p => p.scheduledDate).sort((a, b) => a.scheduledDate.localeCompare(b.scheduledDate));
    const undated = posts.filter(p => !p.scheduledDate);
    const ordered = [...dated, ...undated];
    const slots2 = generateTimeSlots(effectivePpd, sh, eh);
    const updated = ordered.map((post, idx) => {
      const dayOffset = Math.floor(idx / effectivePpd);
      const slotIdx = idx % effectivePpd;
      const d = new Date(startD);
      d.setDate(d.getDate() + dayOffset);
      const dateStr = d.toISOString().split('T')[0];
      return { ...post, scheduledDate: dateStr, scheduledTime: slots2[slotIdx] };
    });
    newPosts[platform] = sortPosts([...updated, ...manualPosts]);
    totalMoved += updated.length;
  });

  state.posts = newPosts;
  savePosts(newPosts);
  state.showQueuePanel = false;
  render();
  const days = platforms.reduce((max, p) => {
    const len = (newPosts[p] || []).length;
    return Math.max(max, Math.ceil(len / ppd));
  }, 0);
  showToast(`Distributed ${totalMoved} post${totalMoved !== 1 ? 's' : ''} across ${days} day${days !== 1 ? 's' : ''}!`);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── CELEBRATION ENGINE ─────────────────────────────────────────────────────

// Persist mute preference
(function loadCelebrationPref() {
  try { if (localStorage.getItem('postflow_chime_muted') === '1') state.celebrationMuted = true; } catch {}
})();

function toggleCelebrationMute() {
  state.celebrationMuted = !state.celebrationMuted;
  try { localStorage.setItem('postflow_chime_muted', state.celebrationMuted ? '1' : '0'); } catch {}
  // Update button label without full re-render
  const btn = document.getElementById('celebration-mute-btn');
  if (btn) {
    btn.textContent = state.celebrationMuted ? '🔇 Muted' : '🔔 On';
    btn.classList.toggle('muted', state.celebrationMuted);
  }
}

function playCelebrationPing(color) {
  if (state.celebrationMuted) return;
  // Use custom chime if uploaded
  if (state.chimeSound) {
    try { const a = new Audio(state.chimeSound); a.volume = 0.7; a.play().catch(()=>{}); } catch {}
    return;
  }
  // Built-in Web Audio synth chime
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 0.01);
    master.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.1);
    master.connect(ctx.destination);

    // Main bell tone
    const osc1 = ctx.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(1046.5, ctx.currentTime);   // C6
    osc1.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
    osc1.connect(master);
    osc1.start(ctx.currentTime);
    osc1.stop(ctx.currentTime + 1.1);

    // Bright overtone
    const osc2 = ctx.createOscillator();
    const g2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(2093, ctx.currentTime);     // C7
    g2.gain.setValueAtTime(0.09, ctx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    osc2.connect(g2); g2.connect(ctx.destination);
    osc2.start(ctx.currentTime);
    osc2.stop(ctx.currentTime + 0.5);

    // Sparkle shimmer — tiny triangle wave
    const osc3 = ctx.createOscillator();
    const g3 = ctx.createGain();
    osc3.type = 'triangle';
    osc3.frequency.setValueAtTime(3136, ctx.currentTime + 0.05); // G7
    g3.gain.setValueAtTime(0, ctx.currentTime + 0.05);
    g3.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.08);
    g3.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    osc3.connect(g3); g3.connect(ctx.destination);
    osc3.start(ctx.currentTime + 0.05);
    osc3.stop(ctx.currentTime + 0.35);

    setTimeout(() => ctx.close(), 1400);
  } catch(e) {}
}

function spawnConfetti(anchorEl, brandColor) {
  if (!anchorEl) return;
  const rect = anchorEl.getBoundingClientRect();
  const ox = rect.left + rect.width / 2;
  const oy = rect.top  + rect.height / 2;

  // Mix brand color with classic confetti palette
  const palette = [
    brandColor,
    brandColor,
    '#ffffff',
    '#ffe066',
    '#ff6b8a',
    '#7ee8a2',
    '#7ab8f5',
    '#f5a623',
    '#c084fc',
  ];

  const COUNT = 38;
  for (let i = 0; i < COUNT; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-particle';

    // Randomise shape: rectangle, square, or tiny circle
    const shape = Math.random();
    const w = shape < 0.5 ? (4 + Math.random() * 5) : (3 + Math.random() * 3);
    const h = shape < 0.33 ? w : (w * (0.4 + Math.random() * 0.5));
    const radius = shape > 0.72 ? '50%' : '2px';

    const color = palette[Math.floor(Math.random() * palette.length)];
    const angle = (Math.random() * 360);          // launch angle
    const speed = 80 + Math.random() * 160;       // px travel
    const rad   = (angle * Math.PI) / 180;
    const cx    = Math.cos(rad) * speed;
    const cy    = Math.sin(rad) * speed + (60 + Math.random() * 80); // gravity bias down
    const rot   = (-360 + Math.random() * 720) + 'deg';
    const dur   = 0.55 + Math.random() * 0.55;
    const delay = Math.random() * 0.12;

    el.style.cssText = `
      left:${ox}px; top:${oy}px;
      width:${w}px; height:${h}px;
      background:${color};
      border-radius:${radius};
      --cx:${cx}px; --cy:${cy}px; --cr:${rot};
      animation-duration:${dur}s;
      animation-delay:${delay}s;
      opacity:0;
    `;
    // Start invisible, then snap to 1 at animation start
    el.addEventListener('animationstart', () => { el.style.opacity = ''; });
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay + 0.1) * 1000);
  }
}

function celebrateSchedule(platformId) {
  const platform = PLATFORMS[platformId];
  if (!platform) return;

  // Play chime
  playCelebrationPing(platform.color);

  // Ping the icon — re-query after render settled
  requestAnimationFrame(() => {
    const iconEl = document.getElementById('plat-icon-' + platformId);
    if (iconEl) {
      // Remove then re-add class to re-trigger if called again quickly
      iconEl.classList.remove('plat-icon-ping');
      void iconEl.offsetWidth; // reflow
      iconEl.classList.add('plat-icon-ping');
      iconEl.addEventListener('animationend', () => iconEl.classList.remove('plat-icon-ping'), { once: true });

      // Spawn confetti from icon position
      spawnConfetti(iconEl, platform.color);
    }
  });
}

function calendarNav(dir) {
  let m = state.calendarMonth + dir;
  let y = state.calendarYear;
  if (m > 11) { m = 0; y++; }
  if (m < 0)  { m = 11; y--; }
  state.calendarMonth = m;
  state.calendarYear  = y;
  render();
}

function calendarGoToday() {
  const now = new Date();
  state.calendarMonth = now.getMonth();
  state.calendarYear  = now.getFullYear();
  render();
}

// ── Calendar drag-and-drop ─────────────────────────────────────────────────
let _calDragSrc = null; // kept only for the drag-over highlight guard
let _didDrag = false;   // swallow the click that fires after a drag

function calChipDragStart(e) {
  const chip = e.currentTarget;
  const payload = JSON.stringify({
    postId:  chip.dataset.postId,
    platId:  chip.dataset.platId,
    srcDate: chip.dataset.srcDate
  });
  e.dataTransfer.setData('text/plain', payload);
  e.dataTransfer.effectAllowed = 'move';
  _calDragSrc = chip.dataset.srcDate;
  _didDrag = true;
  requestAnimationFrame(() => chip.classList.add('dragging'));
}

function calChipDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  _calDragSrc = null;
  document.querySelectorAll('.cal-cell.drag-over')
    .forEach(el => el.classList.remove('drag-over'));
  // Keep _didDrag true briefly so the click that fires after a drag is ignored
  setTimeout(() => { _didDrag = false; }, 200);
}

function calChipClick(e, postId, platId) {
  if (_didDrag) { _didDrag = false; return; } // swallow click that follows a drag
  e.stopPropagation();
  closeCalPopover();
  switchPlatform(platId);
  switchView('scheduled');
  setTimeout(() => openComposer(postId), 80);
}

function calCellDragOver(e, dateStr) {
  // Must always preventDefault to allow drop to fire
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (_calDragSrc && _calDragSrc !== dateStr) {
    e.currentTarget.classList.add('drag-over');
  }
}

function calCellDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('drag-over');
  }
}

function calCellDrop(e, targetDate) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');

  let payload;
  try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
  const { postId, platId, srcDate } = payload;
  if (!postId || !platId || srcDate === targetDate) return;

  const arr = state.posts[platId] || [];
  const idx = arr.findIndex(p => String(p.id) === String(postId));
  if (idx === -1) return;

  _calDragSrc = null;

  // Check for platform conflict on target day (v16: show confirmation dialog)
  const existingOnDay = (state.posts[platId] || []).filter(
    p => p.scheduledDate === targetDate && String(p.id) !== String(postId)
  );
  if (existingOnDay.length > 0) {
    const plat = PLATFORMS[platId];
    showDragConflictDialog(plat ? plat.name : platId, postId, platId, targetDate);
  } else {
    applyDragMove(postId, platId, targetDate);
  }
}

function showDragConflictDialog(platName, postId, platId, toDate) {
  const existing = document.getElementById('drag-conflict-modal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'drag-conflict-modal';
  modal.style.cssText = `
    position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.62);backdrop-filter:blur(3px);
  `;
  modal.innerHTML = `
    <div style="
      background:#1a1e28;border:1px solid #323648;border-radius:12px;
      padding:24px 28px;max-width:360px;width:90%;box-shadow:0 12px 48px rgba(0,0,0,0.7);
      font-family:'DM Sans',sans-serif;
    ">
      <div style="font-size:15px;font-weight:600;color:#eef0f6;margin-bottom:8px;">Post limit reached</div>
      <div style="font-size:13px;color:#8b8fa8;line-height:1.5;margin-bottom:20px;">
        Post limit reached for <strong style="color:#eef0f6">${platName}</strong> on this day. Are you sure you want to move this post here?
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="drag-conflict-no" style="
          padding:8px 18px;border-radius:7px;border:1px solid #323648;
          background:#1e2230;color:#8b8fa8;font-size:13px;cursor:pointer;
          font-family:inherit;transition:background 0.15s;
        " onmouseover="this.style.background='#2a2e3e'" onmouseout="this.style.background='#1e2230'">No</button>
        <button id="drag-conflict-yes" style="
          padding:8px 18px;border-radius:7px;border:none;
          background:#d97706;color:#0c0e13;font-size:13px;font-weight:600;cursor:pointer;
          font-family:inherit;transition:background 0.15s;
        " onmouseover="this.style.background='#c47e08'" onmouseout="this.style.background='#d97706'">Yes, move it</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  document.getElementById('drag-conflict-yes').onclick = () => {
    modal.remove();
    applyDragMove(postId, platId, toDate);
  };
  document.getElementById('drag-conflict-no').onclick = () => {
    modal.remove();
    render();
  };
  modal.addEventListener('click', ev => {
    if (ev.target === modal) { modal.remove(); render(); }
  });
}

function applyDragMove(postId, platId, toDate) {
  const arr = state.posts[platId] || [];
  const idx = arr.findIndex(p => String(p.id) === String(postId));
  if (idx === -1) return;
  const updated = arr.map((p, i) =>
    i === idx ? { ...p, scheduledDate: toDate } : p
  );
  state.posts = { ...state.posts, [platId]: updated };
  savePosts(state.posts);
  render();
  showToast('Post moved to ' + toDate.replace(/(\d{4})-(\d{2})-(\d{2})/, (_, y, mo, d) => {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(mo)-1]} ${parseInt(d)}`;
  }));
}

function renderCalendarStatsBar() {
  const now = new Date();
  const platformsWithDrafts = getVisiblePlatforms().filter(p => (state.drafts[p.id] || []).length > 0);
  if (platformsWithDrafts.length === 0) {
    return `<div class="cal-stats-bar" style="justify-content:center;padding:6px 0">
      <span style="font-size:11.5px;color:var(--text-muted);font-style:italic">No drafts yet — upload images to start your draft bank</span>
    </div>`;
  }
  return `<div class="cal-stats-bar">` +
    platformsWithDrafts.map(p => {
      const posts = state.posts[p.id] || [];
      const drafts = state.drafts[p.id] || [];
      const scheduled = posts.filter(x => !x.manualUpload && x.scheduledDate).length;
      const inQueue   = posts.filter(x => !x.manualUpload && !x.scheduledDate).length;
      const upcoming  = posts.filter(x => !x.manualUpload && new Date(`${x.scheduledDate}T${x.scheduledTime||'00:00'}`) > now).length;
      const dc        = drafts.length;
      return `<div class="cal-stat-chip" style="border-color:${p.color}22;background:${p.color}0d" title="${p.name}">
        <div class="cal-stat-icon" style="color:${p.color}">${p.icon.replace(/width="20" height="20"/g,'width="14" height="14"')}</div>
        <div class="cal-stat-rows">
          <div class="cal-stat-name" style="color:${p.color}">${p.name === 'Google Business' ? 'Google' : p.name}</div>
          <div class="cal-stat-nums">
            <span title="Scheduled" style="color:${p.color}">${scheduled} <span class="cal-stat-lbl">sched</span></span>
            <span class="cal-stat-sep">·</span>
            <span title="In queue">${inQueue} <span class="cal-stat-lbl">queue</span></span>
            <span class="cal-stat-sep">·</span>
            <span title="Drafts">${dc} <span class="cal-stat-lbl">draft${dc!==1?'s':''}</span></span>
            <span class="cal-stat-sep">·</span>
            <span title="Upcoming">${upcoming} <span class="cal-stat-lbl">upcoming</span></span>
          </div>
        </div>
      </div>`;
    }).join('') +
  `</div>`;
}

// Build the merged holiday list for a given date
// Now includes: hardcoded US holidays + floating holidays + all _FIXED_EVENTS + live feed
function getHolidaysForDate(dateStr) {
  var hardcoded = US_HOLIDAYS_DATA[dateStr];
  var liveMap   = state.liveHolidayCache || {};
  var results   = [];
  var parts     = dateStr.split('-');
  var m = parseInt(parts[1]), d = parseInt(parts[2]);
  var msgKey    = m + '-' + d;
  var fixedMsg  = _HOLIDAY_MSGS[msgKey] || null;

  // 1. Hardcoded US holidays
  if (hardcoded) results.push({ label: hardcoded.label, cat: hardcoded.cat, msg: fixedMsg });

  // 2. Floating holidays (Mother's Day, Thanksgiving, etc.)
  var floatMap = _getFloatMapCached();
  if (floatMap[dateStr]) {
    var fh = floatMap[dateStr];
    if (!results.some(function(r){ return r.label === fh.label; }))
      results.push({ label: fh.label, cat: fh.cat, msg: fh.msg });
  }

  // 3. Fixed-date events from _FIXED_EVENTS (birthdays, cultural days, etc.)
  for (var i = 0; i < _FIXED_EVENTS.length; i++) {
    var fe = _FIXED_EVENTS[i];
    if (fe[0] === m && fe[1] === d) {
      var feLabel = fe[2], feCat = fe[3];
      if (!results.some(function(r){ return r.label === feLabel; }))
        results.push({ label: feLabel, cat: feCat, msg: _HOLIDAY_MSGS[msgKey] || null });
    }
  }

  // 4. Live feed events
  if (liveMap[dateStr]) {
    liveMap[dateStr].forEach(function(ev) {
      if (!results.some(function(r){ return r.label === ev.label; }))
        results.push({ label: ev.label, cat: 'live', msg: null });
    });
  }
  return results;
}

const HOLIDAY_FEED_URL = 'https://calendar.google.com/calendar/ical/en.usa%23holiday%40group.v.calendar.google.com/public/basic.ics';
const HOLIDAY_FEED_PROXY = 'https://corsproxy.io/?url=';
const HOLIDAY_FEED_CACHE_KEY = 'postpilot_holiday_feed_cache';
const HOLIDAY_FEED_CACHE_TTL = 24 * 60 * 60 * 1000; // 24 hours
const HOLIDAY_FEED_ENABLED_KEY = 'postpilot_live_holidays_enabled';

function isLiveHolidayFeedEnabled() {
  try { return localStorage.getItem(HOLIDAY_FEED_ENABLED_KEY) === '1'; } catch { return false; }

function setLiveHolidayFeedEnabled(val) {
  try { localStorage.setItem(HOLIDAY_FEED_ENABLED_KEY, val ? '1' : '0'); } catch {}
}

function toggleLiveHolidayFeed() {
  const newVal = !isLiveHolidayFeedEnabled();
  setLiveHolidayFeedEnabled(newVal);
  state.liveHolidayFeedEnabled = newVal;
  if (newVal) {

  }
}

// Parse iCal (.ics) text → { 'YYYY-MM-DD': [{label, cat}] }
function parseICS(text) {
  const map = {};
  const events = text.split('BEGIN:VEVENT');
  events.shift(); // remove preamble
  for (const ev of events) {
    const summaryMatch = ev.match(/SUMMARY[^:]*:(.+)/);
    const dtStartMatch = ev.match(/DTSTART[^:]*:(\d{8})/);
    if (!summaryMatch || !dtStartMatch) continue;
    const raw = dtStartMatch[1];
    const dateStr = `${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`;
    const label = summaryMatch[1].replace(/\\n/g,'').replace(/\\,/g,',').trim();
    if (!map[dateStr]) map[dateStr] = [];
    map[dateStr].push({ label, cat: 'live' });
  }
  return map;
}

async function fetchLiveHolidays(forceRefresh = false) {
  if (!isLiveHolidayFeedEnabled()) return;
  state.liveHolidayFeedStatus = 'loading';
  // Check cache first
  if (!forceRefresh) {
    try {
      const raw = localStorage.getItem(HOLIDAY_FEED_CACHE_KEY);
      if (raw) {
        const { ts, data } = JSON.parse(raw);
        if (Date.now() - ts < HOLIDAY_FEED_CACHE_TTL) {
          state.liveHolidayCache = data;
          state.liveHolidayFeedStatus = 'ok';
          render();
          return;
        }
      }
    } catch {}
  }
  // Fetch fresh
  try {
    const res = await fetch(HOLIDAY_FEED_PROXY + encodeURIComponent(HOLIDAY_FEED_URL));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = parseICS(text);
    state.liveHolidayCache = parsed;
    state.liveHolidayFeedStatus = 'ok';
    try {
      localStorage.setItem(HOLIDAY_FEED_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: parsed }));
    } catch {}
    render();
  } catch(e) {
    console.warn('Live holiday fetch failed:', e);
    state.liveHolidayFeedStatus = 'error';
    // Fall back to cached if available
    try {
      const raw = localStorage.getItem(HOLIDAY_FEED_CACHE_KEY);
      if (raw) { const { data } = JSON.parse(raw); state.liveHolidayCache = data; }
    } catch {}
    render();
  }
}

  const byDay = {};

    (state.posts[plat.id] || []).forEach(post => {
      if (!post.scheduledDate) return;
      const d = post.scheduledDate; // 'YYYY-MM-DD'
      const pd = new Date(d + 'T00:00:00');
      if (pd.getFullYear() !== y || pd.getMonth() !== m) return;
      if (!byDay[d]) byDay[d] = [];

    const at = (a.post.scheduledTime || '00:00');
    const bt = (b.post.scheduledTime || '00:00');
    return at < bt ? -1 : at > bt ? 1 : 0;
  }));

  // Build calendar grid

  const todayStr = new Date().toISOString().split('T')[0];
  const prevMonthDays = new Date(y, m, 0).getDate();

  // Total cells: pad to always show 6 rows of 7
  const totalCells = 42;
  const cells = [];
  for (let i = 0; i < totalCells; i++) {
    const dayOffset = i - firstDay;
    let cellDate, otherMonth;
    if (dayOffset < 0) {
      // Previous month
      const d = prevMonthDays + dayOffset + 1;
      const pm = m === 0 ? 11 : m - 1;
      const py = m === 0 ? y - 1 : y;
      cellDate = `${py}-${String(pm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      otherMonth = true;
    } else if (dayOffset >= daysInMo) {
      // Next month
      const d = dayOffset - daysInMo + 1;
      const nm = m === 11 ? 0 : m + 1;
      const ny = m === 11 ? y + 1 : y;
      cellDate = `${ny}-${String(nm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      otherMonth = true;
    } else {
      const d = dayOffset + 1;
      cellDate = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      otherMonth = false;
    }
    cells.push({ cellDate, dayNum: parseInt(cellDate.split('-')[2]), otherMonth });
  }

  // Build legend — only show platforms that actually have posts on the calendar
  const platformsWithPosts = Object.values(PLATFORMS).filter(p => (state.posts[p.id] || []).some(x => x.scheduledDate));
  const legend = platformsWithPosts.length > 0
    ? platformsWithPosts.map(p =>
        `<div class="cal-legend-item">
          <div class="cal-legend-dot" style="background:${p.color}"></div>
          <span>${p.name}</span>
        </div>`
      ).join('')
    : `<span style="font-size:11px;color:var(--text-muted);font-style:italic">No scheduled posts yet</span>`;

  // Build cells HTML
  const cellsHtml = cells.map(({ cellDate, dayNum, otherMonth }) => {
    const posts = byDay[cellDate] || [];
    const isToday = cellDate === todayStr;
    const isViewingDay = cellDate === state.sidebarDate;
    const classes = ['cal-cell',
      isToday ? 'today' : '',
      isViewingDay ? 'viewing-day' : '',
      otherMonth ? 'other-month' : '',
      posts.length ? 'has-posts' : ''
    ].filter(Boolean).join(' ');

    const chipsHtml = posts.map(({ post, plat }) => {
      const time = post.scheduledTime || '00:00';
      const [hh, mm] = time.split(':');
      const h = parseInt(hh);
      const ampm = h >= 12 ? 'pm' : 'am';
      const h12 = h % 12 || 12;
      const timeLabel = `${h12}:${mm}${ampm}`;
      const title = escapeHtml(getPostSummary(post)).substring(0, 28);
      const tagHtml = (post.tags || []).slice(0, 3).map(t =>
        `<span class="cal-tag-pill">${escapeHtml(t)}</span>`).join('');

      return `<div class="cal-post-chip"
          draggable="true"
          data-post-id="${post.id}"
          data-plat-id="${plat.id}"
          data-src-date="${cellDate}"
          ondragstart="calChipDragStart(event)"
          ondragend="calChipDragEnd(event)"
          style="background:${plat.color}18;border-left-color:${plat.color};color:#e8eaf0${post.manualUpload ? ';border-left-width:3px;opacity:0.85' : ''}"
          onclick="calChipClick(event,'${post.id}','${plat.id}')"
          title="${escapeHtml(getPostSummary(post))} — ${plat.name} @ ${timeLabel}${post.manualUpload ? ' [Manually Uploaded]' : ''}">
          <div class="cal-post-chip-icon" style="display:flex;align-items:center;gap:3px">
            ${plat.icon.replace('width="20" height="20"','width="10" height="10"')}
            <span style="font-size:9px;font-weight:700;color:${plat.color};letter-spacing:0.02em;line-height:1.2;opacity:0.9">${plat.id === 'google' ? 'Google<br>Business' : plat.name}</span>
            ${post.manualUpload ? '<span style="color:#39ff6e;font-size:10px;font-weight:700;line-height:1;margin-left:1px">↑</span>' : ''}
          </div>
          <div class="cal-post-chip-body">
            <div class="cal-post-chip-time" style="color:${plat.color}">${timeLabel}</div>
            <div class="cal-post-chip-title">${title}</div>
            ${tagHtml ? `<div class="cal-post-chip-tags">${tagHtml}</div>` : ''}
          </div>
        </div>`;
    }).join('');


    const holidays = !otherMonth ? getHolidaysForDate(cellDate) : [];
    const holidayHtml = holidays.map(h => {
      const tip = h.msg ? escapeHtml(h.label + ' — ' + h.msg) : escapeHtml(h.label);
      return `<div class="cal-holiday-chip cat-${h.cat}" title="${tip}">${escapeHtml(h.label)}</div>`;
    }).join('');
    return `<div class="${classes}"
      ondragover="calCellDragOver(event,'${cellDate}')"
      ondragleave="calCellDragLeave(event)"
      ondrop="calCellDrop(event,'${cellDate}')">
      <div class="cal-day-num">${dayNum}</div>
      ${holidayHtml}
      ${chipsHtml}
    </div>`;
  }).join('');

  const dowRow = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');

  return `
    <div id="cal-wrap">
      <div id="cal-nav">
        <h2>${MONTH_NAMES[m]} ${y}</h2>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div class="cal-legend">${legend}</div>
          <div class="cal-nav-btns">
            <button class="cal-today-btn" onclick="calendarGoToday()">Today</button>
            <button class="cal-nav-btn" onclick="calendarNav(-1)" title="Previous month">&#8249;</button>
            <button class="cal-nav-btn" onclick="calendarNav(1)"  title="Next month">&#8250;</button>
          </div>
        </div>
      </div>
      <div id="cal-grid-wrap">
        <div id="cal-dow-row">${dowRow}</div>
        <div id="cal-cells">${cellsHtml}</div>
      </div>
    </div>
    <div id="cal-day-popover" onclick="event.stopPropagation()">
      <div class="pop-header">
        <span class="pop-date-label" id="pop-date-label"></span>
        <button class="pop-close" onclick="closeCalPopover()">✕</button>
      </div>
      <div id="pop-posts"></div>
    </div>
    ${(function(){
      try {
        var today = new Date();
        var p=function(n){return n<10?'0'+n:String(n);};
        var toDs=function(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
        var MONS_LONG=['January','February','March','April','May','June','July','August','September','October','November','December'];
        var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var WDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        var ord=function(n){return n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');};
        var CAT_COLORS={federal:'#ef4444',retail:'#eab308',awareness:'#22c55e',social:'#a855f7',cultural:'#fb923c',live:'#00A5D8'};
        // Opacity steps: card 1 = full, card 5 = most dim
        var OPACITIES=[1, 0.72, 0.52, 0.38, 0.28];

        var floatMap=_buildFloatMap(today.getFullYear());

        // Scan up to 90 days to fill 5 cards
        var items=[], seen={};
        for(var i=0;i<=90;i++){
          if(items.length>=5) break;
          var d=new Date(today); d.setDate(today.getDate()+i);
          var ds2=toDs(d);
          var evts=getHolidaysForDate(ds2).map(function(e){
            var fh=floatMap[ds2];
            return {label:e.label,cat:e.cat,msg:(fh&&fh.label===e.label)?fh.msg:e.msg};
          });
          if(floatMap[ds2]){
            var fh2=floatMap[ds2];
            if(!evts.some(function(e){return e.label===fh2.label;}))
              evts.push({label:fh2.label,cat:fh2.cat,msg:fh2.msg});
          }
          evts.forEach(function(e){
            if(items.length>=5) return;
            var key=ds2+'|'+e.label;
            if(!seen[key]){seen[key]=1;items.push({evt:e,date:d,offset:i});}
          });
        }
        if(!items.length) return '';

        var cards=items.map(function(item,idx){
          var e=item.evt,offset=item.offset,date=item.date;
          var color=CAT_COLORS[e.cat]||'#6366f1';
          var opacity=OPACITIES[idx]||0.25;
          var relLabel,dateDetail,isPrimary=idx===0;
          if(offset===0){
            relLabel='TODAY'; dateDetail=MONS_LONG[date.getMonth()].toUpperCase()+' '+ord(date.getDate()).toUpperCase();
          } else if(offset===1){
            relLabel='TOMORROW'; dateDetail=MONS_LONG[date.getMonth()].toUpperCase()+' '+ord(date.getDate()).toUpperCase();
          } else {
            relLabel=WDAYS[date.getDay()].toUpperCase()+', '+MONS[date.getMonth()].toUpperCase()+' '+date.getDate();
            dateDetail='COMING UP';
          }
          var msgHtml=e.msg?'<div class="cal-hol-card-msg">'+escapeHtml(e.msg)+'</div>':'';
          var labelEncoded = encodeURIComponent(e.label);
          var suggestion = state.holidaySuggestions && state.holidaySuggestions[e.label];
          var genBtn = isPrimary
            ? '<button onclick="generateHolidayCaption('+JSON.stringify(e.label)+','+JSON.stringify(e.msg||e.label)+')" class="hol-gen-btn" title="Generate caption with AI">✨ Generate caption</button>'
            : '<button onclick="generateHolidayCaption('+JSON.stringify(e.label)+','+JSON.stringify(e.msg||e.label)+')" class="hol-gen-btn hol-gen-btn-sm" title="Generate AI caption">✨</button>';
          var suggHtml = '';
          if (suggestion) {
            if (suggestion.loading) {
              suggHtml = '<div class="hol-gen-loading"><span class="hol-gen-spinner">⟳</span> Writing captions…</div>';
            } else if (suggestion.error) {
              suggHtml = '<div class="hol-gen-error">⚠ Failed — check API key in Settings</div>';
            } else if (suggestion.captions && suggestion.captions.length) {
              suggHtml = '<div class="hol-gen-variants">'
                + suggestion.captions.map(function(c,i){
                    return '<div class="hol-gen-variant">'
                      +'<div class="hol-gen-caption-text">'+escapeHtml(c.caption||'')+'</div>'
                      +(c.hashtags?'<div class="hol-gen-hashtags">'+escapeHtml(c.hashtags)+'</div>':'')
                      +'<button onclick="useHolidayCaption(\''+labelEncoded+'\','+i+')" class="hol-gen-use">Use this →</button>'
                      +'</div>';
                  }).join('')
                +'<button onclick="dismissHolidaySuggestion('+JSON.stringify(e.label)+')" class="hol-gen-dismiss">✕ Dismiss</button>'
                +'</div>';
            }
          }
          return '<div class="cal-hol-card'+(isPrimary?' cal-hol-card-primary':'')+'" style="border-left-color:'+color+';opacity:'+opacity+'">'
            +'<div class="cal-hol-card-hdr" style="color:'+color+'">'
            +'<span class="cal-hol-card-rel">'+relLabel+'</span>'
            +(dateDetail?'<span class="cal-hol-card-dot"> · </span><span class="cal-hol-card-date">'+dateDetail+'</span>':'')
            +'</div>'
            +'<div class="cal-hol-card-title">'+escapeHtml(e.label)+'</div>'
            +msgHtml
            +genBtn
            +suggHtml
            +'</div>';
        }).join('');

        return '<div id="cal-holiday-bar">'
          +'<div class="cal-hol-bar-hdr">🗓 Upcoming Holidays &amp; Events</div>'
          +'<div class="cal-hol-cards">'+cards+'</div>'
          +'</div>';
      } catch(err){ return ''; }
    })()}`;
}

// ─── SIDEBAR AT-A-GLANCE CHART ───────────────────────────────────────────────
function renderGlanceChart() {
  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];

  // Window: 1 month back → 3 months forward, broken into weekly buckets
  const startDate = new Date(now.getFullYear(), now.getMonth() - 1, now.getDate());
  const endDate   = new Date(now.getFullYear(), now.getMonth() + 3, now.getDate());

  // Build weekly buckets: each bucket = { startStr, label, count, isCurrent }
  const buckets = [];
  let cursor = new Date(startDate);
  // Snap to Sunday of that week
  cursor.setDate(cursor.getDate() - cursor.getDay());

  while (cursor <= endDate) {
    const bucketStart = new Date(cursor);
    const bucketEnd   = new Date(cursor);
    bucketEnd.setDate(bucketEnd.getDate() + 6);

    const startStr = bucketStart.toISOString().split('T')[0];
    const endStr   = bucketEnd.toISOString().split('T')[0];

    // Label: month/day of week start
    const label = bucketStart.toLocaleString('en-US', { month: 'short', day: 'numeric' });
    const isCurrent = todayStr >= startStr && todayStr <= endStr;
    const isPast = bucketEnd < now;

    buckets.push({ startStr, endStr, label, count: 0, isCurrent, isPast });
    cursor.setDate(cursor.getDate() + 7);
  }

  // Count all posts across all platforms per bucket
  const allPosts = Object.values(state.posts).flat();
  allPosts.forEach(post => {
    if (!post.scheduledDate) return;
    const bi = buckets.findIndex(b => post.scheduledDate >= b.startStr && post.scheduledDate <= b.endStr);
    if (bi !== -1) buckets[bi].count++;
  });

  const maxCount = Math.max(...buckets.map(b => b.count), 1);
  const todayIdx = buckets.findIndex(b => b.isCurrent);

  const barsHtml = buckets.map((b, i) => {
    const pct = (b.count / maxCount) * 100;
    const barH = b.count > 0 ? Math.max(pct, 6) : 1;

    // Color: past = muted blue-gray, current = white, future = platform accent
    const color = b.isCurrent
      ? '#ffffff'
      : b.isPast
        ? '#3a4a60'
        : '#4a7ab8';

    const opacity = b.isPast && !b.isCurrent ? 0.6 : 1;

    // Today marker line on the current bucket
    const todayLine = b.isCurrent
      ? `<div class="glance-today-line"><div class="glance-today-dot"></div></div>`
      : '';

    return `<div class="glance-bar-col" title="${b.label}: ${b.count} post${b.count !== 1 ? 's' : ''}">
      ${todayLine}
      <div class="glance-bar-fill" style="height:${barH}%;background:${color};opacity:${opacity}"></div>
      <div class="glance-bar-tip">${b.label}: ${b.count}</div>
    </div>`;
  }).join('');

  // Axis labels: show month names at transition points only
  let lastMonth = -1;
  const axisLabels = buckets.map(b => {
    const m = new Date(b.startStr + 'T00:00:00').getMonth();
    if (m !== lastMonth) { lastMonth = m; return new Date(b.startStr + 'T00:00:00').toLocaleString('en-US', { month: 'short' }); }
    return '';
  });

  // Only show ~4 axis labels max (first, today area, last, and 1 in between)
  const sparseAxis = axisLabels.map((l, i) => {
    const isFirst = i === 0;
    const isLast  = i === buckets.length - 1;
    const isNearToday = Math.abs(i - todayIdx) <= 1;
    return (isFirst || isLast || isNearToday) && l ? l : '';
  });

  const axisHtml = `<div class="glance-axis">
    ${sparseAxis.map(l => `<div class="glance-axis-label">${l}</div>`).join('')}
  </div>`;

  return `<div class="glance-chart-wrap">
    <div class="glance-chart-label">
      <span>At a Glance</span>
      <span class="glance-range-label">−1 mo → +3 mo</span>
    </div>
    <div class="glance-bars-scroll">
      <div class="glance-bars">${barsHtml}</div>
      ${axisHtml}
    </div>
  </div>`;
}

// ─── TAG COVERAGE CHART ──────────────────────────────────────────────────────
function renderTagCoverageChart() {
  const TRACKED = [
    { key: 'Life',       color: '#22c55e' },
    { key: 'Auto',       color: '#22d3ee' },
    { key: 'Home',       color: '#e879f9' },
    { key: 'Commercial', color: '#facc15' },
  ];

  const now = new Date();
  // Show 3 months back, current month, and 3 months forward (7 total)
  const PAST = 3;
  const FUTURE = 3;
  const TOTAL = PAST + 1 + FUTURE; // 7
  const months = [];
  for (let i = -PAST; i <= FUTURE; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    months.push({
      year: d.getFullYear(),
      month: d.getMonth(),
      label: d.toLocaleString('en-US', { month: 'short' }),
      isCurrent: i === 0,
      isFuture: i > 0,
    });
  }

  const allPosts = Object.values(state.posts).flat();

  const counts = {};
  TRACKED.forEach(t => { counts[t.key] = Array(TOTAL).fill(0); });

  allPosts.forEach(post => {
    if (!post.scheduledDate) return;
    const pd = new Date(post.scheduledDate + 'T00:00:00');
    const mi = months.findIndex(m => m.year === pd.getFullYear() && m.month === pd.getMonth());
    if (mi === -1) return;
    (post.tags || []).forEach(tag => {
      const match = TRACKED.find(t => tag.toLowerCase().includes(t.key.toLowerCase()));
      if (match) counts[match.key][mi]++;
    });
  });

  const allVals = TRACKED.flatMap(t => counts[t.key]);
  const maxVal = Math.max(...allVals, 1);

  // Monthly totals for the "total" row
  const monthTotals = months.map((_, mi) => TRACKED.reduce((s, t) => s + counts[t.key][mi], 0));

  const barsHtml = months.map((mo, mi) => {
    const barItems = TRACKED.map(t => {
      const val = counts[t.key][mi];
      const pct = (val / maxVal) * 100;
      // Always show the count; dim zero bars but still show "0"
      return `<div class="tag-bar" style="background:${t.color};height:${Math.max(pct, val > 0 ? 5 : 1)}%;opacity:${val === 0 ? 0.18 : 1}">
        <div class="tag-bar-val" style="opacity:${val === 0 ? 0.4 : 1}">${val}</div>
      </div>`;
    }).join('');
    const currentMarker = mo.isCurrent ? ' style="color:#f59e0b;font-weight:800"' : (mo.isFuture ? ' style="opacity:0.65"' : '');
    return `<div class="tag-chart-group">
      <div class="tag-chart-bar-wrap">${barItems}</div>
      <div class="tag-chart-month-label"${currentMarker}>${mo.label}${mo.isCurrent ? ' ●' : ''}</div>
    </div>`;
  }).join('');

  const legendHtml = TRACKED.map(t =>
    `<div class="tag-chart-legend-item">
      <div class="tag-chart-legend-dot" style="background:${t.color}"></div>
      <span>${t.key}</span>
    </div>`
  ).join('');

  return `
    <div class="tag-chart-section">
      <div class="tag-chart-header">
        <div class="tag-chart-title">Coverage by Insurance Line</div>
        <div class="tag-chart-months">Past 3 months + 3 months ahead</div>
      </div>
      <div class="tag-chart-bars">${barsHtml}</div>
      <div class="tag-chart-legend">${legendHtml}</div>
    </div>
  `;
}

function defaultStreakState() {
  return { count:0, lastDate:'', lastMilestone:0, freezeTokens:0, trophies:0, frozenDates:[], tokenMilestonesHit:[], missedDayPending:null };
}

function loadStreaks() {
  try {
    const raw = localStorage.getItem(STREAK_KEY());
    if (raw) {
      const saved = JSON.parse(raw);
      // Merge saved data, filling in any missing new fields
      Object.keys(state.streaks).forEach(pid => {
        if (saved[pid]) state.streaks[pid] = { ...defaultStreakState(), ...state.streaks[pid], ...saved[pid] };
      });
    }
  } catch(e) {}
}

function saveStreaks() {
  try { localStorage.setItem(STREAK_KEY(), JSON.stringify(state.streaks)); } catch(e) {}
}

function getStreakEmoji(count) {
  const milestones = [...STREAK_MILESTONES].reverse();
  for (const m of milestones) { if (count >= m.days) return m.emoji; }
  return '🔥';
}

function getMilestoneForCount(count) {
  const milestones = [...STREAK_MILESTONES].reverse();
  for (const m of milestones) { if (count >= m.days) return m; }
  return null;
}

// ── Freeze & Trophy helpers ────────────────────────────────────────────────
function useFreeze(platformId, missedDate) {
  const s = state.streaks[platformId];
  if (!s || s.freezeTokens <= 0) return;
  s.freezeTokens--;
  s.frozenDates = [...(s.frozenDates||[]), missedDate];
  s.missedDayPending = null;
  saveStreaks();
  showToast('❄️ Freeze token used! Your streak is protected.');
  recalcStreak(platformId);
}

function dismissFreezePrompt(platformId) {
  // User chose to let the streak break
  breakStreak(platformId);
}

function breakStreak(platformId) {
  const s = state.streaks[platformId] || defaultStreakState();
  state.streaks[platformId] = { ...s, count:0, lastDate:'', lastMilestone:0, frozenDates:[], tokenMilestonesHit:[], missedDayPending:null };
  saveStreaks();
  showToast('💔 Streak broken! Post with a verified link to start again.', 'error');
  render();
}

function checkMissedDay(platformId) {
  const s = state.streaks[platformId];
  if (!s || !s.lastDate || s.count === 0) return;
  const today = new Date().toISOString().split('T')[0];
  const todayD = new Date(today + 'T00:00:00');
  const lastD  = new Date(s.lastDate + 'T00:00:00');
  const diff = Math.round((todayD - lastD) / 86400000);
  if (diff <= 1) {
    if (s.missedDayPending) { state.streaks[platformId].missedDayPending = null; saveStreaks(); render(); }
    return;
  }
  if (diff === 2) {
    const missedDate = new Date(todayD - 86400000).toISOString().split('T')[0];
    const alreadyFrozen = (s.frozenDates||[]).includes(missedDate);
    if (!alreadyFrozen && s.missedDayPending !== missedDate) {
      if (s.freezeTokens > 0) {
        state.streaks[platformId].missedDayPending = missedDate;
        saveStreaks(); render();
      } else {
        breakStreak(platformId);
      }
    }
  } else {
    breakStreak(platformId);
  }
}

// Called when a liveUrl is saved — recalculates streak
function recalcStreak(platformId) {
  const posts = state.posts[platformId] || [];
  const s = { ...defaultStreakState(), ...(state.streaks[platformId]||{}) };

  const verifiedDates = [...new Set(
    posts.filter(p => p.liveUrl && p.liveUrl.trim().startsWith('http') && p.scheduledDate)
         .map(p => p.scheduledDate)
  )];
  const frozenDates = s.frozenDates || [];
  const allActiveDates = [...new Set([...verifiedDates, ...frozenDates])].sort();

  if (!allActiveDates.length) {
    state.streaks[platformId] = { ...s, count:0, lastDate:'', lastMilestone:0, frozenDates:[], tokenMilestonesHit:[] };
    saveStreaks(); return;
  }

  let streak = 1;
  for (let i = allActiveDates.length - 1; i > 0; i--) {
    const diff = (new Date(allActiveDates[i]+'T00:00:00') - new Date(allActiveDates[i-1]+'T00:00:00')) / 86400000;
    if (diff === 1) streak++; else break;
  }

  const lastDate = allActiveDates[allActiveDates.length - 1];
  const prevMilestone = s.lastMilestone || 0;
  let freezeTokens = s.freezeTokens || 0;
  let trophies = s.trophies || 0;
  let tokenMilestonesHit = [...(s.tokenMilestonesHit||[])];

  // 30-day cycle complete → award trophy, reset
  if (streak >= 30) {
    trophies++;
    state.streaks[platformId] = { ...s, count:0, lastDate, lastMilestone:0, freezeTokens, trophies, frozenDates:[], tokenMilestonesHit:[], missedDayPending:null };
    saveStreaks();
    showTrophyCelebration(platformId, trophies);
    render(); return;
  }

  // Award freeze token at day 15 (once per cycle)
  if (streak >= 15 && !tokenMilestonesHit.includes(15)) {
    freezeTokens++;
    tokenMilestonesHit.push(15);
    setTimeout(() => showToast(`❄️ Freeze token earned at 15 days! You have ${freezeTokens} freeze${freezeTokens!==1?'s':''} ready.`), 500);
  }

  state.streaks[platformId] = { ...s, count:streak, lastDate, lastMilestone:prevMilestone, freezeTokens, trophies, frozenDates, tokenMilestonesHit, missedDayPending:s.missedDayPending||null };
  saveStreaks();

  const hit = getMilestoneForCount(streak);
  if (hit && streak > prevMilestone) {
    state.streaks[platformId].lastMilestone = streak;
    saveStreaks();
    showStreakCelebration(platformId, streak, hit);
  }
}

function streakGifFallback(img) {
  const tried = img._tried || new Set([img.src]);
  const next = CELEBRATION_GIFS.find(u => !tried.has(u));
  if (next) { tried.add(next); img._tried = tried; img.src = next; }
  else img.style.display = 'none';
}

// ── Streak test mode ─────────────────────────────────────────────────────────
let _streakTestMode = false;
let _streakTestCount = 0;

function toggleStreakTest() {
  _streakTestMode = !_streakTestMode;
  if (!_streakTestMode) _streakTestCount = 0;
  render();
}

function setStreakTest(val) {
  _streakTestCount = +val;
  const MILE_DATA = [
    {days:1,emoji:'🎉',title:'First Post!'},
    {days:3,emoji:'⭐',title:'3-Day Streak!'},
    {days:10,emoji:'🌟',title:'10-Day Streak!'},
    {days:15,emoji:'✨',title:'15-Day Streak! + Freeze Token'},
    {days:20,emoji:'🎇',title:'20-Day Streak!'},
    {days:30,emoji:'🏆',title:'30-Day Complete — Trophy!'},
  ];
  const hit = MILE_DATA.slice().reverse().find(m => val >= m.days);
  if (hit && [1,3,10,20].includes(val)) showStreakCelebration(state.activePlatform, val, hit);
  if (val === 15) showStreakCelebration(state.activePlatform, 15, hit);
  if (val === 30) showTrophyCelebration(state.activePlatform, (state.streaks[state.activePlatform]?.trophies||0)+1);
  render();
}

function resetStreakTest() { _streakTestCount = 0; render(); }

function showTestFreezePrompt() {
  const s = state.streaks[state.activePlatform];
  if ((s?.freezeTokens||0) === 0) { showToast('No freeze tokens — reach 15 days first!', 'error'); return; }
  state.streaks[state.activePlatform].missedDayPending = 'test-date';
  render();
}

function renderStreakBar(platformId) {
  const s = { ...defaultStreakState(), ...(state.streaks[platformId]||{}) };
  const platform = PLATFORMS[platformId];
  const color = platform.color;
  const count = _streakTestMode ? _streakTestCount : s.count;
  const trophies = s.trophies || 0;
  const freezeTokens = s.freezeTokens || 0;

  const MILES = STREAK_MILESTONES;
  const nodePositions = [0, 20, 40, 60, 80, 100];

  let fillPct = 0;
  if (count >= MILES[MILES.length-1].days) {
    fillPct = 100;
  } else {
    for (let i = 0; i < MILES.length - 1; i++) {
      if (count >= MILES[i].days && count < MILES[i+1].days) {
        const t = (count - MILES[i].days) / (MILES[i+1].days - MILES[i].days);
        fillPct = nodePositions[i] + t * (nodePositions[i+1] - nodePositions[i]);
        break;
      } else if (count < MILES[0].days) { break; }
    }
  }

  const next = MILES.find(m => count < m.days);
  const fire = count === 0 ? '🔥' : getStreakEmoji(count);
  const subtext = count === 0
    ? 'Add a live URL to a post to start your streak!'
    : `${count} day${count!==1?'s':''} ${next ? `· ${next.days-count} more to ${next.emoji}` : '· Full cycle complete! 🏆'}`;

  const nodesHTML = MILES.map((m, i) => {
    const reached = count >= m.days;
    const isActive = reached && (i === MILES.length-1 || count < MILES[i+1].days);
    const isNext = !reached && next && m.days === next.days;
    return `<div class="streak-node ${reached?'reached':''} ${isActive?'active-node':''} ${isNext?'next-node':''}" style="--nc:${color}">
      <div class="streak-node-circle">${m.emoji}</div>
      <div class="streak-node-label">${m.nodeLabel}</div>
    </div>`;
  }).join('');

  const freezePrompt = (!_streakTestMode && s.missedDayPending) ? `
    <div class="streak-freeze-prompt">
      <span style="font-size:22px">❄️</span>
      <div class="streak-freeze-text">
        <strong>You missed a day!</strong> Use a Freeze Token to protect your ${s.count}-day streak.
        <span style="color:#88b4ff">(${s.freezeTokens} freeze${s.freezeTokens!==1?'s':''} remaining)</span>
      </div>
      <div class="streak-freeze-btns">
        <button class="streak-freeze-use" onclick="useFreeze('${platformId}','${s.missedDayPending}')">❄️ Use Freeze</button>
        <button class="streak-freeze-break" onclick="dismissFreezePrompt('${platformId}')">Break Streak</button>
      </div>
    </div>` : '';

  const testPanel = _streakTestMode ? `
    <div class="streak-test-panel">
      <span class="streak-test-label">🧪 Test</span>
      <input class="streak-test-slider" type="range" min="0" max="30" value="${_streakTestCount}"
        oninput="setStreakTest(+this.value)" style="accent-color:${color}">
      <span class="streak-test-val">${_streakTestCount} day${_streakTestCount!==1?'s':''}</span>
      <div class="streak-test-btns">
        ${[1,3,10,15,20,30].map(d=>`<button class="streak-test-jump" onclick="setStreakTest(${d})">${d}d</button>`).join('')}
        <button class="streak-test-jump" onclick="showTestFreezePrompt()" style="color:#88b4ff;border-color:#88b4ff44">❄️ Prompt</button>
        <button class="streak-test-reset" onclick="resetStreakTest()">↺ Reset</button>
      </div>
    </div>` : '';

  return `<div class="streak-bar">
    <div class="streak-header-row">
      <span class="streak-fire">${fire}</span>
      <div>
        <div class="streak-label">Posting Streak${_streakTestMode?' <span style="color:#a78bfa;font-size:9px;font-weight:600;margin-left:4px;">TEST MODE</span>':''}</div>
        <div class="streak-subtext">${subtext}</div>
      </div>
      <div class="streak-header-right">
        ${trophies > 0 ? `<div class="streak-trophy-pill" title="${trophies} completed 30-day streak${trophies!==1?'s':''}"><span>🏆</span><span class="streak-trophy-count">× ${trophies}</span></div>` : ''}
        ${freezeTokens > 0 ? `<div class="streak-freeze-pill" title="${freezeTokens} freeze token${freezeTokens!==1?'s':''} — use to skip one missed day"><span>❄️</span><span class="streak-freeze-count">× ${freezeTokens}</span></div>` : ''}
        <button class="streak-test-btn" onclick="toggleStreakTest()">${_streakTestMode ? '✕ Exit Test' : '🧪 Test'}</button>
      </div>
    </div>
    ${freezePrompt}
    ${testPanel}
    <div class="streak-timeline">
      <div class="streak-line-bg">
        <div class="streak-line-fill" style="width:${fillPct.toFixed(1)}%;background:${color};box-shadow:0 0 8px ${color}66;"></div>
      </div>
      <div class="streak-nodes">${nodesHTML}</div>
    </div>
  </div>`;
}

      ${(() => {
        const { y, m, d } = getSidebarDateParts();
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const currentYear = new Date().getFullYear();
        const years = Array.from({length: 3}, (_, i) => currentYear + i);
        const numDays = daysInMonth(y, m);
        const safeDay = Math.min(d, numDays);
        const dateObj = new Date(`${y}-${String(m).padStart(2,'0')}-${String(safeDay).padStart(2,'0')}T00:00:00`);
        const dateLabel = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        return `
          <div class="sidebar-date-section viewing-active">
            <div class="sidebar-date-label-row">📅 Viewing Day</div>
            <div class="sidebar-date-display" id="sidebar-date-label">${dateLabel}</div>
            <div class="sidebar-date-selects">
              <select onchange="updateSidebarDate(${y}, this.value, ${safeDay})" title="Month">
                ${months.map((mn, i) => `<option value="${i+1}"${m === i+1 ? ' selected' : ''}>${mn}</option>`).join('')}
              </select>
              <select onchange="updateSidebarDate(${y}, ${m}, this.value)" title="Day">
                ${Array.from({length: numDays}, (_, i) => i+1).map(n => `<option value="${n}"${safeDay === n ? ' selected' : ''}>${n}</option>`).join('')}
              </select>
              <select onchange="updateSidebarDate(this.value, ${m}, ${safeDay})" title="Year">
                ${years.map(yr => `<option value="${yr}"${y === yr ? ' selected' : ''}>${yr}</option>`).join('')}
              </select>
            </div>
          </div>
        `;
      })()}

                  <div class="post-time">
                    ${post.scheduledDate
                      ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                         ${formatDateTime(post.scheduledDate, post.scheduledTime)}`
                      : `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;background:#1a1f3a;border:1px solid #4b5078;color:#a0a8d0;font-size:11px;font-weight:600">📋 In Queue — unscheduled</span>`
                    }
                  </div>
                  ${post.tags && post.tags.length ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:5px">${post.tags.map(t => `<span class="post-tag-pill" onclick="event.stopPropagation();toggleTagFilter('${escapeHtml(t)}')" style="cursor:pointer" title="Filter by ${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
                  ${post.publishedAt ? `<div style="margin-top:4px;font-size:11px;color:var(--text-muted)">Published ${new Date(post.publishedAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>` : ''}
                  ${post.publishStatus==='failed' ? `<div style="margin-top:4px;font-size:11px;color:var(--text-danger)" title="${escapeHtml(post.publishError||'')}">Error: ${escapeHtml((post.publishError||'Unknown error').substring(0,50))}</div>` : ''}
                  ${post.liveUrl ? `
                    <div style="margin-top:5px">
                      <a href="${escapeHtml(post.liveUrl)}" target="_blank" rel="noopener"
                        style="font-size:11px;color:#5a9fe0;text-decoration:none;display:inline-flex;align-items:center;gap:3px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                        title="${escapeHtml(post.liveUrl)}" onclick="event.stopPropagation()">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        Live post ↗
                      </a>
                    </div>` : ''}
                </div>
                ${state.bulkMode ? '' : renderScheduleBadges(post, platform)}
                ${state.bulkMode ? '' : `
                <div class="post-actions">
                  <button class="btn-edit" onclick="openComposer('${post.id}')">Edit</button>
                  <button class="btn-edit" onclick="duplicatePost('${post.id}')" title="Duplicate post" style="background:var(--bg-elevated)">⧉</button>
                  <div style="position:relative">
                    <button class="btn-edit" onclick="toggleCopyPlatformDropdown(event,'${post.id}')" title="Copy to another platform" style="background:var(--bg-elevated)">⎘ Copy</button>
                    <div id="copy-plat-dd-${post.id}" class="copy-plat-dropdown" style="display:none;top:100%;right:0;margin-top:4px">
                      ${Object.values(PLATFORMS).filter(p=>p.id!==platform.id).map(p=>`
                        <div class="copy-plat-item" onclick="copyPostToPlatform('${post.id}','${p.id}');document.getElementById('copy-plat-dd-${post.id}').style.display='none'">
                          ${p.icon.replace('width="20" height="20"','width="14" height="14"')}
                          <span>${p.name}</span>
                        </div>`).join('')}
                    </div>
                  </div>
                  ${(platform.id === 'pinterest' || platform.id === 'google') && post.publishStatus !== 'published' ? `
                  <button class="btn-edit" onclick="triggerPublish('${post.id}','${platform.id}')" title="Publish now" style="background:${platform.color}22;color:${platform.color};border-color:${platform.color}44">
                    ${post.publishStatus === 'publishing' ? '…' : '▶ Now'}
                  </button>` : ''}
                  <button class="btn-manual-upload" onclick="openManualUploadModal('${post.id}')" title="Mark as manually uploaded">⬆ Uploaded</button>
                  <button class="btn-delete" onclick="confirmDelete('${post.id}')">Delete</button>
                </div>`}
              </div>`;
            }).join('')})()}
          </div>
        `}
        `}
      </div>
    </div>

    <!-- COMPOSER MODAL -->
    ${state.showComposer ? renderComposerModal(platform) : ''}

    <!-- BATCH SCHEDULE MODAL -->
    ${state.showBatchScheduleModal ? renderBatchScheduleModal() : ''}

    <!-- HASHTAG SET MODAL -->
    ${state.showHashtagSetModal ? renderHashtagSetModal() : ''}

    <!-- DELETE CONFIRM -->
    ${state.deleteConfirmId ? renderDeleteConfirm() : ''}

    <!-- MANUAL UPLOAD MODAL -->
    ${state.showManualUploadModal ? renderManualUploadModal() : ''}

    <!-- SETTINGS MODAL -->
    ${state.showSettings ? renderSettingsModal() : ''}

    <!-- INCOMING FROM BRAND CREATOR -->
    ${state.showIncomingModal && state.incomingQueue.length ? renderIncomingModal() : ''}

    <!-- FIRST-RUN PLATFORM PICKER -->
    ${state.showPlatformPicker ? renderPlatformPickerModal() : ''}

    <!-- RESET CONFIRM -->
    ${state.showResetConfirm ? renderResetConfirmModal() : ''}

    <!-- EXPORT MODAL -->
    ${state.showExportModal ? renderExportModal() : ''}
  `;

  bindComposerEvents();
}

// ─── COMPOSER MODAL ─────────────────────────────────────────────────────────
function renderComposerModal(platform) {
  const form = state.form;
  const isEdit = !!state.editingPostId;
  const today = new Date().toISOString().split('T')[0];
  const hours = Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
  const mins = ['00','05','10','15','20','25','30','35','40','45','50','55'];
  const [fHour, fMin] = form.scheduledTime.split(':');

  return `
    <div class="overlay" id="composer-overlay" onclick="handleOverlayClick(event)">
      <div class="modal" id="composer-modal">
        <div class="modal-header">
          <div class="modal-header-left">
            <span style="color:${platform.color};display:flex;align-items:center">${platform.icon}</span>
            <h2 class="modal-title">${isEdit ? 'Edit' : 'Schedule'} ${platform.name} Post</h2>
          </div>
          <button class="close-btn" onclick="closeComposer()">×</button>
        </div>

        <div class="modal-body">
          <!-- Live Post URL -->
          <div class="form-group" style="margin-bottom:14px">
            <label class="form-label" style="display:flex;align-items:center;gap:6px">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;opacity:0.7"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              Live Post URL
              <span style="font-size:10px;color:var(--text-muted);font-weight:400;margin-left:2px">optional</span>
            </label>
            <div style="display:flex;align-items:center;gap:8px">
              <input type="url" id="f-liveurl"
                placeholder="https://  — paste the link to the published post"
                value="${escapeHtml(form.liveUrl || '')}"
                oninput="updateFormField('liveUrl',this.value)"
                style="flex:1;font-size:12.5px"
              />
              ${form.liveUrl ? `<a href="${escapeHtml(form.liveUrl)}" target="_blank" rel="noopener"
                style="display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-light);background:var(--bg-elevated);color:var(--text-secondary);font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background 0.15s"
                onmouseenter="this.style.background='var(--bg-hover)'" onmouseleave="this.style.background='var(--bg-elevated)'"
                title="Open live post">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                Open
              </a>` : ''}
            </div>
          </div>
          <!-- Schedule -->
          <div class="section-divider">Schedule</div>
          <div class="row3">
            <div class="form-group">
              <label class="form-label">Date *</label>
              <input type="date" id="f-date" value="${escapeHtml(form.scheduledDate)}" min="${today}" oninput="checkDateLimit(this.value)"/>
            </div>
            <div class="form-group">
              <label class="form-label">Hour</label>
              <select id="f-hour">
                ${hours.map(h => `<option value="${h}"${h===fHour?' selected':''}>${h}:00</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Minute</label>
              <select id="f-min">
                ${mins.map(m => `<option value="${m}"${m===fMin?' selected':''}>${m}</option>`).join('')}
              </select>
            </div>
          </div>
          <!-- #4 Smart time suggestions -->
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:-4px;margin-bottom:8px">
            <span style="font-size:10px;color:var(--text-muted);font-weight:600;letter-spacing:0.4px">BEST TIMES:</span>
            ${(BEST_TIMES[state.activePlatform]||BEST_TIMES._default).map(t => {
              const active = form.scheduledTime === t;
              return `<button onclick="applySmartTime('${t}')" class="time-slot-chip${active?' time-slot-chip-active':''}">${t}</button>`;
            }).join('')}
          </div>
          <div id="date-limit-warning" style="${form.scheduledDate ? '' : 'display:none'}">
            ${renderDateLimitWarning(form.scheduledDate, state.activePlatform, state.editingPostId)}
          </div>

          <!-- Image -->
          <div class="form-group">
            <label class="form-label" style="display:flex;align-items:center;justify-content:space-between">
              <span>Image</span>
              ${form.image ? `
                <div style="position:relative;display:inline-block">
                  <button onclick="toggleImgDownloadDropdown(event)" title="Download image"
                    style="display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:5px;border:1px solid var(--border-light);background:var(--bg-elevated);color:var(--text-secondary);font-size:11.5px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.15s"
                    onmouseenter="this.style.background='var(--bg-hover)'" onmouseleave="this.style.background='var(--bg-elevated)'">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download
                  </button>
                  <div id="img-dl-dropdown" style="display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:50;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-sm);box-shadow:var(--shadow);min-width:130px;overflow:hidden">
                    <button onclick="downloadFormImage('png')"
                      style="width:100%;padding:9px 14px;text-align:left;background:none;border:none;color:var(--text-primary);font-size:12.5px;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background 0.12s"
                      onmouseenter="this.style.background='var(--bg-elevated)'" onmouseleave="this.style.background='none'">
                      🖼️ Save as PNG
                    </button>
                    <button onclick="downloadFormImage('gif')"
                      style="width:100%;padding:9px 14px;text-align:left;background:none;border:none;color:${form.image && form.image.startsWith('data:image/gif') ? 'var(--text-primary)' : 'var(--text-muted)'};font-size:12.5px;font-family:'DM Sans',sans-serif;cursor:${form.image && form.image.startsWith('data:image/gif') ? 'pointer' : 'not-allowed'};display:flex;align-items:center;gap:8px;transition:background 0.12s;border-top:1px solid var(--border)"
                      onmouseenter="this.style.background='var(--bg-elevated)'" onmouseleave="this.style.background='none'">
                      🎞️ Save as GIF
                      ${!form.image.startsWith('data:image/gif') ? '<span style="font-size:9.5px;color:var(--text-muted);margin-left:auto">N/A</span>' : ''}
                    </button>
                  </div>
                </div>
              ` : ''}
            </label>
            <label class="image-upload-label" for="f-image" style="${form.image ? 'padding:10px;' : ''}">
              ${form.image ? `
                ${form.isVideo ? `<video class="upload-preview" src="${form.image}" style="max-width:100%;max-height:200px;border-radius:6px;display:block;margin:0 auto" controls muted preload="metadata"></video>` : `<img class="upload-preview" src="${form.image}" alt="preview" style="${form.isGif || (form.image && form.image.startsWith('data:image/gif')) ? 'border:2px solid #7c3aed;border-radius:6px' : ''}"/>`}
                ${form.isGif || (form.image && form.image.startsWith('data:image/gif')) ? `<div style="display:inline-flex;align-items:center;gap:5px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.4);border-radius:5px;padding:3px 9px;font-size:11px;font-weight:700;color:#a78bfa;margin-top:6px">🎞️ Animated GIF — animation preserved on upload</div>` : ''}
                <div class="upload-filename" id="upload-fn-display" style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
                  <span id="upload-fn-text">${escapeHtml(form.imageName)}</span>
                  <button onclick="event.stopPropagation();startRename()" title="Rename file"
                    style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;padding:1px 4px;line-height:1;flex-shrink:0;transition:color .15s"
                    onmouseenter="this.style.color='var(--text-primary)'"
                    onmouseleave="this.style.color='var(--text-muted)'">✏️</button>
                  <span style="color:var(--text-muted);font-size:12px"> — click to change</span>
                </div>
                ${form._imageDims ? `
                  <div style="margin-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap">
                    ${form.isVideo ? `<span class="img-quality-badge">🎬 Video · ${form._imageDims}</span>` : form.isGif || (form.image && form.image.startsWith('data:image/gif')) ? `<span class="img-quality-badge">🎞️ Animated GIF · ${form._imageDims}</span>` : `<span class="img-quality-badge${(()=>{const [w,h]=form._imageDims.split('×').map(Number);const minDim=Math.min(w,h);return minDim>=1000?'':minDim>=600?' medium':' low';})()}">${(()=>{const [w,h]=form._imageDims.split('×').map(Number);const minDim=Math.min(w,h);return minDim>=1000?'✓ High quality':'⚠ '+( minDim>=600?'Medium':'Low')+' quality';})()}· ${form._imageDims}px</span>`}
                    <span style="font-size:10.5px;color:var(--text-muted)">Sent at platform-optimal resolution</span>
                  </div>` : ''}
              ` : `
                <div class="upload-icon">📷</div>
                <div class="upload-text">Click to upload image or video</div>
                <div class="upload-hint">JPG, PNG, GIF, MP4, MOV · Full resolution preserved · Max 30MB</div>
              `}
            </label>
            <input type="file" id="f-image" accept="image/*,video/mp4,video/mov,video/webm,video/quicktime" style="display:none" onchange="handleImageUpload(event)"/>
          </div>

          <!-- Platform-specific fields -->
          ${state.activePlatform === 'pinterest' ? renderPinterestFields(form, platform) : ''}
          ${state.activePlatform === 'instagram' ? renderInstagramFields(form, platform) : ''}
          ${state.activePlatform === 'google' ? renderGoogleFields(form, platform) : ''}
          ${state.activePlatform === 'linkedin' ? renderLinkedInFields(form, platform) : ''}
          ${state.activePlatform === 'shopify' ? renderShopifyFields(form, platform) : ''}
          ${state.activePlatform === 'bluesky' ? renderBlueskyFields(form, platform) : ''}
          ${state.activePlatform === 'tiktok' ? renderTiktokFields(form, platform) : ''}
          ${state.activePlatform === 'youtube' ? renderYoutubeFields(form, platform) : ''}
          ${state.activePlatform === 'twitter' ? renderTwitterFields(form, platform) : ''}
          ${state.activePlatform === 'facebook' ? renderFacebookFields(form, platform) : ''}
          ${state.activePlatform === 'kofi' ? renderKofiFields(form, platform) : ''}
          ${state.activePlatform === 'tumblr' ? renderTumblrFields(form, platform) : ''}
          ${state.activePlatform === 'patreon' ? renderPatreonFields(form, platform) : ''}

          <!-- Tags -->
          <div class="section-divider" style="margin-top:8px">Tags</div>
          <div class="form-group">
            <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center" id="composer-tag-pills">
              ${buildComposerTagPills(form.tags || [])}
              <form onsubmit="event.preventDefault();const v=this.querySelector('input').value.trim();if(v){addCustomTag(v);this.querySelector('input').value=''}" style="display:inline-flex;align-items:center;gap:0">
                <input type="text" placeholder="+ New tag"
                  style="padding:4px 10px;border-radius:20px 0 0 20px;border:1px dashed var(--border-light);background:transparent;color:var(--text-secondary);font-size:11px;font-family:'DM Sans',sans-serif;outline:none;width:90px;transition:all 0.15s"
                  onfocus="this.style.borderColor='#7aa3c8';this.style.color='var(--text-primary)'"
                  onblur="this.style.borderColor='var(--border-light)';this.style.color='var(--text-secondary)'"/>
                <button type="submit" style="padding:4px 9px;border-radius:0 20px 20px 0;border:1px dashed var(--border-light);border-left:none;background:transparent;color:var(--text-muted);font-size:11px;cursor:pointer">Add</button>
              </form>
            </div>
            <div style="font-size:10.5px;color:var(--text-muted);margin-top:8px">Select tags or add new ones — used for cross-platform search</div>
          </div>
        </div>

        <!-- #2 Multi-platform scheduling row -->
        ${!isEdit ? `
        <div style="padding:10px 20px 0;border-top:1px solid var(--border)">
          <div style="font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin-bottom:7px">Also post to:</div>
          <div id="multi-platform-row" style="display:flex;flex-wrap:wrap;gap:5px">${renderMultiPlatformRow()}</div>
        </div>` : ''}

        <div class="modal-footer" style="justify-content:space-between">
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn-cancel" onclick="closeComposer()">Cancel</button>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="btn-draft" style="background:#0f2d1a;border-color:#1a5c35;color:#4ade80" onclick="sendComposerToCalendar()" title="Skip the queue — mark as manually uploaded and add directly to the calendar">⬆ Send to Calendar</button>
            ${!isEdit ? `<button class="btn-draft" style="background:#1a1f3a;border-color:#4b5078;color:#a0a8d0" onclick="savePost(true)" title="Save without a date — use Auto-Queue to spread it out later">
              📋 Add to Queue
            </button>` : ''}
            ${isEdit ? `
            <label id="queue-toggle-wrap" style="display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--radius-sm);border:1px solid var(--border-light);background:var(--bg-elevated);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-secondary);font-family:'DM Sans',sans-serif;transition:background 0.15s;user-select:none"
              onmouseenter="this.style.background='var(--bg-hover)'" onmouseleave="this.style.background='var(--bg-elevated)'">
              <input type="checkbox" id="add-to-queue-chk" style="width:14px;height:14px;accent-color:#7aa3c8;cursor:pointer;flex-shrink:0" onchange="
                const wrap = document.getElementById('queue-toggle-wrap');
                const btn = document.getElementById('update-post-btn');
                if (this.checked) {
                  wrap.style.borderColor='#7aa3c8';
                  wrap.style.color='#7aa3c8';
                  btn.textContent='📋 Move to Queue';
                  btn.style.background='linear-gradient(135deg,#1a2d3d 0%,#1e3548 100%)';
                  btn.style.color='#7aa3c8';
                } else {
                  wrap.style.borderColor='var(--border-light)';
                  wrap.style.color='var(--text-secondary)';
                  btn.textContent='✏️ Update Post';
                  btn.style.background='linear-gradient(135deg,#f59e0b 0%,#d97706 100%)';
                  btn.style.color='#0c0e13';
                }
              "/>
              Add to Auto-Queue
            </label>
            ` : ''}
            <button id="update-post-btn" class="btn-save" style="background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);color:#0c0e13" onclick="
              const chk = document.getElementById('add-to-queue-chk');
              savePost(chk ? chk.checked : false);
            ">
              ${isEdit ? '✏️ Update Post' : '📅 Schedule Post'}
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ─── LIVE CHAR COUNTER ───────────────────────────────────────────────────────
function updateCharCounter(elId, current, max) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = current.toLocaleString() + '/' + max.toLocaleString();
  const pct = current / max;
  el.className = 'char-count' + (pct >= 1 ? ' over' : pct >= 0.85 ? ' warn' : '');
}

function renderPinterestFields(form, platform) {
  return `
    <div class="section-divider">Pin Details</div>

      <label class="form-label">Title *</label>

      <div class="char-count" id="cc-title">${form.title.length}/100</div>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea id="f-description" placeholder="Tell people about your Pin" maxlength="500" oninput="updateFormField('description',this.value);updateCharCounter('cc-desc',this.value.length,500)">${escapeHtml(form.description)}</textarea>

    <div class="row2">

            ? `<span style="font-size:10.5px;color:var(--text-success)">✓ ${state.pinterestBoards.length} boards loaded</span>`

        </label>
        <div id="board-dropdown-container">${buildBoardDropdownHtml()}</div>
      </div>
      <div class="form-group">
        <label class="form-label">Destination URL</label>
        <input type="text" id="f-desturl" placeholder="https://" value="${escapeHtml(form.destinationUrl)}" oninput="updateFormField('destinationUrl',this.value)"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" style="display:flex;align-items:center;justify-content:space-between">
        Hashtags
        <div style="position:relative">
          <button type="button" onclick="toggleHashtagSetDropdown('f-hashtags')" class="hs-sets-btn" title="Insert a saved hashtag set">#️⃣ Sets</button>
          <div id="hs-dd-f-hashtags" class="hs-dropdown" style="display:none">${renderHashtagSetDropdownHtml('f-hashtags')}</div>

function driveThumbSrc(url) {
  if (!url) return '';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w400`;
  return url;
}

// Live-update drive thumbnail preview
function updateDriveThumb(imgId, url) {
  const el = document.getElementById(imgId);
  if (!el) return;
  if (el.tagName === 'IMG') {
    el.src = driveThumbSrc(url);
  } else {
    // Replace placeholder span with img
    const wrap = el.parentElement;
    if (url) {
      wrap.innerHTML = `<img id="${imgId}" src="${driveThumbSrc(url)}" style="max-width:100%;max-height:200px;object-fit:contain;border-radius:7px" onerror="this.parentElement.innerHTML='<span style=\'font-size:11px;color:var(--text-muted)\'>Could not load — check Drive link &amp; sharing</span>'">`;
    }
  }
}
