// ─── STORAGE UTILITIES ───────────────────────────────────────────────────────
async function checkStorageUsage() {
  const el = document.getElementById('storage-stats');
  if (!el) return;
  el.textContent = 'Calculating…';
  try {
    let lsBytes = 0;
    for (const key of Object.keys(localStorage)) {
      lsBytes += (localStorage.getItem(key) || '').length * 2;
    }
    const lsMB = (lsBytes / 1024 / 1024).toFixed(2);
    const db = await openImageDb();
    const allEntries = await new Promise((res, rej) => {
      const tx  = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).getAll();
      req.onsuccess = e => res(e.target.result);
      req.onerror   = rej;
    });
    let idbBytes = 0;
    allEntries.forEach(e => { idbBytes += (e.dataUrl || '').length * 2; });
    const idbMB    = (idbBytes / 1024 / 1024).toFixed(1);
    const idbCount = allEntries.length;
    const totalPosts  = Object.values(state.posts).reduce((s, a) => s + a.length, 0);
    const totalDrafts = Object.values(state.drafts).reduce((s, a) => s + a.length, 0);
    const lsWarnColor = lsBytes > 4*1024*1024 ? '#f87171' : lsBytes > 3*1024*1024 ? '#f59e0b' : '#34d399';
    el.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 18px">
        <div><span style="color:${lsWarnColor};font-weight:700">localStorage: ${lsMB} MB</span> <span style="opacity:.6">(limit ~5 MB)</span></div>
        <div>IndexedDB: <strong style="color:#7aa3c8">${idbCount} images · ${idbMB} MB</strong></div>
        <div>Scheduled posts: <strong>${totalPosts}</strong></div>
        <div>Drafts: <strong>${totalDrafts}</strong></div>
      </div>
      ${lsBytes > 4*1024*1024 ? '<div style="margin-top:6px;color:#f87171;font-weight:600">⚠️ localStorage near limit — run GC or delete old posts/drafts</div>' : ''}
    `;
  } catch(e) {
    el.textContent = 'Could not read storage: ' + e.message;
  }
}

async function clearAllImageCache() {
  if (!confirm('Delete ALL stored images from IndexedDB? Posts and drafts will lose their images. This cannot be undone.')) return;
  try {
    const db = await openImageDb();
    await new Promise((res, rej) => {
      const tx  = db.transaction(IMG_STORE, 'readwrite');
      const req = tx.objectStore(IMG_STORE).clear();
      req.onsuccess = res; req.onerror = rej;
    });
    Object.values(state.posts).forEach(arr => arr.forEach(p => {
      p.image = null; p.imageOriginal = null; p._imageDims = '';
    }));
    Object.values(state.drafts).forEach(arr => arr.forEach(d => {
      d.imageFull = null; d.imageThumb = null;
    }));
    render();
    showToast('Image cache cleared. Post metadata is intact.');
    checkStorageUsage();
  } catch(e) {
    showToast('Clear failed: ' + e.message, 'error');
  }
}

function renderDateLimitWarning(date, platformId, editingId) {
  if (!date) return '';
  const dailyLimit = getDailyLimit(platformId);
  const count = (state.posts[platformId] || []).filter(p =>
    p.scheduledDate === date && (editingId ? String(p.id) !== String(editingId) : true)
  ).length;
  const pct = count / dailyLimit;
  const remaining = dailyLimit - count;
  if (pct >= 1) {
    return `<div style="background:var(--bg-danger);border:1px solid var(--border-danger);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;color:var(--text-danger);margin-bottom:14px">🚫 <strong>Daily limit reached</strong> — ${dailyLimit}/${dailyLimit} posts already scheduled on this date. Pick a different day.</div>`;
  }
  if (pct >= 0.5) {
    return `<div style="background:#2d1f0a;border:1px solid #7a4a00;border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;color:#f59e0b;margin-bottom:14px">⚠️ ${count}/${dailyLimit} posts on this date — <strong>${remaining} slot${remaining !== 1 ? 's' : ''} remaining</strong> before daily limit.</div>`;
  }
  return `<div style="background:var(--bg-success);border:1px solid var(--border-success);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;color:var(--text-success);margin-bottom:14px">✓ ${count}/${dailyLimit} posts on this date — ${remaining} slot${remaining !== 1 ? 's' : ''} remaining.</div>`;
}

function checkDateLimit(date) {
  const el = document.getElementById('date-limit-warning');
  if (!el) return;
  if (!date) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = renderDateLimitWarning(date, state.activePlatform, state.editingPostId);
}

function duplicatePost(postId) {
  const platformPosts = state.posts[state.activePlatform];
  if (platformPosts.length >= MAX_POSTS) { showToast(`Max ${MAX_POSTS} posts per platform.`, 'error'); return; }
  const orig = platformPosts.find(p => String(p.id) === String(postId));
  if (!orig) return;
  const copy = { ...orig, id: Date.now(), scheduledDate: '', scheduledTime: orig.scheduledTime };
  const updated = { ...state.posts, [state.activePlatform]: sortPosts([...platformPosts, copy]) };
  state.posts = updated;
  savePosts(updated);
  render();
  showToast('Post duplicated — set a new date!');
}

function matchesPostSearch(post, q) {
  if (!q) return true;
  const fields = [
    post.title, post.caption, post.description, post.content,
    post.liText, post.hashtags, post.imageName,
    ...(post.tags || []),
  ];
  return fields.some(f => f && f.toLowerCase().includes(q));
}

  const drafts    = state.drafts[platform] || [];
  const selected  = drafts.filter(d => state.selectedDrafts.has(String(d.id)));
  const { startDate, time, spacing } = state.batchScheduleForm;
  if (!startDate) { showToast('Please set a start date.', 'error'); return; }

  const spacingDays = { daily: 1, 'every2': 2, weekly: 7, 'mwf': null };
  const mwf = [1, 3, 5]; // Mon Wed Fri

  let scheduled = 0;
  let current = new Date(startDate + 'T00:00:00');

  for (let i = 0; i < selected.length; i++) {
    const draft = selected[i];
    if ((state.posts[platform] || []).length >= MAX_POSTS) {
      showToast(`Hit post limit (${MAX_POSTS}) after scheduling ${scheduled} posts.`, 'error');
      break;
    }
    const dateStr = current.toISOString().split('T')[0];
    const newPost = {
      ...defaultForm(platform),
      id: Date.now() + i,
      platform,
      image: draft.imageFull || draft.imageFull,
      imageOriginal: draft.imageFull,
      imageName: draft.imageName,
      isVideo: draft.isVideo,
      isGif: draft.isGif,
      tags: draft.tags || [],
      scheduledDate: dateStr,
      scheduledTime: time,
    };
    state.posts[platform] = sortPosts([...(state.posts[platform] || []), newPost]);
    scheduled++;

    // Advance date
    if (spacing === 'mwf') {
      // Find next MWF date
      do { current.setDate(current.getDate() + 1); } while (!mwf.includes(current.getDay()));
    } else {
      current.setDate(current.getDate() + (spacingDays[spacing] || 1));
    }
  }

  savePosts(state.posts);
  state.showBatchScheduleModal = false;
  state.draftSelectMode = false;
  state.selectedDrafts = new Set();
  render();
  showToast(`🎉 ${scheduled} post${scheduled !== 1 ? 's' : ''} scheduled from drafts!`);
}

function isPostOverdue(post) {
  if (!post.scheduledDate || post.manualUpload || post.publishStatus === 'published') return false;
  const now = new Date();
  const postTime = new Date(post.scheduledDate + 'T' + (post.scheduledTime || '23:59'));
  return postTime < now;
}
function getOverduePosts(platformId) {
  return (state.posts[platformId] || []).filter(isPostOverdue);
}

function copyPostToPlatform(postId, targetPlatformId) {
  const src = (state.posts[state.activePlatform] || []).find(p => String(p.id) === String(postId));
  if (!src) return;
  const targetPosts = state.posts[targetPlatformId] || [];
  if (targetPosts.length >= MAX_POSTS) {
    showToast(`${PLATFORMS[targetPlatformId].name} is at max posts (${MAX_POSTS}).`, 'error'); return;
  }
  // Build a copy adapted for the target platform, clearing platform-specific fields
  const copy = {
    ...defaultForm(targetPlatformId),
    id: Date.now() + Math.random(),
    platform: targetPlatformId,
    scheduledDate: '', scheduledTime: src.scheduledTime || '09:00',
    image: src.image, imageOriginal: src.imageOriginal || src.image, imageName: src.imageName || '',
    tags: src.tags || [],
    // Carry over universal text fields; let the user edit platform-specifics
    title: src.title || '',
    caption: src.caption || src.liText || src.content || '',
    description: src.description || '',
    content: src.content || src.liText || src.caption || '',
    liText: src.liText || src.caption || src.content || '',
    hashtags: src.hashtags || '',
  };
  state.posts = { ...state.posts, [targetPlatformId]: sortPosts([...targetPosts, copy]) };
  savePosts(state.posts);
  showToast(`Copied to ${PLATFORMS[targetPlatformId].name} — open it to set a date & tweak text!`);
}

function toggleCopyPlatformDropdown(e, postId) {

  document.querySelectorAll('[id^="copy-plat-dd-"]').forEach(el => el.style.display = 'none');

  }
}

function applyBulkReschedule() {
  const modal = document.getElementById('bulk-reschedule-modal');
  const mode = document.querySelector('input[name="bulk-mode"]:checked')?.value || 'shift';
  const ids = state.bulkSelected || new Set();
  if (ids.size === 0) { if (modal) modal.remove(); return; }

  const platform = state.activePlatform;
  let posts = [...(state.posts[platform] || [])];

  if (mode === 'shift') {
    const days = parseInt(document.getElementById('bulk-days-input').value) || 0;
    posts = posts.map(p => {
      if (!ids.has(String(p.id)) || !p.scheduledDate) return p;
      const d = new Date(p.scheduledDate + 'T00:00:00');
      d.setDate(d.getDate() + days);
      return { ...p, scheduledDate: d.toISOString().split('T')[0] };
    });
    showToast(`${ids.size} post${ids.size!==1?'s':''} shifted by ${days > 0 ? '+' : ''}${days} days`);
  } else {
    const startDateStr = document.getElementById('bulk-start-date').value;
    if (!startDateStr) { showToast('Pick a start date first.', 'error'); return; }
    const selectedPosts = posts.filter(p => ids.has(String(p.id))).sort((a,b) => {
      const ad = a.scheduledDate || '9999'; const bd = b.scheduledDate || '9999';
      return ad < bd ? -1 : ad > bd ? 1 : 0;
    });
    let cursor = new Date(startDateStr + 'T00:00:00');
    const newDates = {};
    selectedPosts.forEach(p => {
      newDates[String(p.id)] = cursor.toISOString().split('T')[0];
      cursor.setDate(cursor.getDate() + 1);
    });
    posts = posts.map(p => ids.has(String(p.id)) ? { ...p, scheduledDate: newDates[String(p.id)] } : p);
    showToast(`${ids.size} post${ids.size!==1?'s':''} rescheduled from ${startDateStr}`);
  }

  state.posts = { ...state.posts, [platform]: sortPosts(posts) };
  savePosts(state.posts);
  state.bulkSelected = new Set();
  state.bulkMode = false;
  if (modal) modal.remove();
  render();
}

function bulkDeleteSelected() {
  const ids = state.bulkSelected || new Set();
  if (ids.size === 0) return;
  if (!confirm(`Delete ${ids.size} post${ids.size!==1?'s':''}? This cannot be undone.`)) return;
  const platform = state.activePlatform;
  const posts = (state.posts[platform] || []).filter(p => !ids.has(String(p.id)));
  state.posts = { ...state.posts, [platform]: posts };
  savePosts(state.posts);
  state.bulkSelected = new Set();
  state.bulkMode = false;
  render();
  showToast(`${ids.size} post${ids.size!==1?'s':''} deleted.`);
}

function openComposer(postId) {
  if (postId) {
    const post = (state.posts[state.activePlatform]||[]).find(p=>String(p.id)===String(postId));
    if (post) {
      state.editingPostId = post.id;
      state.form = {...post};
      // Populate image dimensions if image exists but dims not stored
      if (post.image && !state.form._imageDims) {
        getImageSizeLabel(post.imageOriginal || post.image).then(dims => {
          if (state.form) { state.form._imageDims = dims; render(); }
        });
      }
    }
  } else {
    state.editingPostId = null;
    state.form = defaultForm(state.activePlatform);
  }
  state.showComposer = true;
  render();
  // Auto-load Pinterest boards if key is saved and not yet fetched
  if (state.activePlatform === 'pinterest' && state.apiKeys.pinterest && state.pinterestBoardsStatus === 'idle') {
    fetchPinterestBoards();
  }
  // Auto-load LinkedIn profile if key is saved and not yet fetched
  if (state.activePlatform === 'linkedin' && state.apiKeys.linkedin && !state.linkedinPersonId) {
    fetchLinkedInProfile();
  }
}

function closeComposer() {
  state.showComposer = false;
  state.editingPostId = null;
  state.form = null;
  setTimeout(() => recalcStreak(state.activePlatform), 120);
  render();
}

function _formHasContent() {
  const f = state.form;
  if (!f) return false;
  return !!(f.image || f.title || f.caption || f.description ||
            f.content || f.liText || f.hashtags || f.destinationUrl);
}

function closeComposerOrDraft() {
  if (!state.form || !_formHasContent()) {
    closeComposer();
    return;
  }
  syncFormFromDOM();
  const form = state.form;
  const platform = state.activePlatform;
  const existing = state.drafts[platform] || [];
  if (existing.length >= MAX_DRAFTS) {
    closeComposer();
    showToast('Draft bank full — post was discarded.', 'error');
    return;
  }
  const draft = {
    id: Date.now() + Math.random(),
    platform,
    imageFull: form.imageOriginal || form.image || null,
    imageThumb: form.image || null,
    imageName: form.imageName || 'draft.png',
    notes: (form.title || form.caption || form.content || form.liText || '').substring(0, 200),
    uploadedAt: new Date().toISOString(),
    tags: form.tags || [],
    formSnapshot: { ...form },
  };
  const updated = { ...state.drafts, [platform]: [...existing, draft] };
  state.drafts = updated;
  saveDrafts(updated);
  closeComposer();
  showToast('Post auto-saved to drafts!');
}

  if (e.target.id === 'composer-overlay') closeComposerOrDraft();

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file || !state.form) return;
  state.form.imageName = file.name;
  const isVideo = file.type.startsWith('video/');
  const isGif   = file.type === 'image/gif';
  state.form.isVideo = isVideo;
  state.form.isGif   = isGif;
  const reader = new FileReader();
  reader.onload = async ev => {
    const dataUrl = ev.target.result;
    state.form.image         = dataUrl;
    state.form.imageOriginal = dataUrl;
    state.form.imageId         = null;
    state.form.imageOriginalId = null;
    const sizeLabel = await getImageSizeLabel(dataUrl);
    state.form._imageDims = sizeLabel;
    render();
  };
  reader.readAsDataURL(file);
}

// ─── FILE RENAME ─────────────────────────────────────────────────────────────
function startRename() {
  const display = document.getElementById('upload-fn-display');
  if (!display) return;
  const currentName = (state.form && state.form.imageName) || 'image.png';
  const dotIdx = currentName.lastIndexOf('.');
  const baseName = dotIdx > 0 ? currentName.slice(0, dotIdx) : currentName;
  const ext = dotIdx > 0 ? currentName.slice(dotIdx) : '.png';
  display.dataset.ext = ext;
  display.innerHTML =
    `<input id="rename-input" type="text" autocomplete="off" spellcheck="false"
       style="flex:1;min-width:0;max-width:200px;padding:2px 7px;font-size:12px;
              font-family:'DM Sans',sans-serif;border-radius:5px;
              border:1px solid #7aa3c8;background:var(--bg-elevated,#1c1c28);
              color:var(--text-primary,#e6e6f0);outline:none;"
     /><span style="font-size:12px;color:var(--text-muted);flex-shrink:0">${ext}</span>`;
  const input = document.getElementById('rename-input');
  input.value = baseName;
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commitRename(); }
    if (e.key === 'Escape') cancelRename();
  });
  input.addEventListener('blur', () => setTimeout(commitRename, 80));
  input.focus(); input.select();
}

function _restoreFilenameDisplay() {
  const display = document.getElementById('upload-fn-display');
  if (!display) return;
  const name = (state.form && state.form.imageName) || '';
  display.innerHTML =
    `<span id="upload-fn-text">${name.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>
     <button onclick="event.stopPropagation();startRename()" title="Rename file"
       style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;
              padding:1px 4px;line-height:1;flex-shrink:0;transition:color .15s"
       onmouseenter="this.style.color='var(--text-primary)'"
       onmouseleave="this.style.color='var(--text-muted)'">✏️</button>
     <span style="color:var(--text-muted);font-size:12px"> — click to change</span>`;
}

function commitRename() {
  const display = document.getElementById('upload-fn-display');
  const input = document.getElementById('rename-input');
  if (!input || !display || !state.form) return;
  const ext = display.dataset.ext || '.png';
  const raw = input.value.trim().replace(/[<>:"/\\|?*\x00-\x1f]/g, '_');
  const val = raw || 'image';
  state.form.imageName = val + ext;
  _restoreFilenameDisplay();
}

function cancelRename() {
  _restoreFilenameDisplay();
}

function syncFormFromDOM() {
  if (!state.form) return;
  const g = id => { const el = document.getElementById(id); return el ? el.value : null; };
  const date = g('f-date'); if (date !== null) state.form.scheduledDate = date;
  const hour = g('f-hour'); const min = g('f-min');
  if (hour !== null && min !== null) state.form.scheduledTime = `${hour}:${min}`;
  const liveUrl = g('f-liveurl'); if (liveUrl !== null) state.form.liveUrl = liveUrl;
  // platform fields
  const fields = {
    pinterest: [['f-title','title'],['f-description','description'],['f-board','board'],['f-desturl','destinationUrl'],['f-hashtags','hashtags']],
    instagram: [['f-caption','caption'],['f-hashtags','hashtags'],['f-location','location'],['f-alttext','altText']],
    google: [['f-event-title','eventTitle'],['f-content','content'],['f-cta','ctaType'],['f-ctaurl','ctaUrl'],
             ['f-evstart','eventStart'],['f-evend','eventEnd'],['f-ofstart','eventStart'],['f-ofend','eventEnd'],
             ['f-coupon','couponCode'],['f-redurl','redemptionUrl'],['f-ofterms','offerTerms']],
    linkedin: [['f-li-text','liText'],['f-li-url','liArticleUrl'],['f-li-visibility','liVisibility']],
  };
  (fields[state.activePlatform]||[]).forEach(([id, key]) => { const v = g(id); if (v !== null) state.form[key] = v; });
  // Pinterest board select
  if (state.activePlatform === 'pinterest') {
    const sel = document.getElementById('f-board-select');
    if (sel && sel.value) {
      state.form.boardId = sel.value;
      state.form.board = sel.options[sel.selectedIndex].text.replace(/\s*\(\d+ pins\)$/, '');
    }
  }
  // LinkedIn author select
  if (state.activePlatform === 'linkedin') {
    const sel = document.getElementById('li-author-select');
    if (sel) selectLinkedInAuthor(sel.value);
  }
}

function downloadFormImage(fmt) {
  const image = state.form && state.form.image;
  if (!image) { showToast('No image to download.', 'error'); return; }

  // Close the dropdown
  const dd = document.getElementById('img-dl-dropdown');
  if (dd) dd.style.display = 'none';

  // ── Build smart filename ──────────────────────────────────────────────────
  // Priority: post title → original image name → fallback
  const rawTitle = (
    state.form.title ||          // Pinterest / LinkedIn title
    state.form.eventTitle ||     // Google Event title
    state.form.caption ||        // Instagram caption (first ~40 chars)
    state.form.content ||        // Google / LinkedIn text
    state.form.liText ||
    ''
  ).trim().substring(0, 60);

  let baseName;
  if (rawTitle) {
    // Sanitize title: replace non-alphanumeric (except spaces) with nothing, then spaces → _
    const safeName = rawTitle.replace(/[^a-zA-Z0-9 ]/g, '').trim().replace(/\s+/g, '_');
    // Append scheduled date as M-D-YY
    let dateSuffix = '';
    if (state.form.scheduledDate) {
      const [yyyy, mm, dd2] = state.form.scheduledDate.split('-');
      dateSuffix = `_${parseInt(mm)}-${parseInt(dd2)}-${String(yyyy).slice(-2)}`;
    }
    baseName = safeName + dateSuffix;
  } else {
    // No title — fall back to original image name (stripped of extension)
    baseName = (state.form.imageName || 'PostPilot_image').replace(/\.[^.]+$/, '');
  }

  const ext = fmt === 'gif' ? '.gif' : '.png';
  const fileName = baseName + ext;

  // ── Helper: save a Blob, preferring showSaveFilePicker ───────────────────
  async function saveBlobWithPicker(blob, suggestedName) {
    if (window.showSaveFilePicker) {
      try {
        const exts = fmt === 'gif'
          ? [{ description: 'GIF Image', accept: { 'image/gif': ['.gif'] } }]
          : [{ description: 'PNG Image', accept: { 'image/png': ['.png'] } }];
        const handle = await window.showSaveFilePicker({
          suggestedName,
          types: exts,
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        showToast('Image saved!');
        return;
      } catch (err) {
        if (err.name === 'AbortError') return; // user cancelled
        // Fall through to legacy download
      }
    }
    // Legacy fallback
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = suggestedName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  if (fmt === 'gif') {
    if (!image.startsWith('data:image/gif')) {
      showToast('No GIF version — image was uploaded as PNG/JPEG.', 'error');
      return;
    }
    // Convert data URL to Blob
    const byteStr = atob(image.split(',')[1]);
    const ab = new Uint8Array(byteStr.length);
    for (let i = 0; i < byteStr.length; i++) ab[i] = byteStr.charCodeAt(i);
    saveBlobWithPicker(new Blob([ab], { type: 'image/gif' }), fileName);
    return;
  }

  // PNG — render via canvas
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext('2d').drawImage(img, 0, 0);
    canvas.toBlob(blob => {
      saveBlobWithPicker(blob, fileName);
    }, 'image/png');
  };
  img.src = image;
}

function toggleImgDownloadDropdown(e) {

  const isVisible = dd.style.display === 'block';

  }

function savePost(addToQueue = false) {
  syncFormFromDOM();
  const form = state.form;

  if (addToQueue) {
    form.scheduledDate = '';
    form.scheduledTime = '09:00';
    state.form.scheduledDate = '';
    state.form.scheduledTime = '09:00';
  }

  if (!addToQueue && !form.scheduledDate) { showToast('Please set a scheduled date, or use "Add to Queue".', 'error'); return; }
  const platformPosts = state.posts[state.activePlatform];
  const isNew = !state.editingPostId;
  if (isNew && platformPosts.length >= MAX_POSTS) { showToast(`Max ${MAX_POSTS} posts per platform.`, 'error'); return; }

  if (form.scheduledDate) {
    const dailyLimit = getDailyLimit(state.activePlatform);
    const postsOnDate = platformPosts.filter(p =>
      p.scheduledDate === form.scheduledDate && (!isNew ? String(p.id) !== String(state.editingPostId) : true)
    ).length;
    if (postsOnDate >= dailyLimit) {
      showToast(`Daily limit reached! Max ${dailyLimit} post${dailyLimit !== 1 ? 's' : ''}/day on ${PLATFORMS[state.activePlatform].name}.`, 'error');
      return;
    }
  }

  let updated;
  if (isNew) {
    const newPost = {...form, id: Date.now(), platform: state.activePlatform};
    updated = {...state.posts, [state.activePlatform]: sortPosts([...platformPosts, newPost])};
  } else {
    updated = {...state.posts, [state.activePlatform]: sortPosts(platformPosts.map(p=>p.id===state.editingPostId ? {...form} : p))};
  }

  // #2 Multi-platform: create adapted copies for each extra platform
  if (isNew && state.multiPlatforms.size > 0) {
    state.multiPlatforms.forEach(pid => {
      if (pid === state.activePlatform) return;
      const targetPosts = updated[pid] || [];
      if (targetPosts.length >= MAX_POSTS) return; // skip if target platform is full
      const copy = {
        ...defaultForm(pid),
        id: Date.now() + Math.random(),
        platform: pid,
        scheduledDate: form.scheduledDate,
        scheduledTime: form.scheduledTime,
        image: form.image, imageOriginal: form.imageOriginal || form.image,
        imageName: form.imageName, isVideo: form.isVideo, isGif: form.isGif,
        tags: form.tags || [],
        // Map text to best-match field for target platform
        title:   form.title || '',
        caption: form.caption || form.liText || form.content || '',
        content: form.content || form.liText || form.caption || '',
        liText:  form.liText  || form.caption || form.content || '',
        description: form.description || '',
        hashtags: form.hashtags || '',
      };
      updated[pid] = sortPosts([...targetPosts, copy]);
    });
    state.multiPlatforms = new Set(); // reset after scheduling
  }

  state.posts = updated;
  savePosts(updated);
  closeComposer();
  if (addToQueue) {
    showToast(isNew ? 'Added to Auto-Queue!' : 'Post moved to Auto-Queue!');
  } else {
    if (isNew) celebrateSchedule(state.activePlatform);
    const extra = state.multiPlatforms ? state.multiPlatforms.size : 0;
    showToast(isNew ? `Post scheduled! 🎉${extra>0?' (+ '+extra+' platforms)':''}` : 'Post updated!');
  }
}

function sendComposerToCalendar() {
  syncFormFromDOM();
  const form = state.form;
  const platform = state.activePlatform;

  // Use the scheduled date if set, otherwise default to today
  const now = new Date();
  const date = form.scheduledDate || now.toISOString().split('T')[0];
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const time = form.scheduledTime || `${hh}:${mm}`;

  // If editing an existing post, remove it from the queue first
  if (state.editingPostId) {
    state.posts[platform] = (state.posts[platform] || []).filter(
      p => String(p.id) !== String(state.editingPostId)
    );
  }

  // Build a lightweight calendar-only post (strip image blob to save space)
  const calPost = {
    ...form,
    id: state.editingPostId || Date.now(),
    platform,
    image: null,
    scheduledDate: date,
    scheduledTime: time,
    publishStatus: 'published',
    publishedAt: new Date(`${date}T${time}`).toISOString(),
    manualUpload: true,
    postLink: form.destinationUrl || form.liArticleUrl || '',
  };

  const updated = {
    ...state.posts,
    [platform]: [...(state.posts[platform] || []), calPost],
  };
  state.posts = updated;
  savePosts(updated);
  closeComposer();

  // Switch to calendar so the user sees their new entry
  switchView('calendar');
  showToast('Added to calendar! 📅');
}

function performExport() {
  const selection = state.exportSelection;
  if (!selection || selection.size === 0) return;

  const now = new Date();
  const isAll = selection.size === Object.keys(PLATFORMS).length;
  const labelParts = isAll ? ['all-accounts'] : [...selection].map(pid => PLATFORMS[pid] ? PLATFORMS[pid].name.toLowerCase().replace(/\s+/g, '-') : pid);
  const fileLabel  = labelParts.join('_');

  const exportData = {
    exportedAt:  now.toISOString(),
    exportedBy:  'PostPilot Social Media Organizer',
    scope:       isAll ? 'all-accounts' : [...selection],
    summary: {
      totalScheduledPosts: [...selection].reduce((s, pid) => s + (state.posts[pid]  || []).length, 0),
      totalDrafts:         [...selection].reduce((s, pid) => s + (state.drafts[pid] || []).length, 0),
      platforms: [...selection].map(pid => ({
        platform:       (PLATFORMS[pid] && PLATFORMS[pid].name) || pid,
        scheduledPosts: (state.posts[pid]  || []).length,
        drafts:         (state.drafts[pid] || []).length,
      })),
    },
    scheduledPosts: [...selection].reduce((acc, pid) => {
      acc[pid] = state.posts[pid] || [];
      return acc;
    }, { _note: 'Posts queued for publishing, organized by platform' }),
    drafts: [...selection].reduce((acc, pid) => {
      acc[pid] = state.drafts[pid] || [];
      return acc;
    }, { _note: 'Saved draft images, organized by platform' }),
  };

  const data = JSON.stringify(exportData, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `postpilot_backup_${fileLabel}_${now.toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);

  closeExportModal();
  showToast(`Backup saved! ${exportData.summary.totalScheduledPosts} post(s) + ${exportData.summary.totalDrafts} draft(s) exported.`);
}

async function importPostsFromFile(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.exportedBy || !data.exportedBy.includes('PostPilot')) {
        showToast('Invalid backup file — not a PostPilot export.', 'error');
        return;
      }
      let imported = 0, skipped = 0;
      if (data.scheduledPosts) {
        Object.keys(data.scheduledPosts).forEach(pid => {
          if (pid === '_note') return;
          const incoming = data.scheduledPosts[pid];
          if (!Array.isArray(incoming)) return;
          if (!state.posts[pid]) state.posts[pid] = [];
          const existingIds = new Set(state.posts[pid].map(p => String(p.id)));
          incoming.forEach(post => {
            if (!existingIds.has(String(post.id))) {
              state.posts[pid].push(post);
              existingIds.add(String(post.id));
              imported++;
            } else { skipped++; }
          });
        });
        savePosts(state.posts);
      }
      if (data.drafts) {
        Object.keys(data.drafts).forEach(pid => {
          if (pid === '_note') return;
          const incoming = data.drafts[pid];
          if (!Array.isArray(incoming)) return;
          if (!state.drafts[pid]) state.drafts[pid] = [];
          const existingIds = new Set(state.drafts[pid].map(d => String(d.id)));
          incoming.forEach(draft => {
            if (!existingIds.has(String(draft.id))) {
              state.drafts[pid].push(draft);
              existingIds.add(String(draft.id));
              imported++;
            } else { skipped++; }
          });
          saveDrafts(state.drafts); // async, fire-and-forget
        });
      }
      render();
      const msg = imported > 0
        ? '✅ Imported ' + imported + ' item' + (imported !== 1 ? 's' : '') + '!' + (skipped > 0 ? ' (' + skipped + ' duplicates skipped)' : '')
        : 'Nothing new to import — ' + skipped + ' duplicate' + (skipped !== 1 ? 's' : '') + ' already exist.';
      showToast(msg);
    } catch(err) {
      showToast('Failed to parse backup file: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

// ─── MANUAL UPLOAD ───────────────────────────────────────────────────────────
function loadManualUploads() {
  try {
    const raw = localStorage.getItem(MANUAL_UPLOAD_STORAGE_KEY());
    if (raw) return JSON.parse(raw);
  } catch {}
  return [];
}

function saveManualUploads(uploads) {
  try {
    // Save only lightweight archive data (no image blobs) to save space
    const archived = uploads.map(u => ({
      id: u.id,
      platform: u.platform,
      title: u.title || '',
      description: u.description || u.caption || u.content || u.liText || '',
      uploadedDate: u.uploadedDate,
      uploadedTime: u.uploadedTime,
      postLink: u.postLink || '',
      archivedAt: u.archivedAt,
      tags: u.tags || [],
    }));
    localStorage.setItem(MANUAL_UPLOAD_STORAGE_KEY(), JSON.stringify(archived));
  } catch (e) {
    console.warn('Manual upload archive save failed:', e);
  }
}

function openManualUploadModal(postId) {
  const now = new Date();
  const dateStr = now.toISOString().split('T')[0];
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  state.showManualUploadModal = true;
  state.manualUploadPostId = postId;
  state.manualUploadForm = {
    date: dateStr,
    time: `${hh}:${mm}`,

  };

function closeManualUploadModal() {
  state.showManualUploadModal = false;

  state.manualUploadForm = { date: '', time: '', link: '' };

}

function confirmManualUpload() {
  const { date, time, link } = state.manualUploadForm;
  if (!date || !time) {
    showToast('Please enter the date and time of upload.', 'error');
    return;
  }

  const postId = state.manualUploadPostId;
  const platform = state.activePlatform;
  const post = (state.posts[platform] || []).find(p => String(p.id) === String(postId));
  if (!post) {
    showToast('Post not found.', 'error');
    closeManualUploadModal();
    return;
  }

  // Archive a lightweight copy (no image blob)
  const archived = {
    ...post,
    image: null, // strip image to save storage space
    uploadedDate: date,
    uploadedTime: time,
    postLink: link || '',
    archivedAt: new Date().toISOString(),
  };

  const existing = loadManualUploads();
  saveManualUploads([...existing, archived]);

  // Remove from scheduled posts
  const updated = {
    ...state.posts,
    [platform]: state.posts[platform].filter(p => String(p.id) !== String(postId)),
  };
  state.posts = updated;
  savePosts(updated);

  // Add as a calendar event marker — set scheduledDate/Time to the upload date/time
  // so it appears on the calendar with a special "uploaded" status
  // We do this by re-adding the post with publishStatus = 'published' and the upload date
  const calPost = {
    ...post,
    image: null,
    scheduledDate: date,
    scheduledTime: time,
    publishStatus: 'published',
    publishedAt: new Date(`${date}T${time}`).toISOString(),
    manualUpload: true,
    postLink: link || '',
  };
  const withCalEntry = {
    ...state.posts,
    [platform]: [...(state.posts[platform] || []), calPost],
  };
  state.posts = withCalEntry;
  savePosts(withCalEntry);

  closeManualUploadModal();
  showToast('Marked as uploaded! Post moved to calendar.');
}

function updateManualPostLink(postId, platformId, url) {
  const posts = state.posts[platformId] || [];
  const idx = posts.findIndex(p => String(p.id) === String(postId));
  if (idx === -1) return;
  const updated = [...posts];
  updated[idx] = { ...updated[idx], postLink: url.trim() };
  state.posts = { ...state.posts, [platformId]: updated };
  savePosts(state.posts);
}

function launchRocket(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  // Ghost rocket, pointed up (rotated -45deg to match icon orientation)
  const ghost = document.createElement('div');
  ghost.textContent = '🚀';
  ghost.style.cssText = `
    position:fixed;
    left:${cx}px;
    top:${cy}px;
    font-size:26px;
    line-height:1;
    pointer-events:none;
    z-index:99999;
    transform-origin:50% 50%;
    transform:translate(-50%,-50%) rotate(-45deg);
    will-change:transform,opacity;
  `;
  document.body.appendChild(ghost);
  el.style.opacity = '0';

  // --- Phase 1: rumble/vibrate on the pad (280ms) ---
  const RUMBLE_MS = 280;
  const LAUNCH_MS = 700;
  let startTime = null;
  let lastParticle = 0;

  function spawnExhaust(x, y, phase) {
    const count = phase === 'rumble' ? 1 : 2;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      const size = phase === 'rumble' ? 3 + Math.random()*3 : 5 + Math.random()*5;
      const hue  = phase === 'rumble' ? 200 + Math.random()*40 : 25 + Math.random()*35;
      const lit  = phase === 'rumble' ? '55%' : '65%';
      p.style.cssText = `
        position:fixed;
        left:${x + (Math.random()-0.5)*10}px;
        top:${y}px;
        width:${size}px;height:${size}px;
        border-radius:50%;
        background:hsl(${hue},100%,${lit});
        pointer-events:none;z-index:99998;
        opacity:0.85;
      `;
      document.body.appendChild(p);
      const dx = (Math.random()-0.5) * (phase==='rumble'?12:20);
      const dy = phase==='rumble' ? Math.random()*8+4 : Math.random()*14+6;
      let t = 0;
      const tick = () => {
        t += 0.055;
        p.style.transform = `translate(${dx*t}px,${dy*t}px) scale(${Math.max(0,1-t)})`;
        p.style.opacity = String(Math.max(0, 0.85-t));
        if (t < 1) requestAnimationFrame(tick); else p.remove();
      };
      requestAnimationFrame(tick);
    }
  }

  // Shake table: pre-computed X offsets (tiny side-to-side judder)
  const shakes = [-2,2,-3,3,-2,2,-1,1,-3,3,-2,1,-3,2,-1];
  let shakeIdx = 0;

  function rumbleFrame(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const t = Math.min(elapsed / RUMBLE_MS, 1);

    // Vibrate left/right, also tiny vertical nudge downward (sitting on pad)
    const sx = shakes[shakeIdx % shakes.length] * (1 - t * 0.3);
    const sy = Math.sin(elapsed / 18) * 1.2;
    shakeIdx++;
    ghost.style.transform = `translate(calc(-50% + ${sx}px), calc(-50% + ${sy}px)) rotate(-45deg)`;

    // Exhaust sputtering underneath
    if (ts - lastParticle > 55) {
      spawnExhaust(cx, cy + 10, 'rumble');
      lastParticle = ts;
    }

    if (t < 1) {
      requestAnimationFrame(rumbleFrame);
    } else {
      // Hand off to launch phase
      startTime = null;
      requestAnimationFrame(launchFrame);
    }
  }

  function easeOut3(t) { return 1 - Math.pow(1 - t, 3); }

  function launchFrame(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const t = Math.min(elapsed / LAUNCH_MS, 1);

    // Ease-out vertical lift (starts fast, decelerates — feels like boosting off)
    const flyY = -easeOut3(t) * 520;
    // Tiny rightward drift (real rockets drift slightly)
    const flyX = t * 18;
    // Scale: grows 40% as it launches, then shrinks in final 25%
    const scale = t < 0.75 ? 1 + t * 0.4 : (1.4) * (1 - ((t - 0.75) / 0.25) * 0.95);
    // Fade only in last 15%
    const opacity = t > 0.85 ? Math.max(0, 1 - (t - 0.85) / 0.15) : 1;

    ghost.style.transform = `translate(calc(-50% + ${flyX}px), calc(-50% + ${flyY}px)) rotate(-45deg) scale(${Math.max(0.01,scale)})`;
    ghost.style.opacity = String(opacity);

    // Bright exhaust during launch
    if (ts - lastParticle > 35 && t < 0.85) {
      spawnExhaust(cx + flyX, cy + flyY + 16, 'launch');
      lastParticle = ts;
    }

    if (t < 1) {
      requestAnimationFrame(launchFrame);
    } else {
      ghost.remove();
    }
  }

  requestAnimationFrame(rumbleFrame);
}

  if (tourStep <= 0) return;

function animateCardOut(cb) {
  const card = document.getElementById('tour-card');
  if (!card) { cb(); return; }
  const dir = tourDirection;
  card.style.animation = dir > 0
    ? 'tourCardOutLeft 0.22s cubic-bezier(.4,0,1,1) forwards'

  setTimeout(cb, 200);
}

function renderTourStep() {
  // Remove old card + spotlight only (keep overlay backdrop)
  const oldCard = document.getElementById('tour-card');
  if (oldCard) oldCard.remove();
  const oldSpot = document.getElementById('tour-spotlight-ring');
  if (oldSpot) oldSpot.remove();
  const oldSvg = document.getElementById('tour-svg-mask');
  if (oldSvg) oldSvg.remove();

  const step = TOUR_STEPS[tourStep];
  const isFirst = tourStep === 0;
  const isLast = tourStep === TOUR_STEPS.length - 1;
  const pct = Math.round((tourStep / (TOUR_STEPS.length - 1)) * 100);
  const dir = tourDirection;

  let overlay = document.getElementById('tour-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'tour-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:9000;pointer-events:none;animation:tourOverlayIn 0.35s ease forwards;';
    document.body.appendChild(overlay);
  }

  // Find target
  let targetEl = null;
  if (step.targetSelector) targetEl = document.querySelector(step.targetSelector);

  // Lift target element above overlay so it's visually highlighted and clickable
  // Clean up any previous lift first
  const prevLifted = document.querySelector('[data-tour-lifted]');
  if (prevLifted) {
    prevLifted.style.position = prevLifted.dataset.tourOrigPosition || '';
    prevLifted.style.zIndex = prevLifted.dataset.tourOrigZindex || '';
    prevLifted.removeAttribute('data-tour-lifted');
    prevLifted.removeAttribute('data-tour-orig-position');
    prevLifted.removeAttribute('data-tour-orig-zindex');
  }
  if (targetEl) {
    const cs = window.getComputedStyle(targetEl);
    targetEl.dataset.tourOrigZindex = targetEl.style.zIndex || '';
    targetEl.dataset.tourOrigPosition = targetEl.style.position || '';
    targetEl.dataset.tourLifted = '1';
    if (cs.position === 'static') targetEl.style.position = 'relative';
    targetEl.style.zIndex = '9003';
  }

  // ── SVG dim + spotlight ──
  const vw = window.innerWidth, vh = window.innerHeight;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id = 'tour-svg-mask';
  svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:all;';

  let rx=0,ry=0,rw=vw,rh=vh,pad=10,r=12;
  if (targetEl) {
    const rect = targetEl.getBoundingClientRect();
    rx = rect.left - pad; ry = rect.top - pad;
    rw = rect.width + pad*2; rh = rect.height + pad*2;
  }

  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  const mask = document.createElementNS('http://www.w3.org/2000/svg','mask');
  mask.setAttribute('id','tour-cut');
  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('x','0');bg.setAttribute('y','0');bg.setAttribute('width','100%');bg.setAttribute('height','100%');bg.setAttribute('fill','white');
  const hole = document.createElementNS('http://www.w3.org/2000/svg','rect');
  hole.setAttribute('x',String(rx));hole.setAttribute('y',String(ry));
  hole.setAttribute('width',String(rw));hole.setAttribute('height',String(rh));
  hole.setAttribute('rx',String(r));hole.setAttribute('fill','black');
  mask.appendChild(bg); mask.appendChild(hole); defs.appendChild(mask);
  svg.appendChild(defs);

  const dim = document.createElementNS('http://www.w3.org/2000/svg','rect');
  dim.setAttribute('x','0');dim.setAttribute('y','0');dim.setAttribute('width','100%');dim.setAttribute('height','100%');
  dim.setAttribute('fill', targetEl ? 'rgba(5,7,16,0.78)' : 'rgba(5,7,16,0.88)');
  if (targetEl) dim.setAttribute('mask','url(#tour-cut)');
  svg.appendChild(dim);

  svg.addEventListener('click', (e) => {
    if (!targetEl) { tourNext(); return; }
    const cx=e.clientX,cy=e.clientY;
    if (cx>=rx&&cx<=rx+rw&&cy>=ry&&cy<=ry+rh) return;
    tourNext();
  });
  overlay.appendChild(svg);

  // ── Spotlight ring (spinning dashes + glow) ──
  if (targetEl) {
    const ring = document.createElement('div');
    ring.id = 'tour-spotlight-ring';
    ring.style.cssText = `
      position:fixed;
      left:${rx-4}px; top:${ry-4}px;
      width:${rw+8}px; height:${rh+8}px;
      border-radius:${r+4}px;
      pointer-events:none;
      z-index:9002;
    `;
    // Outer glow layer
    ring.innerHTML = `
      <div style="position:absolute;inset:0;border-radius:${r+4}px;
        box-shadow:0 0 0 2px rgba(245,158,11,0.9),
                   0 0 20px 4px rgba(245,158,11,0.45),
                   0 0 50px 8px rgba(245,158,11,0.2),
                   inset 0 0 20px rgba(245,158,11,0.08);
        animation:tourRingPulse 2s ease-in-out infinite;"></div>
      <div style="position:absolute;inset:-3px;border-radius:${r+7}px;
        border:2px dashed rgba(245,158,11,0.5);
        animation:tourRingSpin 8s linear infinite;"></div>
      <div style="position:absolute;inset:-7px;border-radius:${r+11}px;
        border:1px dashed rgba(245,158,11,0.2);
        animation:tourRingSpin 14s linear infinite reverse;"></div>
    `;
    overlay.appendChild(ring);
  }

  // ── Card ──
  const card = document.createElement('div');
  card.id = 'tour-card';

  // Step dot indicators
  const dots = TOUR_STEPS.map((_,i) => `
    <div onclick="tourJumpTo(${i})" style="
      width:${i===tourStep?22:7}px; height:7px;
      border-radius:4px;
      background:${i===tourStep?'#f59e0b':i<tourStep?'rgba(245,158,11,0.35)':'rgba(255,255,255,0.12)'};
      transition:all 0.3s cubic-bezier(.4,0,.2,1);
      cursor:pointer;
      flex-shrink:0;
    "></div>

  if (btn) {
    const on = state.platformPickerSelection.has(pid);
    btn.classList.toggle('pp-card-on', on);
    btn.querySelector('.pp-card-check').textContent = on ? '✓' : '';

  // Update count + continue button
  const count = state.platformPickerSelection.size;
  const countEl = document.querySelector('.pp-count');
  if (countEl) countEl.textContent = count === 0
    ? 'Pick at least one platform to continue'

  if (continueBtn) continueBtn.disabled = count === 0;

// ── The actual reset ──────────────────────────────────────────────────────

async function performFullReset() {
  // Guard: require typed confirmation
  if ((state.resetConfirmInput || '').trim().toUpperCase() !== 'RESET') return;

  const btn = document.getElementById('reset-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Erasing…'; }

  // 1. Clear all PostPilot localStorage keys (prefixed) without touching unrelated keys
  try {
    const keys = Object.keys(localStorage);
    for (const k of keys) {
      if (k.startsWith('postflow_')
       || k.startsWith('postpilot_')
       || k.startsWith('ws_a_')
       || k.startsWith('ws_b_')
       || k.startsWith('ws_c_')
       || k === '_schedsy_imported') {
        localStorage.removeItem(k);
      }
    }
  } catch (e) { console.warn('localStorage clear failed:', e); }

  // 2. Drop the IndexedDB image store
  try {
    if (_imgDb) { try { _imgDb.close(); } catch {} _imgDb = null; }
    await new Promise(resolve => {
      const req = indexedDB.deleteDatabase(IMG_DB_NAME);
      // resolve in all cases — success, error, or blocked — so we always reload
      req.onsuccess = req.onerror = req.onblocked = () => resolve();
      // safety timeout
      setTimeout(resolve, 2000);
    });
  } catch (e) { console.warn('IndexedDB delete failed:', e); }

  // 3. Hard reload — fresh state, picker will appear
  location.reload();
}

var GH_SYNC_TIMER = null; // debounce timer

function GH_CONFIG_KEY() { return wsKey('postpilot_github_sync'); }

function saveGithubConfig() {

// Build payload — strips image blobs (too large), syncs everything else
function buildSyncPayload() {
  const stripImages = (posts) => {
    const out = {};
    Object.keys(posts).forEach(pid => {
      out[pid] = (posts[pid] || []).map(p => {
        const c = { ...p };
        delete c.image; delete c.imageOriginal;
        delete c.imageThumb; delete c.imageId;
        delete c.imageOriginalId; delete c.imageThumbId;
        return c;
      });
    });
    return out;
  };
  const stripDraftImages = (drafts) => {
    const out = {};
    Object.keys(drafts).forEach(pid => {
      out[pid] = (drafts[pid] || []).map(d => {
        const c = { ...d };
        delete c.imageFull; delete c.imageThumb;
        delete c.imageFullId; delete c.imageThumbId;
        return c;
      });
    });
    return out;
  };
  return {
    version: 1,
    lastSaved: new Date().toISOString(),
    posts:       stripImages(state.posts),
    drafts:      stripDraftImages(state.drafts),
    hashtagSets: state.hashtagSets  || [],
    analytics:   state.analytics    || {},
    tags:        state.tags         || [],
    customTags:  state.customTags   || [],
    streaks:     state.streaks      || {},
  };
}

// Restore image refs from local data when merging remote posts
function mergeWithLocalImages(remotePosts, localPosts) {
  return (remotePosts || []).map(rp => {
    const lp = (localPosts || []).find(p => String(p.id) === String(rp.id));
    if (!lp) return rp;
    return {
      ...rp,
      image: lp.image, imageOriginal: lp.imageOriginal,
      imageId: lp.imageId, imageOriginalId: lp.imageOriginalId,
      imageThumb: lp.imageThumb, imageThumbId: lp.imageThumbId,
    };
  });
}

async function syncToGitHub(silent) {
  const { enabled, username, repo, token, branch } = state.githubSync;
  if (!enabled || !username || !repo || !token) return;

  state.githubSync.syncing = true;
  if (!silent) render();

  try {
    const payload    = buildSyncPayload();
    const jsonStr    = JSON.stringify(payload, null, 2);
    const encoded    = btoa(unescape(encodeURIComponent(jsonStr)));
    const apiBase    = `https://api.github.com/repos/${username}/${repo}/contents/postpilot-data.json`;
    const headers    = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };

    // Get current SHA (required for updates)
    let sha = null;
    const getRes = await fetch(`${apiBase}?ref=${branch}`, { headers });
    if (getRes.ok) { const d = await getRes.json(); sha = d.sha; }

    const body = { message: `PostPilot sync ${new Date().toISOString()}`, content: encoded, branch };
    if (sha) body.sha = sha;

    const putRes = await fetch(apiBase, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (!putRes.ok) throw new Error(`GitHub API ${putRes.status}: ${putRes.statusText}`);

    state.githubSync.lastSynced = new Date().toISOString();
    state.githubSync.syncError  = null;
    saveGithubConfig();
    if (!silent) showToast('☁ Synced to GitHub');
  } catch(e) {
    state.githubSync.syncError = e.message;
    console.warn('GitHub sync failed:', e);
    if (!silent) showToast('GitHub sync failed: ' + e.message, 'error');
  } finally {
    state.githubSync.syncing = false;
    render();
  }
}

async function pullFromGitHub() {
  const { enabled, username, repo, token, branch } = state.githubSync;
  if (!enabled || !username || !repo || !token) { showToast('Configure GitHub Sync in Settings first.', 'error'); return; }

  state.githubSync.syncing = true;
  render();

  try {
    const apiBase = `https://api.github.com/repos/${username}/${repo}/contents/postpilot-data.json?ref=${branch}`;
    const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' };
    const res     = await fetch(apiBase, { headers });

    if (res.status === 404) { showToast('No sync file found yet — save something first.', 'error'); return; }
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);

    const file   = await res.json();
    const raw    = decodeURIComponent(escape(atob(file.content.replace(/\n/g, ''))));
    const data   = JSON.parse(raw);

    // Merge posts — preserve local images
    if (data.posts) {
      Object.keys(data.posts).forEach(pid => {
        state.posts[pid] = mergeWithLocalImages(data.posts[pid], state.posts[pid]);
      });
      await savePosts(state.posts);
    }

    // Merge drafts — preserve local images
    if (data.drafts) {
      Object.keys(data.drafts).forEach(pid => {
        const remote = data.drafts[pid] || [];
        const local  = state.drafts[pid] || [];
        state.drafts[pid] = remote.map(rd => {
          const ld = local.find(d => String(d.id) === String(rd.id));
          if (!ld) return rd;
          return { ...rd, imageFull: ld.imageFull, imageThumb: ld.imageThumb, imageFullId: ld.imageFullId, imageThumbId: ld.imageThumbId };
        });
      });
      await saveDrafts(state.drafts);
    }

    if (data.hashtagSets) { state.hashtagSets = data.hashtagSets; saveHashtagSets(); }
    if (data.analytics)   { state.analytics   = data.analytics;   saveAnalytics();   }
    if (data.streaks)     { state.streaks      = { ...state.streaks, ...data.streaks }; saveStreaks(); }

    state.githubSync.lastSynced = new Date().toISOString();
    state.githubSync.syncError  = null;
    saveGithubConfig();
    showToast('☁ Pulled latest data from GitHub!');
    render();
  } catch(e) {
    state.githubSync.syncError = e.message;
    showToast('GitHub pull failed: ' + e.message, 'error');
    console.warn('pullFromGitHub failed:', e);
  } finally {
    state.githubSync.syncing = false;
    render();
  }
}

async function testGithubConnection() {
  const { username, repo, token } = state.githubSync;
  if (!username || !repo || !token) { showToast('Fill in username, repo, and token first.', 'error'); return; }

  try {
    const res = await fetch(`https://api.github.com/repos/${username}/${repo}`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (res.ok) {
      state.githubSync.enabled   = true;
      state.githubSync.syncError = null;
      saveGithubConfig();
      render();
      showToast('✓ Connected to GitHub! Sync is now active.');
    } else if (res.status === 401) { showToast('Invalid token — check your Personal Access Token.', 'error'); }
      else if (res.status === 404) { showToast('Repo not found — check username and repo name.', 'error'); }
      else { showToast(`GitHub error ${res.status}`, 'error'); }
  } catch(e) { showToast('Connection failed — check your internet.', 'error'); }
}

function HS_KEY() { return wsKey('postpilot_hashtag_sets'); }
function loadHashtagSets() {

function saveHashtagSets() {
  try { localStorage.setItem(HS_KEY(), JSON.stringify(state.hashtagSets)); } catch {}
}
function openHashtagSetModal(editId) {
  state.showHashtagSetModal=true; state.hashtagSetEditId=editId||null;
  const ex=editId?state.hashtagSets.find(s=>s.id===editId):null;
  state.hashtagSetDraft=ex?{name:ex.name,tags:ex.tags.join(' ')}:{name:'',tags:''};
  render();
}
function closeHashtagSetModal() { state.showHashtagSetModal=false; state.hashtagSetEditId=null; render(); }
function updateHashtagSetDraft(f,v) { state.hashtagSetDraft[f]=v; }
function saveHashtagSet() {
  const {name,tags}=state.hashtagSetDraft;
  if(!name.trim()){showToast('Please enter a set name.','error');return;}
  const tagList=tags.split(/[\s,]+/).filter(t=>t).map(t=>t.startsWith('#')?t:'#'+t);
  if(!tagList.length){showToast('Please add at least one hashtag.','error');return;}
  if(state.hashtagSetEditId){
    state.hashtagSets=state.hashtagSets.map(s=>s.id===state.hashtagSetEditId?{...s,name:name.trim(),tags:tagList}:s);
  } else {
    state.hashtagSets=[...state.hashtagSets,{id:Date.now().toString(),name:name.trim(),tags:tagList}];
  }
  saveHashtagSets(); state.showHashtagSetModal=false; state.hashtagSetEditId=null; render();
  showToast(state.hashtagSetEditId?'Hashtag set updated!':'Hashtag set saved!');
}
function deleteHashtagSet(id) {
  if(!confirm('Delete this hashtag set?')) return;
  state.hashtagSets=state.hashtagSets.filter(s=>s.id!==id); saveHashtagSets(); render();
  showToast('Hashtag set deleted.');
}
function applyHashtagSet(setId, fieldId) {
  const set=state.hashtagSets.find(s=>s.id===setId); if(!set||!state.form) return;
  const existing=(state.form.hashtags||'').trim();
  const combined=existing?existing+' '+set.tags.join(' '):set.tags.join(' ');
  state.form.hashtags=combined;
  const el=document.getElementById(fieldId); if(el) el.value=combined;
  const chips=document.getElementById(fieldId==='f-hashtags'?'f-hashtag-chips':'f-ig-chips');

  showToast('Applied: '+set.name);

// FEATURE: HOLIDAY CONTENT SUGGESTIONS
// ═══════════════════════════════════════════════════════════════════════════════
async function generateHolidayCaption(label, msg) {
  const platform = state.activePlatform;
  const platformName = (PLATFORMS[platform]||{}).name||platform;
  state.holidaySuggestions = { ...state.holidaySuggestions, [label]: { loading:true, captions:[], platform } };
  render();
  const prompt = `You are a social media copywriter for Legacy Protectors Insurance, a professional, community-focused insurance agency.

Write 3 distinct ${platformName} captions for this holiday/event:
Holiday: ${label}
Context: ${msg}

Rules:
- Warm, professional, community-focused tone
- Vary the approach: 1 informational, 1 emotional/relatable, 1 brand-forward
- Each caption under 220 characters (not counting hashtags)
- 3-5 relevant hashtags per caption
- Return ONLY a JSON array — no markdown, no explanation:
[{"caption":"...","hashtags":"#tag1 #tag2 #tag3"},{"caption":"...","hashtags":"..."},{"caption":"...","hashtags":"..."}]`;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01'},
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:900,
        messages:[{role:'user',content:prompt}] })
    });
    const data = await res.json();
    const text = (data.content?.find(b=>b.type==='text')?.text||'[]').replace(/```json|```/g,'').trim();
    const captions = JSON.parse(text);
    state.holidaySuggestions = { ...state.holidaySuggestions, [label]: { loading:false, captions, platform } };
  } catch(e) {
    state.holidaySuggestions = { ...state.holidaySuggestions, [label]: { loading:false, captions:[], platform, error:true } };
  }
  render();
}
function dismissHolidaySuggestion(label) {
  const s={...state.holidaySuggestions}; delete s[label]; state.holidaySuggestions=s; render();
}
function useHolidayCaption(labelEncoded, captionIdx) {
  const label = decodeURIComponent(labelEncoded);
  const suggestion = state.holidaySuggestions[label]; if(!suggestion) return;
  const cap = suggestion.captions[captionIdx]; if(!cap) return;
  const platform = suggestion.platform||state.activePlatform;
  switchPlatform(platform); openComposer();
  setTimeout(()=>{
    if(!state.form) return;
    const text=cap.caption||'', tags=cap.hashtags||'';
    if(platform==='pinterest') state.form.description=text;
    else if(platform==='linkedin') state.form.liText=text;
    else { state.form.caption=text; state.form.content=text; }
    state.form.hashtags=tags;
    const s={...state.holidaySuggestions}; delete s[label]; state.holidaySuggestions=s;
    render(); showToast('Caption loaded into composer!');
  },120);
}

// FEATURE: ANALYTICS LAYER
// ═══════════════════════════════════════════════════════════════════════════════
function AN_KEY() { return wsKey('postpilot_analytics'); }
function loadAnalytics() {
  try { const r=localStorage.getItem(AN_KEY()); if(r) state.analytics=JSON.parse(r); } catch {}
}
function saveAnalytics() {
  try { localStorage.setItem(AN_KEY(), JSON.stringify(state.analytics)); } catch {}
}
function recordEngagement(postId, platformId, field, val) {
  const key=`${postId}_${platformId}`;
  state.analytics[key]={...state.analytics[key],[field]:parseInt(val)||0,recordedAt:new Date().toISOString()};
  saveAnalytics();
}
function getEngagement(postId, platformId) {
  return state.analytics[`${postId}_${platformId}`]||{};
}
function renderAnalyticsView() {
  const days=parseInt(state.analyticsDateRange)||30;
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  const cutoffStr=cutoff.toISOString().split('T')[0];
  const allPosts=[];
  Object.entries(state.posts).forEach(([pid,posts])=>{
    (posts||[]).forEach(post=>{
      if(post.publishStatus==='published'&&post.scheduledDate>=cutoffStr){
        const eng=getEngagement(post.id,pid);
        const total=(eng.likes||0)+(eng.comments||0)+(eng.shares||0)+(eng.impressions||0);
        allPosts.push({post,pid,eng,total,platform:PLATFORMS[pid]});
      }
    });
  });
  const withData=allPosts.filter(p=>p.total>0);
  const avgEng=withData.length?Math.round(withData.reduce((s,p)=>s+p.total,0)/withData.length):0;
  const DAY_LABELS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const byDay=Array(7).fill(null).map(()=>({count:0,eng:0}));
  allPosts.forEach(({post,total})=>{ const d=new Date(post.scheduledDate+'T00:00:00').getDay(); byDay[d].count++; byDay[d].eng+=total; });
  const maxByDay=Math.max(...byDay.map(d=>d.eng),1);
  const byPlatform={};
  allPosts.forEach(({pid,total})=>{ if(!byPlatform[pid]) byPlatform[pid]={count:0,totalEng:0}; byPlatform[pid].count++; byPlatform[pid].totalEng+=total; });
  const platEntries=Object.entries(byPlatform).sort((a,b)=>b[1].totalEng-a[1].totalEng);
  const maxPlatEng=Math.max(...platEntries.map(([,v])=>v.totalEng),1);
  const bestDayIdx=byDay.reduce((best,d,i)=>d.eng>byDay[best].eng?i:best,0);

  const barW=38,barGap=8,chartH=90,padB=22;
  const dayBars=byDay.map((d,i)=>{
    const h=d.eng?Math.max(4,Math.round((d.eng/maxByDay)*chartH)):2;
    const x=i*(barW+barGap), y=chartH-h, isTop=i===bestDayIdx&&d.eng>0;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="${isTop?'#6366f1':'#2d3a6e'}" opacity="${isTop?1:0.7}"/>
    <text x="${x+barW/2}" y="${chartH+14}" text-anchor="middle" font-size="10" fill="${isTop?'#a5b4fc':'#6b7280'}" font-family="DM Sans,sans-serif" font-weight="${isTop?700:400}">${DAY_LABELS[i]}</text>
    ${d.eng>0?`<text x="${x+barW/2}" y="${y-4}" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="DM Sans,sans-serif">${d.eng}</text>`:''}`;
  }).join('');
  const chartW=7*(barW+barGap);

  // Published posts for engagement input
  const publishedPosts=[];
  Object.entries(state.posts).forEach(([pid,posts])=>{
    (posts||[]).filter(p=>p.publishStatus==='published').forEach(p=>publishedPosts.push({p,pid}));
  });
  publishedPosts.sort((a,b)=>b.p.scheduledDate>a.p.scheduledDate?1:-1);

  return `<div class="analytics-view">
    <div class="analytics-header">
      <h2 style="font-size:17px;font-weight:700;color:var(--text-primary);margin:0">📊 Analytics</h2>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:11.5px;color:var(--text-muted)">Last</span>
        ${['7','30','90'].map(d=>`<button onclick="state.analyticsDateRange='${d}';render()"
          style="padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;
          border:1px solid ${state.analyticsDateRange===d?'#6366f1':'var(--border)'};
          background:${state.analyticsDateRange===d?'rgba(99,102,241,0.15)':'var(--bg-elevated)'};
          color:${state.analyticsDateRange===d?'#a5b4fc':'var(--text-muted)'}">${d}d</button>`).join('')}
      </div>
    </div>

    <div class="analytics-summary-row">
      ${[
        ['Published Posts', allPosts.length, `in last ${days} days`],
        ['Avg Engagement', avgEng||'—', `${withData.length} posts tracked`],
        ['Best Platform', platEntries[0]?PLATFORMS[platEntries[0][0]]?.name||'—':'—', platEntries[0]?platEntries[0][1].totalEng+' total engagement':'no data yet'],
        ['Best Day', byDay.some(d=>d.eng>0)?DAY_LABELS[bestDayIdx]:'—', byDay.some(d=>d.eng>0)?'highest total engagement':'no data yet'],
      ].map(([label,val,sub])=>`
      <div class="analytics-stat-card">
        <div class="analytics-stat-label">${label}</div>
        <div class="analytics-stat-value">${val}</div>
        <div class="analytics-stat-sub">${sub}</div>
      </div>`).join('')}
    </div>

    <div class="analytics-charts-row">
      <div class="analytics-chart-card">
        <div class="analytics-chart-title">Engagement by Day of Week</div>
        ${allPosts.some(p=>p.total>0)
          ? `<svg viewBox="0 0 ${chartW} ${chartH+padB}" style="width:100%;max-height:150px;overflow:visible">${dayBars}</svg>`
          : `<div class="analytics-empty">Track engagement on published posts to see day-of-week patterns.</div>`}
      </div>
      <div class="analytics-chart-card">
        <div class="analytics-chart-title">Engagement by Platform</div>
        ${platEntries.length
          ? platEntries.map(([pid,data])=>{const p=PLATFORMS[pid];if(!p)return'';const pct=Math.round((data.totalEng/maxPlatEng)*100);return`
          <div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="font-size:11.5px;font-weight:600;color:var(--text-primary)">${p.name}</span>
              <span style="font-size:11px;color:var(--text-muted)">${data.count} posts · ${data.totalEng} eng</span>
            </div>
            <div style="height:6px;border-radius:3px;background:var(--bg-elevated)">
              <div style="height:100%;width:${pct}%;border-radius:3px;background:${p.color}"></div>
            </div>
          </div>`;}).join('')
          : `<div class="analytics-empty">Publish posts to see platform breakdown.</div>`}
      </div>
    </div>

    <div class="analytics-chart-card" style="margin-top:0">
      <div class="analytics-chart-title">🏆 Top Posts by Engagement</div>
      ${allPosts.filter(p=>p.total>0).sort((a,b)=>b.total-a.total).slice(0,5).length
        ? `<table class="analytics-table"><thead><tr>
            <th>Post</th><th>Platform</th><th>Date</th>
            <th title="Likes">👍</th><th title="Comments">💬</th><th title="Shares">🔁</th><th title="Impressions">👁</th><th>Total</th>
           </tr></thead><tbody>
           ${allPosts.filter(p=>p.total>0).sort((a,b)=>b.total-a.total).slice(0,5).map(({post,pid,eng,total,platform:plat})=>`
           <tr>
             <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(getPostSummary(post))}">${escapeHtml((getPostSummary(post)||'').substring(0,38))||'(no caption)'}</td>
             <td><span style="color:${plat?.color||'#fff'};font-weight:600;font-size:11px">${plat?.name||pid}</span></td>
             <td style="color:var(--text-muted);font-size:11px;white-space:nowrap">${post.scheduledDate}</td>
             <td>${eng.likes||'—'}</td><td>${eng.comments||'—'}</td><td>${eng.shares||'—'}</td><td>${eng.impressions||'—'}</td>
             <td style="font-weight:700;color:#a5b4fc">${total}</td>
           </tr>`).join('')}
           </tbody></table>`
        : `<div class="analytics-empty">Add engagement data below to see top performers here.</div>`}
    </div>

    <div class="analytics-chart-card" style="margin-top:0">
      <div class="analytics-chart-title" style="margin-bottom:8px">📝 Track Engagement on Published Posts</div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:14px">Copy numbers from your native platform analytics — takes 30 seconds per post and powers all charts above.</div>
      ${!publishedPosts.length
        ? `<div class="analytics-empty">No published posts yet. Publish or manually mark posts to start tracking.</div>`
        : publishedPosts.slice(0,10).map(({p,pid})=>{
            const plat=PLATFORMS[pid], eng=getEngagement(p.id,pid);
            return `<div class="analytics-eng-row">
              <div class="analytics-eng-info">
                ${p.image?`<img src="${escapeHtml(p.image)}" style="width:36px;height:36px;border-radius:4px;object-fit:cover;flex-shrink:0"/>`:`<div style="width:36px;height:36px;border-radius:4px;background:${plat?.color||'#444'}22;display:flex;align-items:center;justify-content:center;flex-shrink:0">${plat?.icon?.replace('width="20"','width="14"').replace('height="20"','height="14"')||''}</div>`}
                <div style="min-width:0">
                  <div style="font-size:12px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml((getPostSummary(p)||'').substring(0,42))||'(no caption)'}</div>
                  <div style="font-size:10.5px;color:var(--text-muted)">${plat?.name||pid} · ${p.scheduledDate}</div>
                </div>
              </div>
              <div class="analytics-eng-inputs">
                ${[['likes','👍'],['comments','💬'],['shares','🔁'],['impressions','👁']].map(([f,icon])=>`
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
                  <span style="font-size:12px">${icon}</span>
                  <input type="number" min="0" placeholder="0" value="${eng[f]||''}"
                    oninput="recordEngagement('${p.id}','${pid}','${f}',this.value)"
                    style="width:54px;padding:4px 5px;text-align:center;border-radius:5px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:12px"/>
                </div>`).join('')}
              </div>
            </div>`;
          }).join('')}
    </div>
  </div>`;
}

</script>

  <!-- ── Floating action button (new post) ─────────────────────── -->
  <button class="fab-new-post" id="fab-new-post"
          onclick="if(state.activeView!=='scheduled')switchView('scheduled');openComposer()"
          title="New Post (Ctrl+N)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.8">
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </svg>
    New Post
    <span class="fab-shortcut">Ctrl+N</span>
  </button>

</body>
</html>
