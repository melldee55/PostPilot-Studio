  margin: 14px 0 6px;
}
.rc-input-label code {
  background: var(--bg-elevated);
  padding: 1px 6px;
  border-radius: 4px;
  font-family: monospace;
  color: #fc7e7e;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.rc-input {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: monospace;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.1em;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.rc-input:focus {
  outline: none;
  border-color: #fc7e7e;
  box-shadow: 0 0 0 3px rgba(220,38,38,0.15);
}
.rc-hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  font-style: italic;
}
.rc-footer {
  padding: 14px 24px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
.rc-cancel {
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-light);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.rc-cancel:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}
.rc-erase {
  padding: 9px 20px;
  border-radius: var(--radius-sm);
  border: none;
  background: linear-gradient(135deg, #dc2626, #b91c1c);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 2px 8px rgba(220,38,38,0.3);
}
.rc-erase:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(220,38,38,0.45);
}
.rc-erase:active:not(:disabled) { transform: translateY(0); }
.rc-erase:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  background: var(--bg-elevated);
  color: var(--text-muted);
  box-shadow: none;
}

/* ── First-Run Platform Picker ──────────────────────────────────────────── */
.pp-overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at top, rgba(245,158,11,0.04), transparent 60%), rgba(8,10,16,0.94);
  backdrop-filter: blur(6px);
  z-index: 100001;  /* above everything else, including reset confirm */
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-y: auto;
  animation: ppFadeIn 0.25s ease;
}
@keyframes ppFadeIn { from { opacity: 0; } to { opacity: 1; } }

.pp-modal {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  width: 720px;
  max-width: 100%;
  box-shadow: 0 24px 72px rgba(0,0,0,0.6);
  animation: ppModalIn 0.32s cubic-bezier(.2,.9,.3,1.1);
  display: flex;
  flex-direction: column;
}
@keyframes ppModalIn {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

.pp-header {
  padding: 26px 28px 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(245,158,11,0.05) 0%, transparent 100%);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.pp-eyebrow {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #f59e0b;
  margin-bottom: 4px;
}
.pp-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.3px;
  margin-bottom: 8px;
}
.pp-sub {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
}

.pp-grid {
  padding: 20px 24px 8px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}

.pp-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 10px 14px;
  background: var(--bg-elevated);
  border: 1.5px solid var(--border-light);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.16s;
  text-align: center;
}
.pp-card:hover {
  border-color: var(--pp-color, var(--text-secondary));
  background: var(--bg-hover);
  transform: translateY(-2px);
}
.pp-card-on {
  background: color-mix(in srgb, var(--pp-color) 14%, var(--bg-elevated));
  border-color: var(--pp-color);
  color: var(--text-primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--pp-color) 18%, transparent);
}
.pp-card-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
}
.pp-card-icon svg { width: 26px; height: 26px; }
.pp-card-name { line-height: 1.2; }
.pp-card-check {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--pp-color);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.6);
  transition: all 0.18s cubic-bezier(.2,.9,.3,1.4);
}
.pp-card-on .pp-card-check { opacity: 1; transform: scale(1); }

.pp-helpers {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 10px 24px 4px;
}
.pp-helper-btn {
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-light);
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.14s;
}
.pp-helper-btn:hover {
  border-color: #f59e0b;
  color: #f59e0b;
  background: rgba(245,158,11,0.06);
}

.pp-footer {
  padding: 18px 24px 22px;
  border-top: 1px solid var(--border);
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.pp-count {
  font-size: 12.5px;
  color: var(--text-secondary);
  font-weight: 600;

  <script>
/* ============================================================
   PostPilot — Application Logic
   Extracted from postpilot_v35_heavy.html
   ============================================================ */

// ─── ONE-TIME MIGRATION: legacy users → mark initialized ──────────────────
// Users who already have data but no `postpilot_initialized` flag are
// existing users from before the platform picker was added. Mark them
// initialized so they don't see the first-run picker on next load.
try {
  if (!localStorage.getItem('postpilot_initialized')) {
    const hasLegacyData =
         localStorage.getItem('postflow_scheduler_posts')
      || localStorage.getItem('postflow_drafts')
      || localStorage.getItem('postflow_api_keys')
      || localStorage.getItem(wsKey('postpilot_hidden_platforms'));
    if (hasLegacyData) localStorage.setItem('postpilot_initialized', '1');
  }
} catch {}

// ─── WORKSPACE / BRAND MANAGEMENT ────────────────────────────────────────────
// Supports 2 independent workspaces (brands). All localStorage keys are
// prefixed with the active workspace ID so data stays fully separated.
// Workspace IDs: 'ws_a', 'ws_b', and 'ws_c'

const WS_IDS        = ['ws_a', 'ws_b', 'ws_c'];
const WS_ACTIVE_KEY = 'postpilot_active_workspace';
const WS_NAMES_KEY  = 'postpilot_workspace_names';

// Get the currently active workspace ID ('ws_a' | 'ws_b')
function getActiveWorkspace() {
  try {
    const v = localStorage.getItem(WS_ACTIVE_KEY);
    return WS_IDS.includes(v) ? v : 'ws_a';
  } catch { return 'ws_a'; }
}

// Prefix a storage key with the active workspace
function wsKey(rawKey) {
  return getActiveWorkspace() + '_' + rawKey;
}

// Read all workspace names; returns {ws_a: 'Brand A', ws_b: 'Brand B', ws_c: 'Brand C'}
function getWorkspaceNames() {
  try {
    const raw = localStorage.getItem(WS_NAMES_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return {
      ws_a: parsed.ws_a || 'Brand A',
      ws_b: parsed.ws_b || 'Brand B',
      ws_c: parsed.ws_c || 'Brand C',
    };
  } catch { return { ws_a: 'Brand A', ws_b: 'Brand B', ws_c: 'Brand C' }; }
}

function setWorkspaceName(wsId, name) {
  try {
    const names = getWorkspaceNames();
    const defaults = { ws_a: 'Brand A', ws_b: 'Brand B', ws_c: 'Brand C' };
    names[wsId] = (name || '').trim() || (defaults[wsId] || 'Brand');
    localStorage.setItem(WS_NAMES_KEY, JSON.stringify(names));
  } catch {}
}

// Switch active workspace and reload all state
async function switchWorkspace(wsId) {
  if (!WS_IDS.includes(wsId)) return;
  if (wsId === getActiveWorkspace()) return;

  // Save current unsaved state first
  await autoSave();

  try { localStorage.setItem(WS_ACTIVE_KEY, wsId); } catch {}

  // Re-load all state from the new workspace's keys
  state.posts  = await loadPosts();
  state.drafts = await loadDraftsAsync();
  loadStreaks();
  Object.keys(state.streaks).forEach(pid => checkMissedDay(pid));
  state.apiKeys = loadApiKeys();
  state.notifiedPostIds = loadNotifiedIds();
  loadNotificationSound();
  loadChimeSound();

  // Re-initialize platform visibility/order from the workspace
  state.platformOrder   = (() => {
    try { const s = localStorage.getItem(wsKey('postpilot_platform_order')); return s ? JSON.parse(s) : ['pinterest','google','linkedin','instagram','shopify','bluesky','tiktok','youtube','twitter','kofi','facebook','tumblr','patreon']; }
    catch { return ['pinterest','google','linkedin','instagram','shopify','bluesky','tiktok','youtube','twitter','kofi','facebook','tumblr','patreon']; }
  })();
  state.hiddenPlatforms = (() => {
    try { const s = localStorage.getItem(wsKey('postpilot_hidden_platforms')); return s ? new Set(JSON.parse(s)) : new Set(['twitter','kofi','facebook','tumblr','patreon']); }
    catch { return new Set(['twitter','kofi','facebook','tumblr','patreon']); }
  })();

  // Reset transient UI state
  state.showComposer         = false;
  state.editingPostId        = null;
  state.form                 = null;
  state.deleteConfirmId      = null;
  state.showQueuePanel       = false;
  state.showSettings         = false;
  state.showIncomingModal    = false;
  state.bulkMode             = false;
  state.bulkSelected         = new Set();
  state.liveNotifications    = [];
  state.activeTagFilter      = [];
  state.tagSearchMode        = false;

  const names = getWorkspaceNames();
  showBrandSwitchPopup(wsId);
  render();
}

// Expose
window.switchWorkspace = switchWorkspace;

function saveWorkspaceName(wsId) {
  const input = document.getElementById('ws-name-' + wsId);
  if (!input) return;
  const name = (input.value || '').trim();
  if (!name) { showToast('Brand name cannot be empty.', 'error'); return; }
  setWorkspaceName(wsId, name);
  showToast('Brand name saved: ' + name);
  render();       // refresh sidebar labels
  closeSettings();
  openSettings();  // re-open settings so labels update
}
window.saveWorkspaceName = saveWorkspaceName;

// ─── BRAND LOGO HELPERS ───────────────────────────────────────────────────────
function getWsLogoKey(wsId) { return wsId + '_postpilot_brand_logo'; }

function getWorkspaceLogo(wsId) {
  try {
    const val = localStorage.getItem(getWsLogoKey(wsId));
    if (val === 'NONE') return '';          // user explicitly cleared it
    if (val)            return val;          // workspace-specific logo
    return localStorage.getItem('bpc_logo') || '';  // fallback to Post Creator logo
  } catch { return ''; }
}

function saveWorkspaceLogo(wsId) {
  const input = document.getElementById('ws-logo-input-' + wsId);
  if (!input || !input.files || !input.files[0]) return;
  const file = input.files[0];
  if (!file.type.startsWith('image/')) { showToast('Please select an image file.', 'error'); return; }
  if (file.size > 200 * 1024) { showToast('Logo must be under 200 KB.', 'error'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      localStorage.setItem(getWsLogoKey(wsId), e.target.result);
      showToast('Brand logo saved!');
      render();
    } catch { showToast('Logo too large to save.', 'error'); }
  };
  reader.readAsDataURL(file);
}

function removeWorkspaceLogo(wsId) {
  try {
    // Store sentinel 'NONE' so getWorkspaceLogo knows the user explicitly removed it
    // and won't fall back to the Post Creator's bpc_logo key
    localStorage.setItem(getWsLogoKey(wsId), 'NONE');
  } catch {}
  showToast('Logo removed.');
  render();
}

// Show brand-switch popup overlay
function showBrandSwitchPopup(wsId) {
  const names = getWorkspaceNames();
  const name  = names[wsId] || wsId;
  const logo  = getWorkspaceLogo(wsId);
  const emojis = { ws_a: '🏢', ws_b: '🏬', ws_c: '🏪' };
  const emoji = emojis[wsId] || '🏷️';

  // Remove any existing popup
  const existing = document.getElementById('brand-switch-popup');
  if (existing) existing.remove();

  const popup = document.createElement('div');
  popup.id = 'brand-switch-popup';
  popup.style.cssText = `
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.85);
    z-index:9999;background:var(--bg-card,#1e293b);border:1px solid rgba(99,102,241,0.5);
    border-radius:16px;padding:28px 36px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.6);
    opacity:0;transition:opacity 0.2s ease,transform 0.2s ease;min-width:200px;
  `;
  popup.innerHTML = `
    <div style="font-size:13px;color:var(--text-muted,#64748b);margin-bottom:10px;letter-spacing:0.05em;text-transform:uppercase">Switched to</div>
    <div style="margin-bottom:10px">
      ${logo
        ? `<img src="${logo}" style="width:112px;height:112px;object-fit:cover;border-radius:50%;border:2px solid rgba(99,102,241,0.5)" />`
        : `<div style="width:112px;height:112px;border-radius:50%;background:rgba(99,102,241,0.2);border:2px solid rgba(99,102,241,0.4);display:flex;align-items:center;justify-content:center;font-size:56px;margin:0 auto">${emoji}</div>`
      }
    </div>
    <div style="font-size:20px;font-weight:700;color:#fff">${escapeHtml(name)}</div>
  `;
  document.body.appendChild(popup);

  // Animate in
  requestAnimationFrame(() => {
    popup.style.opacity = '1';
    popup.style.transform = 'translate(-50%,-50%) scale(1)';
  });

  // Auto-dismiss
  setTimeout(() => {
    popup.style.opacity = '0';
    popup.style.transform = 'translate(-50%,-50%) scale(0.85)';
    setTimeout(() => { if (popup.parentNode) popup.parentNode.removeChild(popup); }, 220);
  }, 1800);
}

window.saveWorkspaceLogo   = saveWorkspaceLogo;

// ─── IMAGE STORE (IndexedDB) ─────────────────────────────────────────────────
// Images are stored in IndexedDB (no size limit) rather than localStorage.
// localStorage only holds lightweight metadata (imageId string refs).
// This prevents "QuotaExceededError" even with dozens of high-res images.

const IMG_DB_NAME  = 'postpilot_images';
const IMG_DB_VER   = 1;
const IMG_STORE    = 'images';
let _imgDb = null;

function openImageDb() {
  if (_imgDb) return Promise.resolve(_imgDb);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IMG_DB_NAME, IMG_DB_VER);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(IMG_STORE, { keyPath: 'id' });
    };
    req.onsuccess = e => { _imgDb = e.target.result; resolve(_imgDb); };
    req.onerror   = e => reject(e.target.error);
  });
}

// Store a dataUrl → returns a unique id string
async function imgStore(dataUrl) {
  if (!dataUrl) return null;
  const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  const db = await openImageDb();
  await new Promise((res, rej) => {
    const tx  = db.transaction(IMG_STORE, 'readwrite');
    const req = tx.objectStore(IMG_STORE).put({ id, dataUrl });
    req.onsuccess = res; req.onerror = rej;
  });
  return id;
}

// Retrieve a dataUrl by id
async function imgLoad(id) {
  if (!id) return null;
  // Fast path: if id is itself a dataUrl (legacy data), return as-is
  if (id.startsWith('data:')) return id;
  try {
    const db = await openImageDb();
    return await new Promise((res, rej) => {
      const tx  = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).get(id);
      req.onsuccess = e => res(e.target.result ? e.target.result.dataUrl : null);
      req.onerror   = rej;
    });
  } catch { return null; }
}

// Delete an image by id
async function imgDelete(id) {
  if (!id || id.startsWith('data:')) return;
  try {
    const db = await openImageDb();
    await new Promise((res, rej) => {
      const tx  = db.transaction(IMG_STORE, 'readwrite');
      const req = tx.objectStore(IMG_STORE).delete(id);
      req.onsuccess = res; req.onerror = rej;
    });
  } catch {}
}

// GC: delete any imgIds not referenced by posts or drafts
async function imgGarbageCollect() {
  try {
    const db = await openImageDb();
    const allIds = await new Promise((res, rej) => {
      const tx  = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).getAllKeys();
      req.onsuccess = e => res(e.target.result);
      req.onerror   = rej;
    });
    const usedIds = new Set();
    Object.values(state.posts || {}).forEach(arr => arr.forEach(p => {
      if (p.imageId)         usedIds.add(p.imageId);
      if (p.imageOriginalId) usedIds.add(p.imageOriginalId);
    }));
    Object.values(state.drafts || {}).forEach(arr => arr.forEach(d => {
      if (d.imageFullId)  usedIds.add(d.imageFullId);
      if (d.imageThumbId) usedIds.add(d.imageThumbId);
    }));
    for (const id of allIds) {
      if (!usedIds.has(id)) imgDelete(id);
    }
  } catch {}
}

// Strip dataUrl blobs from a post object — replace with placeholder so
// the post metadata is safe to store in localStorage
function stripPostImages(post) {
  const p = { ...post };
  // imageId / imageOriginalId are the persistent references
  // Remove any raw dataUrl blobs — they live in IndexedDB only
  delete p.image;
  delete p.imageOriginal;
  delete p._imageDims; // recalculated on load
  return p;
}

// Rehydrate a post: load its images from IndexedDB back into the object
async function rehydratePost(post) {
  const p = { ...post };
  if (p.imageId) {
    p.image = await imgLoad(p.imageId);
  }
  if (p.imageOriginalId) {
    p.imageOriginal = await imgLoad(p.imageOriginalId);
  }
  // Populate dims from original if present
  if (p.imageOriginal || p.image) {
    p._imageDims = await getImageSizeLabel(p.imageOriginal || p.image);
  }
  return p;
}

// Save a post's images to IndexedDB, update ids, return stripped post
async function persistPostImages(post) {
  const p = { ...post };
  const src = p.imageOriginal || p.image;
  if (src && src.startsWith('data:')) {
    // Store original
    if (!p.imageOriginalId) p.imageOriginalId = await imgStore(src);
    else {
      // Overwrite existing slot
      const db = await openImageDb();
      await new Promise((res, rej) => {
        const tx = db.transaction(IMG_STORE, 'readwrite');
        const req = tx.objectStore(IMG_STORE).put({ id: p.imageOriginalId, dataUrl: src });
        req.onsuccess = res; req.onerror = rej;
      });
    }
    // Display image = original (we do platform-optimise only at publish time)
    if (!p.imageId) p.imageId = p.imageOriginalId;
    else if (p.imageId !== p.imageOriginalId) {
      const db = await openImageDb();
      await new Promise((res, rej) => {
        const tx = db.transaction(IMG_STORE, 'readwrite');
        const req = tx.objectStore(IMG_STORE).put({ id: p.imageId, dataUrl: src });
        req.onsuccess = res; req.onerror = rej;
      });
    }
  } else if (!src) {
    p.imageOriginalId = null;
    p.imageId = null;
  }
  return stripPostImages(p);
}

// Save a draft's images, return stripped draft
async function persistDraftImages(draft) {
  const d = { ...draft };
  const full  = d.imageFull;
  const thumb = d.imageThumb;
  if (full && full.startsWith('data:')) {
    if (!d.imageFullId) d.imageFullId = await imgStore(full);
    else {
      const db = await openImageDb();
      await new Promise((res, rej) => {
        const tx = db.transaction(IMG_STORE, 'readwrite');
        const req = tx.objectStore(IMG_STORE).put({ id: d.imageFullId, dataUrl: full });
        req.onsuccess = res; req.onerror = rej;
      });
    }
  }
  if (thumb && thumb.startsWith('data:')) {
    if (!d.imageThumbId) d.imageThumbId = await imgStore(thumb);
    else {
      const db = await openImageDb();
      await new Promise((res, rej) => {
        const tx = db.transaction(IMG_STORE, 'readwrite');
        const req = tx.objectStore(IMG_STORE).put({ id: d.imageThumbId, dataUrl: thumb });
        req.onsuccess = res; req.onerror = rej;
      });
    }
  }
  // Also handle formSnapshot images
  if (d.formSnapshot && (d.formSnapshot.image || d.formSnapshot.imageOriginal)) {
    d.formSnapshot = { ...d.formSnapshot };
    delete d.formSnapshot.image;
    delete d.formSnapshot.imageOriginal;
    delete d.formSnapshot._imageDims;
  }
  const stripped = { ...d };
  delete stripped.imageFull;
  delete stripped.imageThumb;
  return stripped;
}

// Rehydrate a draft from IndexedDB
async function rehydrateDraft(draft) {
  const d = { ...draft };
  if (d.imageFullId)  d.imageFull  = await imgLoad(d.imageFullId);
  if (d.imageThumbId) d.imageThumb = await imgLoad(d.imageThumbId);
  // Restore formSnapshot images if they reference the same ids
  if (d.formSnapshot) {
    d.formSnapshot = { ...d.formSnapshot, image: d.imageFull, imageOriginal: d.imageFull };
  }
  return d;
}

const DEFAULT_POST_TAGS = [

function CUSTOM_TAGS_KEY() { return wsKey('postflow_custom_tags'); }

  } catch { return [...DEFAULT_POST_TAGS]; }
})();

}

function savePlatformOrder() {

}
function saveHiddenPlatforms() {

}

// ─── PLATFORM ARCHIVE (soft-removal) ─────────────────────────────────────────
// When a user removes a platform from the sidebar, its posts & drafts are
// "archived" rather than deleted. They persist here until the user either
// restores the platform or explicitly purges the archive via Settings.

function ARCHIVED_POSTS_KEY()  { return wsKey('postpilot_archived_posts');  }
function ARCHIVED_DRAFTS_KEY() { return wsKey('postpilot_archived_drafts'); }

function loadArchivedPlatformData() {
  try {
    const rawP = localStorage.getItem(ARCHIVED_POSTS_KEY());
    const rawD = localStorage.getItem(ARCHIVED_DRAFTS_KEY());
    return {
      posts:  rawP ? JSON.parse(rawP) : {},
      drafts: rawD ? JSON.parse(rawD) : {},
    };
  } catch { return { posts: {}, drafts: {} }; }
}

function saveArchivedPlatformData(archivedPosts, archivedDrafts) {
  try { localStorage.setItem(ARCHIVED_POSTS_KEY(),  JSON.stringify(archivedPosts));  } catch {}
  try { localStorage.setItem(ARCHIVED_DRAFTS_KEY(), JSON.stringify(archivedDrafts)); } catch {}
}

function removePlatformFromSidebar(pid) {
  const platName = (PLATFORMS[pid] && PLATFORMS[pid].name) || pid;
  if (!confirm(
    `Remove "${platName}" from your sidebar?\n\n` +
    `Your posts and drafts will be safely archived — nothing is deleted.\n` +
    `You can restore them (or permanently remove them) from ⚙️ Settings.`
  )) return;

  // Archive current posts & drafts for this platform
  const arch = loadArchivedPlatformData();
  arch.posts[pid]  = [...(arch.posts[pid]  || []), ...(state.posts[pid]  || [])];
  arch.drafts[pid] = [...(arch.drafts[pid] || []), ...(state.drafts[pid] || [])];
  saveArchivedPlatformData(arch.posts, arch.drafts);

  // Clear live data for this platform
  state.posts[pid]  = [];
  state.drafts[pid] = [];
  savePosts(state.posts);
  saveDrafts(state.drafts);

  // Hide the platform in the sidebar
  state.hiddenPlatforms.add(pid);
  saveHiddenPlatforms();

  // If the removed platform was active, switch to the first visible one
  if (state.activePlatform === pid) {
    const visible = getVisiblePlatforms();
    if (visible.length > 0) state.activePlatform = visible[0].id;
  }

  showToast(`${platName} removed. Posts & drafts archived safely.`);
  render();
}

// Restore a previously-removed platform: move archived data back to live state
function restoreArchivedPlatform(pid) {
  const platName = (PLATFORMS[pid] && PLATFORMS[pid].name) || pid;
  const arch = loadArchivedPlatformData();
  const archivedPosts  = arch.posts[pid]  || [];
  const archivedDrafts = arch.drafts[pid] || [];

  if (!archivedPosts.length && !archivedDrafts.length) {
    showToast(`No archived data found for ${platName}.`);
  } else {
    // Merge back into live state (avoid duplicates by id)
    const existingPostIds  = new Set((state.posts[pid]  || []).map(p => String(p.id)));
    const existingDraftIds = new Set((state.drafts[pid] || []).map(d => String(d.id)));
    const newPosts  = archivedPosts.filter(p => !existingPostIds.has(String(p.id)));
    const newDrafts = archivedDrafts.filter(d => !existingDraftIds.has(String(d.id)));
    state.posts[pid]  = [...(state.posts[pid]  || []), ...newPosts];
    state.drafts[pid] = [...(state.drafts[pid] || []), ...newDrafts];
    savePosts(state.posts);
    saveDrafts(state.drafts);

    // Clear the archive for this platform
    arch.posts[pid]  = [];
    arch.drafts[pid] = [];
    saveArchivedPlatformData(arch.posts, arch.drafts);

    showToast(`${platName} restored — ${newPosts.length} post(s) and ${newDrafts.length} draft(s) recovered.`);
  }

  // Make the platform visible again
  state.hiddenPlatforms.delete(pid);
  saveHiddenPlatforms();
  render();
}

// Permanently purge archived data for a platform (cannot be undone)
function purgeArchivedPlatform(pid) {
  const platName = (PLATFORMS[pid] && PLATFORMS[pid].name) || pid;
  const arch = loadArchivedPlatformData();
  const count = (arch.posts[pid] || []).length + (arch.drafts[pid] || []).length;
  if (!count) { showToast(`No archive to purge for ${platName}.`); return; }
  if (!confirm(
    `Permanently delete ALL archived data for "${platName}"?\n\n` +
    `${count} item(s) will be removed forever. This cannot be undone.`
  )) return;
  arch.posts[pid]  = [];
  arch.drafts[pid] = [];
  saveArchivedPlatformData(arch.posts, arch.drafts);
  showToast(`Archived data for ${platName} permanently deleted.`);
  render();
}

window.removePlatformFromSidebar = removePlatformFromSidebar;
window.restoreArchivedPlatform   = restoreArchivedPlatform;
window.purgeArchivedPlatform     = purgeArchivedPlatform;
function getOrderedPlatforms() {
  return state.platformOrder
    .filter(id => PLATFORMS[id])
    .map(id => PLATFORMS[id]);
}
function getVisiblePlatforms() {
  return getOrderedPlatforms().filter(p => !state.hiddenPlatforms.has(p.id));
}
function togglePlatformVisibility(pid) {
  if (state.hiddenPlatforms.has(pid)) {
    state.hiddenPlatforms.delete(pid);
  } else {
    // Don't allow hiding if only 1 left visible
    if (getVisiblePlatforms().length <= 1) return;
    state.hiddenPlatforms.add(pid);
  }
  saveHiddenPlatforms();
  // Update button appearance in-place without full re-render
  const btn = document.querySelector(`[data-plat-toggle="${pid}"]`);
  if (btn) {
    const p = PLATFORMS[pid];
    const visible = !state.hiddenPlatforms.has(pid);
    btn.style.border = `1px solid ${visible ? p.color : 'var(--border-light)'}`;
    btn.style.background = visible ? p.color + '18' : 'var(--bg-card)';
    btn.style.color = visible ? p.color : 'var(--text-muted)';
    btn.querySelector('.plat-toggle-check').textContent = visible ? '✓' : '○';
  }
}
// ─── Platform drag-and-drop state ─────────────────────────────────────────
let _platDragSrc = null;
function platDragStart(e, pid) {
  _platDragSrc = pid;
  e.dataTransfer.effectAllowed = 'move';
}
function platDragOver(e, pid) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
function platDrop(e, pid) {
  e.preventDefault();
  if (!_platDragSrc || _platDragSrc === pid) return;
  const order = [...state.platformOrder];
  const from = order.indexOf(_platDragSrc);
  const to = order.indexOf(pid);
  if (from === -1 || to === -1) return;
  order.splice(from, 1);
  order.splice(to, 0, _platDragSrc);
  state.platformOrder = order;
  savePlatformOrder();
  _platDragSrc = null;
  render();
}
function platDragEnd() { _platDragSrc = null; }

function addCustomTag(tagName) {
  const name = tagName.trim();
  if (!name) return;
  if (POST_TAGS.map(t => t.toLowerCase()).includes(name.toLowerCase())) {
    showToast('Tag already exists.', 'error'); return;
  }
  POST_TAGS = [...POST_TAGS, name];
  savePostTags();
  render();
  showToast('Tag "' + name + '" added!');
}

function deleteCustomTagSafe(tag) {
  // Check if tag is used in any post or draft
  let usedCount = 0;
  Object.values(state.posts).forEach(arr => arr.forEach(p => { if ((p.tags||[]).includes(tag)) usedCount++; }));
  Object.values(state.drafts).forEach(arr => arr.forEach(d => { if ((d.tags||[]).includes(tag)) usedCount++; }));
  if (usedCount > 0) {
    const msg = document.getElementById('tag-mgmt-msg');
    if (msg) { msg.style.color = 'var(--text-danger)'; msg.textContent = `"${tag}" is used in ${usedCount} post(s). Remove it from posts first.`; setTimeout(() => { msg.textContent = ''; }, 4000); }
    return;
  }
  deleteCustomTag(tag);
  render();
  setTimeout(() => { const m = document.getElementById('tag-mgmt-msg'); if (m) { m.style.color = 'var(--text-success)'; m.textContent = `Deleted: "${tag}"`; setTimeout(() => { if (m) m.textContent = ''; }, 2000); } }, 50);
}
function addTagFromSettings() {
  const input = document.getElementById('new-tag-input');
  if (!input) return;
  const name = input.value.trim();
  const msg = document.getElementById('tag-mgmt-msg');
  if (!name) return;
  if (POST_TAGS.map(t => t.toLowerCase()).includes(name.toLowerCase())) {
    if (msg) { msg.style.color = 'var(--text-danger)'; msg.textContent = `Tag "${name}" already exists.`; setTimeout(() => { if (msg) msg.textContent = ''; }, 3000); }
    return;
  }
  addCustomTag(name);
  input.value = '';
  render();
  setTimeout(() => { const m = document.getElementById('tag-mgmt-msg'); if (m) { m.style.color = 'var(--text-success)'; m.textContent = `Added: "${name}"`; setTimeout(() => { if (m) m.textContent = ''; }, 2000); } }, 50);
}

function deleteCustomTag(tag) {
  if (DEFAULT_POST_TAGS.includes(tag)) {
    showToast('Built-in tags can\'t be deleted, but you can filter them out.', 'error');
    return;
  }
  POST_TAGS = POST_TAGS.filter(t => t !== tag);
  savePostTags();
  // Also remove from active filter if present
  state.activeTagFilter = state.activeTagFilter.filter(t => t !== tag);
  state.tagSearchMode = state.activeTagFilter.length > 0;
  render();
  showToast('Tag "' + tag + '" removed.');
}

async function loadPosts() {
  const defaults = { pinterest: [], instagram: [], google: [], linkedin: [], shopify: [], bluesky: [], tiktok: [], youtube: [] };
  try {
    const raw = localStorage.getItem(STORAGE_KEY());
    if (!raw) return defaults;
    const parsed = JSON.parse(raw);
    const result = { ...defaults };
    for (const [platform, arr] of Object.entries(parsed)) {
      if (!Array.isArray(arr)) continue;
      result[platform] = await Promise.all(arr.map(p => rehydratePost(p)));
    }
    return result;
  } catch(e) {
    console.warn('loadPosts failed:', e);
    return defaults;
  }
}

// ─── STORAGE WARNING ─────────────────────────────────────────────────────────
let _storageWarnShown = false;
function showStorageWarning(e) {
  if (_storageWarnShown) return;
  _storageWarnShown = true;
  // Reset after a minute so it can show again if needed
  setTimeout(() => { _storageWarnShown = false; }, 60000);
  const isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22);
  showToast(
    isQuota
      ? '⚠️ Storage limit hit — your images are safe in IndexedDB but post metadata may not be saved. Try deleting old posts.'
      : '⚠️ Save failed: ' + (e && e.message ? e.message.substring(0, 80) : 'Unknown error'),
    'error'
  );
}

// ─── AUTO-SAVE ───────────────────────────────────────────────────────────────
async function autoSave() {
  try {
    // Build a metadata-only snapshot (no image blobs — those live in IndexedDB)
    const postsStripped = {};
    for (const [platform, arr] of Object.entries(state.posts)) {
      postsStripped[platform] = await Promise.all(arr.map(p => persistPostImages(p)));
    }
    const draftsStripped = {};
    for (const [platform, arr] of Object.entries(state.drafts)) {
      draftsStripped[platform] = await Promise.all(arr.map(d => persistDraftImages(d)));
    }
    const snapshot = {
      savedAt: new Date().toISOString(),
      posts: postsStripped,
      drafts: draftsStripped,
    };
    localStorage.setItem(AUTOSAVE_KEY(), JSON.stringify(snapshot));
    state.lastSavedAt = new Date();
    updateLastSavedLabel();
  } catch(e) {
    console.warn('Auto-save failed:', e);
    showStorageWarning(e);
  }
}

function updateLastSavedLabel() {
  const el = document.getElementById('last-saved-label');
  if (!el || !state.lastSavedAt) return;
  const diff = Math.round((Date.now() - state.lastSavedAt.getTime()) / 1000);
  if (diff < 60) el.textContent = 'Auto-saved just now';
  else if (diff < 120) el.textContent = 'Auto-saved 1 min ago';
  else el.textContent = 'Auto-saved ' + Math.floor(diff / 60) + ' min ago';
}

function startAutoSave() {
  autoSave(); // save immediately on load
  setInterval(autoSave, AUTOSAVE_INTERVAL_MS);
  // Update the "X min ago" label every 30 seconds
  setInterval(updateLastSavedLabel, 30000);
}

function checkForLivePosts() {
  const now = new Date();
  Object.values(PLATFORMS).forEach(platform => {
    (state.posts[platform.id] || []).forEach(post => {
      if (!post.scheduledDate) return;
      if (post.publishStatus === 'published' || post.publishStatus === 'publishing') return;
      const postTime = new Date(post.scheduledDate + 'T' + (post.scheduledTime || '00:00'));
      const id = String(post.id);
      if (postTime <= now && !state.notifiedPostIds.has(id)) {
        state.notifiedPostIds.add(id);
        saveNotifiedIds();
        if (platform.id === 'pinterest' || platform.id === 'google' || platform.id === 'linkedin') {
          triggerPublish(post.id, platform.id);
        } else {
          // Instagram — no auto-publish yet, just notify
          if (state.notificationsEnabled) fireNotification(post, platform, true);
        }
      }
    });
  });
}

function fireNotification(post, platform, success, errorMsg) {
  const raw = post.title || post.caption || post.content || post.eventTitle || 'Untitled Post';
  const title = raw.toUpperCase().substring(0, 60) + (raw.length > 60 ? '…' : '');
  const notif = {
    id: Date.now() + Math.random(),
    postTitle: title,
    platformName: platform.name.toUpperCase(),
    platformColor: platform.color,
    success: success !== false,
    errorMsg: errorMsg || '',
  };
  state.liveNotifications.unshift(notif);
  if (state.liveNotifications.length > 5) state.liveNotifications.pop();
  if (notif.success) playNotificationSound();
  renderNotificationFeed();
  setTimeout(() => dismissNotification(notif.id), notif.success ? 10000 : 15000);
}

function dismissNotification(nid) {
  state.liveNotifications = state.liveNotifications.filter(n => n.id !== nid);
  renderNotificationFeed();
}

function renderNotificationFeed() {
  const container = document.getElementById('notif-feed');
  if (!container) return;
  container.innerHTML = state.liveNotifications.map(n => {
    const bg      = n.success ? 'linear-gradient(135deg,#1a2a1a,#1e2818)' : 'linear-gradient(135deg,#2a1a1a,#281e1e)';
    const border  = n.success ? 'var(--border-success)' : 'var(--border-danger)';
    const emoji   = n.success ? '🎉' : '⚠️';
    const msg     = n.success
      ? `Your post <strong style="color:${n.platformColor}">'${escapeHtml(n.postTitle)}'</strong> just went live on <strong style="color:${n.platformColor}">${escapeHtml(n.platformName)}!</strong>`
      : `Failed to publish <strong style="color:${n.platformColor}">'${escapeHtml(n.postTitle)}'</strong> to <strong style="color:${n.platformColor}">${escapeHtml(n.platformName)}</strong>${n.errorMsg ? ': ' + escapeHtml(n.errorMsg.substring(0,60)) : '.'}`;
    return `
      <div style="background:${bg};border:1px solid ${border};border-left:3px solid ${n.platformColor};border-radius:var(--radius-sm);padding:9px 28px 9px 11px;margin-top:6px;font-size:11.5px;line-height:1.5;animation:notifSlideIn 0.3s ease;position:relative">
        <button onclick="dismissNotification(${n.id})" style="position:absolute;top:4px;right:7px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;line-height:1;padding:0">×</button>
        ${emoji} ${msg}
      </div>`;
  }).join('');
}

// Used by autoSaveItemsToDrafts to silently land incoming items in non-active accounts.
function loadDraftsForWorkspace(wsId) {
  const base = { pinterest: [], instagram: [], google: [], linkedin: [], shopify: [], bluesky: [], tiktok: [], youtube: [], twitter: [], kofi: [], facebook: [], tumblr: [], patreon: [] };
  try {
    const raw = localStorage.getItem(wsId + '_' + _DRAFTS_STORAGE_KEY_BASE);
    if (raw) return { ...base, ...JSON.parse(raw) };
  } catch {}
  return base;
}

async function saveDraftsForWorkspace(wsId, drafts) {
  try {
    const stripped = {};
    for (const [platform, arr] of Object.entries(drafts)) {
      stripped[platform] = await Promise.all(arr.map(d => persistDraftImages(d)));
    }
    localStorage.setItem(wsId + '_' + _DRAFTS_STORAGE_KEY_BASE, JSON.stringify(stripped));
  } catch(e) {
    console.warn('saveDraftsForWorkspace failed for', wsId, e);
  }
}

// Auto-save a batch of queue items as drafts into a specific (non-active) workspace.
// Called when the poller finds items queued for a workspace the user isn't currently on.
let _autoSaveInProgress = false;
async function autoSaveItemsToDrafts(wsId, items) {
  if (_autoSaveInProgress) return;
  _autoSaveInProgress = true;
  try {
    const drafts = loadDraftsForWorkspace(wsId);
    let added = 0;
    for (const item of items) {
      const platforms = (item.selectedPlatforms && item.selectedPlatforms.length)
        ? item.selectedPlatforms.filter(pid => PLATFORMS[pid])
        : [item.platform && PLATFORMS[item.platform] ? item.platform : 'pinterest'];
      const fmt = item.format || 'png';
      for (const pid of platforms) {
        const existing = drafts[pid] || [];
        if (existing.length >= MAX_DRAFTS) continue;
        const imageName = (item.imageName || 'BrandPost').replace(/\.[^.]+$/, '') + '_' + pid + (fmt === 'gif' ? '.gif' : '.png');
        if (existing.some(d => d.imageName === imageName && d.fromBrandCreator)) continue; // duplicate guard
        const imageData = await getImageForPlatform(item, pid, fmt);
        const dims = PLATFORM_DIMENSIONS[pid];
        drafts[pid] = [...existing, {
          id: Date.now() + Math.random(),
          platform: pid,
          imageFull: imageData,
          imageThumb: imageData,
          imageName,
          notes: [item.header, item.content].filter(Boolean).join(' · ').substring(0, 200),
          uploadedAt: new Date().toISOString(),
          fromBrandCreator: true,
          autoImported: true,
          templateName: item.templateName || '',
          format: fmt,
          dimensions: dims ? dims.w + 'x' + dims.h : '',
        }];
        added++;
      }
    }
    if (added > 0) {
      await saveDraftsForWorkspace(wsId, drafts);
      const wsNames = getWorkspaceNames();
      showToast('📥 Auto-saved ' + added + ' item(s) to drafts in ' + (wsNames[wsId] || wsId) + '.');
    }
  } finally {
    _autoSaveInProgress = false;
  }
}

// Correct dimensions per platform
const PLATFORM_DIMENSIONS = {
  pinterest: { w: 1000, h: 1500, ratio: '2:3',      label: '2:3 Portrait'    },
  instagram: { w: 1080, h: 1080, ratio: '1:1',      label: '1:1 Square'      },
  google:    { w: 1200, h: 900,  ratio: '4:3',      label: '4:3 Landscape'   },
  linkedin:  { w: 1000, h: 1500, ratio: '2:3',      label: '2:3 Portrait'    },
};

// Center-crop + resize to platform's exact dimensions (fallback if BPC didn't pre-render)
function cropForPlatform(dataUrl, platformId) {
  return new Promise(resolve => {
    const dims = PLATFORM_DIMENSIONS[platformId];
    if (!dims) return resolve(dataUrl);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = dims.w;
      canvas.height = dims.h;
      const ctx = canvas.getContext('2d');
      const imgRatio = img.width / img.height;
      const targetRatio = dims.w / dims.h;
      let sx, sy, sw, sh;
      if (imgRatio > targetRatio) {
        sh = img.height; sw = sh * targetRatio;
        sx = (img.width - sw) / 2; sy = 0;
      } else {
        sw = img.width; sh = sw / targetRatio;
        sx = 0; sy = (img.height - sh) / 2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, dims.w, dims.h);
      resolve(canvas.toDataURL('image/jpeg', 0.88));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// Get best image for a platform from a queue item
async function getImageForPlatform(item, platformId, fmt) {
  const useGif = fmt === 'gif' && item.gifDataUrl;
  if (useGif) return item.gifDataUrl;
  // Use pre-rendered platform-specific version if available
  if (item.platformImages && item.platformImages[platformId]) {
    return item.platformImages[platformId];
  }
  // Fallback: crop the generic dataUrl to correct aspect ratio
  return await cropForPlatform(item.dataUrl, platformId);
}

function startIncomingPoller() {
  checkIncomingQueue();
  setInterval(checkIncomingQueue, 3000);
}

function checkIncomingQueue() {
  // ── 1. Active workspace: show the modal as before ────────────────────────
  // Check both the workspace-prefixed key AND the plain legacy key that
  // PPPostCreator uses when no saved account config is found (first run).
  try {
    const raw = localStorage.getItem(PF_QUEUE_KEY())
             || localStorage.getItem('postflow_incoming_queue');
    if (raw) {
      // Normalise — whichever key we found, write it under the prefixed key
      // so it gets cleared correctly when dismissed
      if (!localStorage.getItem(PF_QUEUE_KEY()) && localStorage.getItem('postflow_incoming_queue')) {
        try {
          localStorage.setItem(PF_QUEUE_KEY(), raw);
          localStorage.removeItem('postflow_incoming_queue');
        } catch {}
      }
      const items = JSON.parse(raw);
      if (items && items.length && !state.showIncomingModal) {
        state.incomingQueue = items;
        const first = items[0];
        // Use the platforms the user explicitly chose in Brand Creator, or fall back to suggested platform
        const defaultPlatforms = first.selectedPlatforms && first.selectedPlatforms.length
          ? first.selectedPlatforms.filter(pid => PLATFORMS[pid])
          : [first.platform && PLATFORMS[first.platform] ? first.platform : 'pinterest'];
        state.incomingSelection = {
          platforms: new Set(defaultPlatforms),
          format: first.format || 'png',
        };
        state.showIncomingModal = true;
        render();
      }
    }
  } catch(e) {}

  // ── 2. Non-active workspaces: auto-save as drafts immediately ───────────
  // Ensures content sent to any account lands as a draft even if that workspace
  // is not currently open, so nothing is ever lost due to a workspace mismatch.
  const activeWs = getActiveWorkspace();
  for (const wsId of WS_IDS) {
    if (wsId === activeWs) continue;
    try {
      const queueKey = wsId + '_postflow_incoming_queue';
      const raw = localStorage.getItem(queueKey);
      if (!raw) continue;
      const items = JSON.parse(raw);
      if (!items || !items.length) continue;
      // Clear the queue immediately so we don't re-process on next tick
      try { localStorage.removeItem(queueKey); } catch(e) {}
      autoSaveItemsToDrafts(wsId, items); // async — fire and forget
    } catch(e) {}
  }
}

function dismissIncoming() {
  try { localStorage.removeItem(PF_QUEUE_KEY()); } catch(e) {}
  state.incomingQueue = [];
  state.showIncomingModal = false;
  state.incomingSelection = { platforms: new Set(), format: 'png' };
  render();
}

function skipIncomingItem() {
  state.incomingQueue.shift();
  if (!state.incomingQueue.length) {
    dismissIncoming();
  } else {
    const next = state.incomingQueue[0];
    state.incomingSelection = {
      platforms: new Set([next.platform && PLATFORMS[next.platform] ? next.platform : 'pinterest']),
      format: next.format || 'png',
    };
    try { localStorage.setItem(PF_QUEUE_KEY(), JSON.stringify(state.incomingQueue)); } catch(e) {}
    render();
  }
}

function toggleIncomingPlatform(pid) {
  if (!state.incomingSelection) return;
  if (state.incomingSelection.platforms.has(pid)) {
    state.incomingSelection.platforms.delete(pid);
  } else {
    state.incomingSelection.platforms.add(pid);
  }
  // Re-render just the platform checkboxes without full render
  const el = document.getElementById('incoming-platform-grid');
  if (el) el.innerHTML = buildIncomingPlatformGrid();
  updateIncomingConfirmBtn();
}

function setIncomingFormat(fmt) {
  if (!state.incomingSelection) return;
  state.incomingSelection.format = fmt;
  ['incoming-fmt-png','incoming-fmt-gif'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const active = id === 'incoming-fmt-' + fmt;
    el.style.background = active ? '#a78bfa' : 'var(--bg-elevated)';
    el.style.color = active ? '#fff' : 'var(--text-secondary)';
    el.style.borderColor = active ? '#a78bfa' : 'var(--border-light)';
  });
  updateIncomingConfirmBtn();
}

function updateIncomingConfirmBtn() {
  const btn = document.getElementById('incoming-confirm-btn');
  if (!btn) return;
  const count = state.incomingSelection.platforms.size;
  const fmt = state.incomingSelection.format.toUpperCase();
  btn.disabled = count === 0;
  btn.textContent = count === 0
    ? 'Select at least one platform'
    : `📅 Schedule Now → ${count} Platform${count !== 1 ? 's' : ''}`;
  btn.style.background = count === 0 ? 'var(--bg-elevated)' : '#1d7fe8';
  btn.style.color = count === 0 ? 'var(--text-muted)' : '#fff';
  btn.style.cursor = count === 0 ? 'not-allowed' : 'pointer';
}

async function confirmIncoming() {
  const item = state.incomingQueue[0];
  if (!item || !state.incomingSelection) return;
  const platforms = [...state.incomingSelection.platforms];
  const fmt = state.incomingSelection.format;
  if (!platforms.length) return;

  const btn = document.getElementById('incoming-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Processing…'; }

  let added = 0;
  for (const pid of platforms) {
    const existing = state.drafts[pid] || [];
    if (existing.length >= MAX_DRAFTS) {
      showToast('Draft bank full for ' + PLATFORMS[pid].name + ' — skipped.', 'error');
      continue;
    }
    // Get correctly-sized image for this platform
    const imageData = await getImageForPlatform(item, pid, fmt);
    const dims = PLATFORM_DIMENSIONS[pid];
    const imageName = (item.imageName || 'BrandPost')
      .replace(/\.[^.]+$/, '') + '_' + pid + (fmt === 'gif' ? '.gif' : '.png');

    // Duplicate guard — skip if a draft with the same imageName already exists
    const isDupe = existing.some(d => d.imageName === imageName && d.fromBrandCreator);
    if (isDupe) {
      showToast('Duplicate skipped for ' + PLATFORMS[pid].name + ' — already in drafts.', 'error');
      continue;
    }

    const draft = {
      id: Date.now() + Math.random(),
      platform: pid,
      imageFull: imageData,
      imageThumb: imageData,
      imageName,
      notes: [item.header, item.content].filter(Boolean).join(' · ').substring(0, 200),
      uploadedAt: new Date().toISOString(),
      fromBrandCreator: true,
      templateName: item.templateName || '',
      format: fmt,
      dimensions: dims ? dims.w + '×' + dims.h : '',
    };
    const updated = { ...state.drafts, [pid]: [...existing, draft] };
    state.drafts = updated;
    saveDrafts(updated);
    added++;
  }

  if (added > 0) {
    const names = platforms.map(pid => PLATFORMS[pid].name + ' (' + (PLATFORM_DIMENSIONS[pid]?.ratio || '') + ')').join(', ');
    showToast('Added to drafts: ' + names + ' as ' + fmt.toUpperCase() + '!');
  }

  skipIncomingItem();
}

async function scheduleIncomingNow() {
  const item = state.incomingQueue[0];
  if (!item || !state.incomingSelection) return;
  const platforms = [...state.incomingSelection.platforms];
  if (!platforms.length) return;
  const fmt = state.incomingSelection.format;

  const btn = document.getElementById('incoming-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Opening…'; }

  const firstPid = platforms[0];
  const restPids = platforms.slice(1);

  // Add remaining platforms to drafts with correct sizing
  for (const pid of restPids) {
    const existing = state.drafts[pid] || [];
    if (existing.length < MAX_DRAFTS) {
      const imageData = await getImageForPlatform(item, pid, fmt);
      const dims = PLATFORM_DIMENSIONS[pid];
      const draft = {
        id: Date.now() + Math.random(),
        platform: pid,
        imageFull: imageData,
        imageThumb: imageData,
        imageName: (item.imageName || 'BrandPost').replace(/\.[^.]+$/, '') + '_' + pid + (fmt === 'gif' ? '.gif' : '.png'),
        notes: [item.header, item.content].filter(Boolean).join(' · ').substring(0, 200),
        uploadedAt: new Date().toISOString(),
        fromBrandCreator: true,
        templateName: item.templateName || '',
        format: fmt,
        dimensions: dims ? dims.w + '×' + dims.h : '',
      };
      state.drafts = { ...state.drafts, [pid]: [...existing, draft] };
      saveDrafts(state.drafts);
    }
  }

  // Get correctly-sized image for first platform
  const firstImageData = await getImageForPlatform(item, firstPid, fmt);
  const firstDims = PLATFORM_DIMENSIONS[firstPid];

  state.activePlatform = firstPid;
  state.activeView = 'scheduled';
  state.editingPostId = null;
  state.form = {
    ...defaultForm(firstPid),
    image: firstImageData,
    imageName: (item.imageName || 'BrandPost').replace(/\.[^.]+$/, '') + '_' + firstPid + (fmt === 'gif' ? '.gif' : '.png'),
    title: item.header || '',
    description: item.content || '',
    caption: [item.header, item.content].filter(Boolean).join('\n'),
    content: item.content || '',
    liText: [item.header, item.content].filter(Boolean).join('\n'),
  };
  state.showComposer = true;
  state.showIncomingModal = false;
  state.incomingQueue.shift();
  try { localStorage.setItem(PF_QUEUE_KEY(), JSON.stringify(state.incomingQueue)); } catch(e) {}
  if (!state.incomingQueue.length) {
    try { localStorage.removeItem(PF_QUEUE_KEY()); } catch(e) {}
  }
  render();

  const dimLabel = firstDims ? ' (' + firstDims.ratio + ')' : '';
  const msg = restPids.length
    ? `Opened ${PLATFORMS[firstPid].name}${dimLabel} composer — ${restPids.map(p => PLATFORMS[p].name).join(', ')} added to drafts.`
    : `Loaded into ${PLATFORMS[firstPid].name}${dimLabel} composer — set a date and schedule!`;
  showToast(msg);

  if (firstPid === 'pinterest' && state.apiKeys.pinterest && state.pinterestBoardsStatus === 'idle') {
    fetchPinterestBoards();
  }
}

// ─── PUBLISHING ENGINE ───────────────────────────────────────────────────────
async function publishPost(post, platform) {
  if (platform.id === 'pinterest') return publishToPinterest(post);
  if (platform.id === 'google')    return publishToGoogle(post);
  if (platform.id === 'linkedin')  return publishToLinkedIn(post);
  return { ok: false, error: 'Platform publishing not yet supported.' };
}

async function publishToLinkedIn(post) {
  const token = state.apiKeys.linkedin;
  if (!token) return { ok: false, error: 'No LinkedIn token saved.' };

  // Determine author URN
  let authorUrn;
  if (post.liAuthorType === 'page' && post.liPageId) {
    authorUrn = 'urn:li:organization:' + post.liPageId;
  } else {
    if (!state.linkedinPersonId) return { ok: false, error: 'LinkedIn profile not loaded. Open a composer and click Load Profile.' };
    authorUrn = 'urn:li:person:' + state.linkedinPersonId;
  }

  const visibility = post.liVisibility === 'CONNECTIONS' ? 'CONNECTIONS' : 'PUBLIC';

  // Step 1 — if there's an image, prepare platform-optimised version then upload
  let imageUrn = null;
  if (post.image) {
    // Use original if available, then optimise for LinkedIn spec
    const src = post.imageOriginal || post.image;
    const optimised = await prepareImageForPlatform(src, 'linkedin');
    const uploadResult = await uploadLinkedInImage(token, authorUrn, optimised);
    if (!uploadResult.ok) return { ok: false, error: 'Image upload failed: ' + uploadResult.error };
    imageUrn = uploadResult.imageUrn;
  }

  // Step 2 — create the post
  const body = {
    author: authorUrn,
    commentary: post.liText || '',
    visibility: visibility,
    distribution: { feedDistribution: 'MAIN_FEED', targetEntities: [], thirdPartyDistributionChannels: [] },
    lifecycleState: 'PUBLISHED',
    isReshareDisabledByAuthor: false,
  };

  // Add image content if uploaded
  if (imageUrn) {
    body.content = { media: { id: imageUrn, altText: post.liText ? post.liText.substring(0, 120) : '' } };
  }

  // Add article link if provided
  if (!imageUrn && post.liArticleUrl) {
    body.content = { article: { source: post.liArticleUrl, title: '', description: '' } };
  }

  try {
    const res = await fetch('https://api.linkedin.com/rest/posts', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'LinkedIn-Version': '202401',
        'X-Restli-Protocol-Version': '2.0.0',
      },
      body: JSON.stringify(body),
    });
    if (res.status === 201 || res.ok) {
      const postId = res.headers.get('x-restli-id') || 'created';
      return { ok: true, postId };
    }
    const data = await res.json().catch(() => ({}));
    return { ok: false, error: data.message || ('HTTP ' + res.status) };
  } catch(e) {
    return { ok: false, error: e.message || 'Network error' };
  }
}

async function uploadLinkedInImage(token, ownerUrn, dataUrl) {
  try {
    // Step 1: Initialize the upload
    const initRes = await fetch('https://api.linkedin.com/rest/images?action=initializeUpload', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'LinkedIn-Version': '202401',
        'X-Restli-Protocol-Version': '2.0.0',
      },
      body: JSON.stringify({ initializeUploadRequest: { owner: ownerUrn } }),
    });
    if (!initRes.ok) return { ok: false, error: 'Upload init failed: HTTP ' + initRes.status };
    const initData = await initRes.json();
    const uploadUrl = initData.value && initData.value.uploadUrl;
    const imageUrn  = initData.value && initData.value.image;
    if (!uploadUrl || !imageUrn) return { ok: false, error: 'Could not get upload URL from LinkedIn.' };

    // Step 2: Convert base64 to binary and PUT it
    const match = dataUrl.match(/^data:(image\/\w+);base64,(.+)$/);
    if (!match) return { ok: false, error: 'Invalid image format.' };
    const contentType = match[1];
    const binary = atob(match[2]);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

    const uploadRes = await fetch(uploadUrl, {
      method: 'PUT',
      headers: { 'Content-Type': contentType },
      body: bytes.buffer,
    });
    if (!uploadRes.ok) return { ok: false, error: 'Image PUT failed: HTTP ' + uploadRes.status };

    return { ok: true, imageUrn };
  } catch(e) {
    return { ok: false, error: e.message || 'Image upload error' };
  }
}

async function publishToPinterest(post) {
  const token = state.apiKeys.pinterest;
  if (!token) return { ok: false, error: 'No Pinterest API key saved.' };
  if (!post.boardId && !post.board) return { ok: false, error: 'No board selected for this pin.' };

  // Use original if available, then optimise for Pinterest spec (2:3, up to 2000px wide)
  let imageDataUrl = post.imageOriginal || post.image;
  if (imageDataUrl && !imageDataUrl.startsWith('data:image/gif')) {
    imageDataUrl = await prepareImageForPlatform(imageDataUrl, 'pinterest');
  }

  // Strip the data:image/...;base64, prefix Pinterest does not want
  let imageData = null;
  let contentType = 'image/jpeg';
  if (imageDataUrl) {
    const match = imageDataUrl.match(/^data:(image\/\w+);base64,(.+)$/);
    if (match) { contentType = match[1]; imageData = match[2]; }
    else { imageData = imageDataUrl; }
  }

  const body = {
    board_id: post.boardId || post.board,
    title: post.title || '',
    description: post.description || '',
    link: post.destinationUrl || undefined,
    alt_text: post.altText || undefined,
  };

  if (imageData) {
    body.media_source = {
      source_type: 'image_base64',
      content_type: contentType,
      data: imageData,
    };
  }

  try {
    const res = await fetch('https://api.pinterest.com/v5/pins', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {

    return { ok: true, pinId: data.id };
  } catch(e) {

}

async function publishToGoogle(post) {
  const token = state.apiKeys.google;
  const accountId = state.apiKeys.googleAccountId;
  const locationId = state.apiKeys.googleLocationId;
  if (!token)      return { ok: false, error: 'No Google API token saved.' };
  if (!accountId)  return { ok: false, error: 'No Google Account ID saved. Add it in ⚙️ Settings.' };
  if (!locationId) return { ok: false, error: 'No Google Location ID saved. Add it in ⚙️ Settings.' };

  // Map post type to Google topic type
  const topicMap = { "What's New": 'STANDARD', 'Event': 'EVENT', 'Offer': 'OFFER' };
  const topicType = topicMap[post.postType] || 'STANDARD';

  // Map CTA button type
  const ctaMap = {
    'Book': 'BOOK', 'Order Online': 'ORDER_ONLINE', 'Shop': 'SHOP',
    'Learn More': 'LEARN_MORE', 'Sign Up': 'SIGN_UP', 'Call Now': 'CALL_NOW',
  };

  const body = {
    languageCode: 'en-US',
    summary: post.content || '',
    topicType,
  };

  if (post.ctaType && post.ctaType !== 'None' && ctaMap[post.ctaType]) {
    body.callToAction = { actionType: ctaMap[post.ctaType], url: post.ctaUrl || undefined };
  }

  if (topicType === 'EVENT' && post.eventTitle) {
    body.event = {
      title: post.eventTitle,
      schedule: {
        startDate: post.eventStart ? googleDateObj(post.eventStart) : undefined,
        endDate:   post.eventEnd   ? googleDateObj(post.eventEnd)   : undefined,
      },
    };
  }

  if (topicType === 'OFFER' && post.eventTitle) {
    body.offer = {
      couponCode:      post.couponCode      || undefined,
      redeemOnlineUrl: post.redemptionUrl   || undefined,
      termsConditions: post.offerTerms      || undefined,
    };
  }

  const url = 'https://mybusiness.googleapis.com/v4/accounts/'
    + encodeURIComponent(accountId) + '/locations/'
    + encodeURIComponent(locationId) + '/localPosts';

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = (data.error && data.error.message) || ('HTTP ' + res.status);
      return { ok: false, error: msg };
    }
    return { ok: true, postName: data.name };
  } catch(e) {
    return { ok: false, error: e.message || 'Network error' };
  }
}

function googleDateObj(dateStr) {
  // dateStr is YYYY-MM-DD or YYYY-MM-DDTHH:MM
  const d = dateStr.split('T')[0].split('-');
  return { year: parseInt(d[0]), month: parseInt(d[1]), day: parseInt(d[2]) };
}

function renderScheduleBadges(post, platform) {
  if (!post.scheduledDate) return '';
  const d = new Date(post.scheduledDate + 'T' + (post.scheduledTime || '00:00'));
  const dayName   = d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
  const monthName = d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
  const dateNum   = d.getDate();
  const timeStr   = (() => {
    const [h, m] = (post.scheduledTime || '00:00').split(':');
    const hr = parseInt(h, 10);
    const ampm = hr >= 12 ? 'PM' : 'AM';
    const hr12 = hr % 12 || 12;
    return `${hr12}:${m} ${ampm}`;
  })();
  const platIcon = platform.icon.replace(/width="20" height="20"/, 'width="17" height="17"');
  return `
    <div class="post-schedule-badges">

        <div class="sched-badge-label">Platform</div>
        <div class="sched-badge" style="background:${platform.color}">${platIcon}</div>

      </div>
      <div class="sched-badge-wrap">
        <div class="sched-badge-label">Month</div>
        <div class="sched-badge sched-badge-month">${monthName}</div>
      </div>
      <div class="sched-badge-wrap">
        <div class="sched-badge-label">Date</div>
        <div class="sched-badge sched-badge-date">${dateNum}</div>

      <div class="sched-badge-wrap">

async function triggerPublish(postId, platformId) {

  const postArr  = state.posts[platformId] || [];
  const post     = postArr.find(p => String(p.id) === String(postId));

// ─── IMAGE COMPRESSION ──────────────────────────────────────────────────────
function compressImage(dataUrl, maxW, quality) {
  return new Promise(resolve => {
    if (!dataUrl) { resolve(dataUrl); return; }
    // GIFs must never go through canvas — canvas only captures one frame, killing animation
    if (dataUrl.startsWith('data:image/gif')) { resolve(dataUrl); return; }
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// ─── HIGH-QUALITY IMAGE PIPELINE ──────────────────────────────────────────
// Strategy: always keep the original full-resolution image untouched.
// Generate display/thumbnail versions lazily for UI use only.
// Platform APIs always receive the original (or platform-optimal) version.
//
// Platform optimal dimensions (min for quality, capped to avoid huge payloads):
const PLATFORM_IMAGE_SPECS = {
  pinterest:  { maxW: 2000, maxH: 3000, quality: 0.97 }, // 2:3 ideal, up to 2000px wide
  google:     { maxW: 1200, maxH:  900, quality: 0.97 }, // 4:3 landscape
  linkedin:   { maxW: 1920, maxH: 1080, quality: 0.97 }, // 1.91:1 ideal
  instagram:  { maxW: 1080, maxH: 1350, quality: 0.97 }, // 4:5 or 1:1
  shopify:    { maxW: 2048, maxH: 2048, quality: 0.97 },
  bluesky:    { maxW: 2000, maxH: 2000, quality: 0.97 },
  tiktok:     { maxW: 1080, maxH: 1920, quality: 0.97 },
  youtube:    { maxW: 1280, maxH:  720, quality: 0.97 },
};
// UI thumbnail (displayed in cards, draft grid) — small, fast
const THUMB_SPEC = { maxW: 320, quality: 0.78 };

// Returns a platform-optimised JPEG dataUrl, preserving original if already within spec
function prepareImageForPlatform(dataUrl, platformId) {
  return new Promise(resolve => {
    if (!dataUrl) { resolve(null); return; }
    // GIFs pass through unchanged
    if (dataUrl.startsWith('data:image/gif')) { resolve(dataUrl); return; }
    const spec = PLATFORM_IMAGE_SPECS[platformId] || { maxW: 1920, maxH: 1920, quality: 0.97 };
    const img = new Image();
    img.onload = () => {
      // Only resize if larger than spec; never upscale
      const scaleW = img.width  > spec.maxW ? spec.maxW / img.width  : 1;
      const scaleH = img.height > spec.maxH ? spec.maxH / img.height : 1;
      const scale  = Math.min(scaleW, scaleH);
      if (scale >= 1) {
        // Already within bounds — re-encode at high quality to normalise format
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', spec.quality));
        return;
      }
      const w = Math.round(img.width  * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', spec.quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// Fast thumbnail for UI (draft cards, post cards)
function makeThumbnail(dataUrl) {
  return compressImage(dataUrl, THUMB_SPEC.maxW, THUMB_SPEC.quality);
}

// Returns image size info string for display
function getImageSizeLabel(dataUrl) {
  if (!dataUrl) return '';
  if (dataUrl.startsWith('data:video/')) {
    return new Promise(resolve => {
      const v = document.createElement('video');
      v.onloadedmetadata = () => resolve(`${v.videoWidth}×${v.videoHeight} (video)`);
      v.onerror = () => resolve('(video)');
      v.src = dataUrl;
    });
  }
  const isGif = dataUrl.startsWith('data:image/gif');
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(`${img.naturalWidth}×${img.naturalHeight}${isGif ? ' · Animated GIF' : ''}`);
    img.onerror = () => resolve(isGif ? 'Animated GIF' : '');
    img.src = dataUrl;
  });
}

// Extract a thumbnail frame from a video data URL
function makeVideoThumbnail(videoDataUrl) {
  return new Promise(resolve => {
    const video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.crossOrigin = 'anonymous';
    video.onloadeddata = () => {
      video.currentTime = Math.min(1, video.duration * 0.1);
    };
    video.onseeked = () => {
      const canvas = document.createElement('canvas');
      const maxW = 400, maxH = 400;
      let w = video.videoWidth, h = video.videoHeight;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      canvas.width = w || 320; canvas.height = h || 240;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      // Add a play icon overlay so user knows it's a video
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      const cx = canvas.width / 2, cy = canvas.height / 2, r = Math.min(cx, cy) * 0.3;
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.3, cy - r * 0.45);
      ctx.lineTo(cx + r * 0.5, cy);
      ctx.lineTo(cx - r * 0.3, cy + r * 0.45);
      ctx.closePath();
      ctx.fill();
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    video.onerror = () => {
      // Fallback: grey placeholder
      const canvas = document.createElement('canvas');
      canvas.width = 320; canvas.height = 240;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, 320, 240);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = 'bold 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('▶', 160, 140);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    video.src = videoDataUrl;
  });
}

async function handleDraftUpload(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  const platform = state.activePlatform;
  const existing = state.drafts[platform] || [];
  const slots = MAX_DRAFTS - existing.length;
  if (slots <= 0) { showToast('Draft bank full! Delete some drafts first.', 'error'); return; }

  const toAdd = files.slice(0, slots);
  if (files.length > slots) showToast('Only ' + slots + ' slot' + (slots !== 1 ? 's' : '') + ' remaining — ' + (files.length - slots) + ' skipped.', 'error');

  // Show loading state
  const btn = document.getElementById('draft-upload-btn');
  if (btn) { btn.textContent = 'Uploading…'; btn.disabled = true; }

  const newDrafts = [];
  for (const file of toAdd) {
    const dataUrl = await new Promise(res => {
      const reader = new FileReader();
      reader.onload = ev => res(ev.target.result);
      reader.readAsDataURL(file);
    });
    // Store full-res in IndexedDB immediately — get back an id
    const fullId  = await imgStore(dataUrl);
    // Thumbnail only for the draft grid UI — store that too
    const isVideo = file.type.startsWith('video/');
    const isGif   = file.type === 'image/gif';
    // GIFs pass through as-is — compressImage already protects animation, but we skip
    // thumbnail compression for GIFs to avoid any risk of losing frames
    const thumbData = isVideo ? await makeVideoThumbnail(dataUrl) : await makeThumbnail(dataUrl);
    const thumbId   = await imgStore(thumbData);
    newDrafts.push({
      id: Date.now() + Math.random(),
      platform,
      imageFull:   dataUrl,
      imageThumb:  thumbData,
      imageFullId:  fullId,
      imageThumbId: thumbId,
      imageName: file.name,
      isVideo,
      isGif,
      notes: '',
      uploadedAt: new Date().toISOString(),
    });
  }

  const updated = { ...state.drafts, [platform]: [...existing, ...newDrafts] };
  state.drafts = updated;
  saveDrafts(updated);
  render();
  const mediaWord = newDrafts.every(d => d.isVideo) ? 'video' : newDrafts.some(d => d.isVideo) ? 'file' : 'image';
  showToast(newDrafts.length + ' ' + mediaWord + (newDrafts.length !== 1 ? 's' : '') + ' added to drafts!');
}

function updateDraftNotes(draftId, val) {
  const platform = state.activePlatform;
  state.drafts[platform] = state.drafts[platform].map(d =>

async function deleteDraft(draftId) {
  const platform = state.activePlatform;
  const draft = (state.drafts[platform] || []).find(d => String(d.id) === String(draftId));
  if (draft) {
    // Clean up IndexedDB images
    if (draft.imageFullId)  imgDelete(draft.imageFullId);
    if (draft.imageThumbId && draft.imageThumbId !== draft.imageFullId) imgDelete(draft.imageThumbId);
  }
  const updated = { ...state.drafts, [platform]: state.drafts[platform].filter(d => String(d.id) !== String(draftId)) };
  state.drafts = updated;
  saveDrafts(updated);
  render();
  showToast('Draft deleted.');
}

function scheduleFromDraft(draftId) {
  const platform = state.activePlatform;
  const draft = (state.drafts[platform] || []).find(d => String(d.id) === String(draftId));
  if (!draft) return;
  state.editingPostId = null;
  const fullImg = draft.imageFull || null;
  state.form = {
    ...defaultForm(platform),
    ...(draft.formSnapshot || {}),
    image: fullImg,
    imageOriginal: fullImg,   // keep master reference
    imageName: draft.imageName,
    description: draft.notes || '',
    caption: draft.notes || '',
    content: draft.notes || '',
    tags: draft.tags || [],
    _imageDims: '',
  };
  state.showComposer = true;
  state.activeView = 'scheduled';
  render();
  // Populate image dimensions asynchronously
  if (fullImg) {
    getImageSizeLabel(fullImg).then(dims => {
      if (state.form) { state.form._imageDims = dims; render(); }
    });
  }
  if (platform === 'pinterest' && state.apiKeys.pinterest && state.pinterestBoardsStatus === 'idle') {
    fetchPinterestBoards();
  }
  showToast('Draft loaded into composer — set a date and schedule!');
}

// ─── PINTEREST BOARDS ────────────────────────────────────────────────────────
async function fetchPinterestBoards() {
  const token = state.apiKeys.pinterest;
  if (!token) {
    showToast('Add your Pinterest API key in Settings first.', 'error');
    return;
  }
  state.pinterestBoardsStatus = 'loading';
  state.pinterestBoardsError = '';
  renderBoardDropdown(); // show spinner immediately

  try {
    // Pinterest API v5 — fetch up to 100 boards
    const res = await fetch('https://api.pinterest.com/v5/boards?page_size=100', {
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
      }
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const items = data.items || [];
    state.pinterestBoards = items.map(b => ({
      id: b.id,
      name: b.name,
      description: b.description || '',
      pinCount: b.pin_count || 0,
    }));
    state.pinterestBoardsStatus = 'loaded';
    renderBoardDropdown();
    showToast(`Loaded ${state.pinterestBoards.length} board${state.pinterestBoards.length !== 1 ? 's' : ''}!`);
  } catch (e) {
    state.pinterestBoardsStatus = 'error';
    state.pinterestBoardsError = e.message || 'Could not connect to Pinterest.';
    renderBoardDropdown();
    showToast('Failed to load boards: ' + state.pinterestBoardsError, 'error');
  }
}

function renderBoardDropdown() {
  const container = document.getElementById('board-dropdown-container');
  if (!container) return;
  container.innerHTML = buildBoardDropdownHtml();
}

function buildBoardDropdownHtml() {
  const { pinterestBoardsStatus: status, pinterestBoards: boards, pinterestBoardsError: err } = state;

    return `

          <input type="text" id="f-board" placeholder="e.g. Home Decor" value="${escapeHtml(currentBoard)}" oninput="updateFormField('board',this.value)" style="flex:1"/>

            ${status === 'error' ? '↺ Retry' : '🔗 Load Boards'}

        </div>

      </div>`;
  }

  if (status === 'loading') {
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-input);border:1px solid var(--border-light);border-radius:var(--radius-sm)">
        <span style="font-size:13px;animation:spin 1s linear infinite;display:inline-block">⟳</span>
        <span style="font-size:13px;color:var(--text-secondary)">Fetching boards from Pinterest…</span>

  }

        <input type="text" id="f-board" placeholder="No boards found" value="${escapeHtml(currentBoard)}" oninput="updateFormField('board',this.value)" style="flex:1"/>

async function fetchLinkedInProfile() {
  const token = state.apiKeys.linkedin;
  if (!token) { showToast('Add your LinkedIn token in Settings first.', 'error'); return; }
  try {
    const res = await fetch('https://api.linkedin.com/v2/userinfo', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.linkedinPersonId = data.sub || '';
    state.linkedinPersonName = ((data.given_name || '') + ' ' + (data.family_name || '')).trim();
    showToast('LinkedIn profile loaded: ' + (state.linkedinPersonName || 'Profile'));
    await fetchLinkedInPages();
    renderLinkedInAuthorDropdown();
  } catch(e) {
    showToast('Could not load LinkedIn profile: ' + e.message, 'error');
  }
}

async function fetchLinkedInPages() {
  const token = state.apiKeys.linkedin;
  if (!token) return;
  state.linkedinPagesStatus = 'loading';
  try {
    const res = await fetch(
      'https://api.linkedin.com/v2/organizationalEntityAcls?q=roleAssignee&role=ADMINISTRATOR&state=APPROVED',
      { headers: { 'Authorization': 'Bearer ' + token, 'X-Restli-Protocol-Version': '2.0.0' } }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const orgs = (data.elements || []).map(el => ({
      id: el.organizationalTarget.split(':').pop(),
      urn: el.organizationalTarget,
      name: el.organizationalTarget,
    }));
    const named = await Promise.all(orgs.map(async org => {
      try {
        const r = await fetch('https://api.linkedin.com/v2/organizations/' + org.id,
          { headers: { 'Authorization': 'Bearer ' + token } });
        if (r.ok) { const d = await r.json(); return { ...org, name: d.localizedName || org.urn }; }
      } catch {}
      return org;
    }));
    state.linkedinPages = named;
    state.linkedinPagesStatus = 'loaded';
    if (named.length) showToast('Loaded ' + named.length + ' LinkedIn page' + (named.length !== 1 ? 's' : '') + '!');
  } catch(e) {
    state.linkedinPagesStatus = 'error';
  }
}

const _dtCache = {};
function formatDateTime(date, time) {
  if (!date) return 'No date set';
  const key = `${date}T${time || '00:00'}`;
  if (_dtCache[key]) return _dtCache[key];
  const d = new Date(key);
  const result = d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  _dtCache[key] = result;
  return result;
}

function sortPosts(arr) {
  return [...arr].sort((a, b) => {
    // Undated (queued) posts sink to the bottom
    const aDate = a.scheduledDate ? `${a.scheduledDate}T${a.scheduledTime || '00:00'}` : '9999-12-31T00:00';
    const bDate = b.scheduledDate ? `${b.scheduledDate}T${b.scheduledTime || '00:00'}` : '9999-12-31T00:00';
    return new Date(aDate) - new Date(bDate);
  });
}

function getPostSummary(p) {
  if (p.platform === 'pinterest') return p.title || p.description || 'Untitled Pin';
  if (p.platform === 'instagram') return p.caption || 'No caption';
  if (p.platform === 'linkedin')  return p.liText || 'No text';
  if (p.platform === 'shopify')   return p.shopifyText ? p.shopifyText.substring(0, 80) + (p.shopifyText.length > 80 ? '…' : '') : 'No content';
  if (p.platform === 'bluesky')   return p.bskyText || 'No text';
  if (p.platform === 'tiktok')    return p.tiktokText ? p.tiktokText.substring(0, 80) + (p.tiktokText.length > 80 ? '…' : '') : 'No caption';
  if (p.platform === 'youtube')   return p.ytText || 'No description';
  return p.content || p.eventTitle || 'No content';
}

function getPostMeta(p) {
  if (p.platform === 'pinterest') return p.board ? 'Board: ' + p.board : '';
  if (p.platform === 'instagram') return p.hashtags ? p.hashtags.split(/\s+/).filter(t => t.startsWith('#')).length + ' hashtags' : '';
  if (p.platform === 'linkedin')  return (p.liAuthorType === 'page' && p.liPageName ? 'Page: ' + p.liPageName : 'Personal') + ' · ' + (p.liVisibility === 'CONNECTIONS' ? 'Connections Only' : 'Public');
  return p.postType || '';
}

function getPostsForDate(date, platform) {

function getDateCheckerStatus(date, platformId) {
  const platform = PLATFORMS[platformId];

  const dailyLimit = getDailyLimit(platformId);

  const label = d ? d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const countColor = pct >= 1 ? 'var(--text-danger)' : pct >= 0.67 ? '#f59e0b' : platform.color;
  const msgColor = !date ? 'var(--text-muted)' : pct >= 1 ? 'var(--text-danger)' : pct >= 0.67 ? '#f59e0b' : 'var(--text-success)';
  const msg = !date ? 'Select a date to check'
    : pct >= 1 ? `🚫 Daily limit hit on ${label} — no more ${platform.name} posts this day!`
    : pct >= 0.67 ? `⚠️ ${count}/${dailyLimit} posts on ${label} — approaching daily limit`
    : count === 0 ? `No posts scheduled on ${label}`

function updateSidebarDate(y, m, d) {

function updateQueueSetting(key, val) {
  state.queueSettings[key] = val;

  const prev = document.getElementById('queue-preview');
